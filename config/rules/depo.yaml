version: "1.0.0"
aplica:
  - "DEPO"
strategy: "ascending_first_match"
catalogos:
  - "BINES_AMEX"
reglas:
  tasaIntercambio: "VALOR_TOTAL - VALOR_INTERCAMBIO_2; invertir signo para TIPO_MOVIMIENTO=26"
  amex: "clasificación mediante catálogo BINES_AMEX"
  cuenta: "7 reglas ordenadas"
  tii: "clasificación por AMEX/oficina/movimiento/tasa"
  comisionAtm: "TIPO_MOVIMIENTO in [02,42] y COD_OFICINA!=0090"
  tii5130: "TII inter + AMEX INTERNACIONAL => 017-TII AMEX INTERNACIONAL"
hallazgos:
  -
    codigo: "DEPO_COMISION_ATM_TEXTO"
    encabezado: "$2.888"
    formulaExcel: "$3.088"
    estado: "PENDIENTE_VALIDACION_FUNCIONAL"
