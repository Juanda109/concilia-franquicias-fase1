data:
  00_concilia_fase1_ddl_21_tablas.sql: "-- 01 CON_JORNADA\r\nCREATE TABLE IF NOT EXISTS CON_JORNADA (\r\n ID_JORNADA BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,\r\n FECHA_CONTABLE DATE NOT NULL UNIQUE, ESTADO VARCHAR(30) NOT NULL,\r\n ARCHIVOS_ESPERADOS SMALLINT NOT NULL DEFAULT 12 CHECK (ARCHIVOS_ESPERADOS=12),\r\n ARCHIVOS_RECIBIDOS SMALLINT NOT NULL DEFAULT 0, ARCHIVOS_PROCESADOS SMALLINT NOT NULL DEFAULT 0,\r\n ARCHIVOS_PENDIENTES SMALLINT NOT NULL DEFAULT 12, TOTAL_REGISTROS BIGINT NOT NULL DEFAULT 0,\r\n PORCENTAJE_AVANCE NUMERIC(5,2) NOT NULL DEFAULT 0,\r\n FECHA_INICIO TIMESTAMPTZ, FECHA_ULTIMA_ACTUALIZACION TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP\r\n);\r\n\r\n-- 02 CON_INSUMO_ESPERADO\r\nCREATE TABLE IF NOT EXISTS CON_INSUMO_ESPERADO (\r\n ID_INSUMO BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, FUENTE VARCHAR(30) NOT NULL,\r\n TIPO_INSUMO VARCHAR(40) NOT NULL UNIQUE, PATRON_ARCHIVO VARCHAR(300), FORMATO VARCHAR(30) NOT NULL,\r\n OBLIGATORIO BOOLEAN NOT NULL DEFAULT TRUE, ORDEN_VISUAL SMALLINT NOT NULL UNIQUE,\r\n ESTADO_DESARROLLO VARCHAR(40) NOT NULL, VIGENTE_DESDE DATE, VIGENTE_HASTA DATE, ACTIVO BOOLEAN NOT NULL DEFAULT TRUE\r\n);\r\n\r\n-- 03 CON_ARCHIVO_CARGA\r\nCREATE TABLE IF NOT EXISTS CON_ARCHIVO_CARGA (\r\n ID_ARCHIVO BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,\r\n ID_JORNADA BIGINT NOT NULL REFERENCES CON_JORNADA(ID_JORNADA),\r\n ID_INSUMO BIGINT NOT NULL REFERENCES CON_INSUMO_ESPERADO(ID_INSUMO),\r\n NOMBRE_ARCHIVO VARCHAR(500), FECHA_ARCHIVO DATE, TOTAL_REGISTROS BIGINT,\r\n REGISTROS_PROCESADOS BIGINT NOT NULL DEFAULT 0,\r\n ESTADO_RECEPCION VARCHAR(30) NOT NULL, ESTADO_PROCESAMIENTO VARCHAR(30) NOT NULL,\r\n NUMERO_INTENTO INTEGER NOT NULL DEFAULT 0, MAXIMO_INTENTOS INTEGER NOT NULL DEFAULT 3,\r\n NUMERO_REPROCESO INTEGER NOT NULL DEFAULT 0, MOTIVO_ESTADO TEXT, CORRELATION_ID VARCHAR(120) NOT NULL,\r\n FECHA_LIMITE_RECEPCION TIMESTAMPTZ, FECHA_CAMBIO_ESTADO TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,\r\n FECHA_CREACION TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP, UNIQUE(ID_JORNADA,ID_INSUMO)\r\n);\r\n\r\n-- 04 CON_CONTROL_ARCHIVO\r\nCREATE TABLE IF NOT EXISTS CON_CONTROL_ARCHIVO (\r\n ID_CONTROL BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,\r\n ID_ARCHIVO BIGINT NOT NULL REFERENCES CON_ARCHIVO_CARGA(ID_ARCHIVO), TIPO_CONTROL VARCHAR(80) NOT NULL,\r\n ESPERADO_REGISTROS BIGINT, OBTENIDO_REGISTROS BIGINT, ESPERADO_VALOR NUMERIC(24,4), OBTENIDO_VALOR NUMERIC(24,4),\r\n ESTADO VARCHAR(30) NOT NULL, DETALLE JSONB, FECHA_CONTROL TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP\r\n);\r\n\r\n-- 05 CON_TRAZABILIDAD\r\nCREATE TABLE IF NOT EXISTS CON_TRAZABILIDAD (\r\n ID_TRAZA BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, ID_JORNADA BIGINT REFERENCES CON_JORNADA(ID_JORNADA),\r\n ID_ARCHIVO BIGINT REFERENCES CON_ARCHIVO_CARGA(ID_ARCHIVO), ETAPA VARCHAR(40) NOT NULL,\r\n ESTADO_ANTERIOR VARCHAR(40), ESTADO_NUEVO VARCHAR(40) NOT NULL, EVENTO VARCHAR(100) NOT NULL,\r\n DETALLE JSONB, CORRELATION_ID VARCHAR(120) NOT NULL,\r\n USUARIO_SUB VARCHAR(100), USUARIO_EMAIL VARCHAR(200),\r\n FECHA_EVENTO TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP\r\n);\r\n\r\n-- 06 CON_ERROR_REGISTRO\r\nCREATE TABLE IF NOT EXISTS CON_ERROR_REGISTRO (\r\n ID_ERROR BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,\r\n ID_ARCHIVO BIGINT NOT NULL REFERENCES CON_ARCHIVO_CARGA(ID_ARCHIVO), NUMERO_LINEA BIGINT,\r\n TIPO_INSUMO VARCHAR(40) NOT NULL, ETAPA VARCHAR(40) NOT NULL, CAMPO VARCHAR(120), VALOR_ORIGEN TEXT,\r\n CODIGO_ERROR VARCHAR(80) NOT NULL, MENSAJE TEXT NOT NULL, DETALLE JSONB, CORRELATION_ID VARCHAR(120) NOT NULL,\r\n FECHA_ERROR TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP\r\n);\r\nCREATE INDEX IF NOT EXISTS IX_CON_ERROR_REGISTRO_ARCHIVO_LINEA ON CON_ERROR_REGISTRO(ID_ARCHIVO,NUMERO_LINEA);\r\n\r\n-- 07 CON_PARAMETRO_BIN_RED\r\nCREATE TABLE IF NOT EXISTS CON_PARAMETRO_BIN_RED (\r\n ID_PARAMETRO BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, TIPO_CATALOGO VARCHAR(40) NOT NULL,\r\n BIN_DESDE VARCHAR(12) NOT NULL, BIN_HASTA VARCHAR(12) NOT NULL, RED VARCHAR(40), TIPO_TARJETA VARCHAR(40),\r\n FRANQUICIA VARCHAR(40), CLASIFICACION VARCHAR(80), VIGENTE_DESDE DATE, VIGENTE_HASTA DATE, ACTIVO BOOLEAN NOT NULL DEFAULT TRUE\r\n);\r\n\r\n-- 08 CON_PARAMETRO_CLASIFICACION\r\nCREATE TABLE IF NOT EXISTS CON_PARAMETRO_CLASIFICACION (\r\n ID_PARAMETRO BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, CODIGO_REGLA VARCHAR(80) NOT NULL,\r\n TIPO_INSUMO VARCHAR(40) NOT NULL, PRIORIDAD INTEGER NOT NULL, CONDICIONES JSONB NOT NULL, RESULTADO JSONB NOT NULL,\r\n VERSION INTEGER NOT NULL DEFAULT 1, VIGENTE_DESDE DATE, VIGENTE_HASTA DATE, ACTIVO BOOLEAN NOT NULL DEFAULT TRUE,\r\n UNIQUE(CODIGO_REGLA,VERSION)\r\n);\r\n\r\n-- 09 CON_HA22_RESULTADO\r\nCREATE TABLE IF NOT EXISTS CON_HA22_RESULTADO (\r\n  ID_HA22_RESULTADO BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,\r\n  ID_ARCHIVO BIGINT NOT NULL REFERENCES CON_ARCHIVO_CARGA(ID_ARCHIVO),\r\n  NUMERO_LINEA BIGINT,\r\n  TX_ORIGEN VARCHAR(500),\r\n  TABLA_ORIGEN VARCHAR(500),\r\n  EMPRESA VARCHAR(500),\r\n  NUCTA VARCHAR(500),\r\n  CEORIGEN VARCHAR(500),\r\n  CEDESTIN VARCHAR(500),\r\n  FECON DATE,\r\n  FEPROC DATE,\r\n  NUMAS VARCHAR(500),\r\n  NUMAP VARCHAR(500),\r\n  DEBE NUMERIC(24,4),\r\n  HABER NUMERIC(24,4),\r\n  CLACON VARCHAR(500),\r\n  DESCON VARCHAR(500),\r\n  TIPAPUN VARCHAR(500),\r\n  NUMDO VARCHAR(500),\r\n  OBSERV VARCHAR(500),\r\n  OBSERV2 VARCHAR(500),\r\n  CODUSU VARCHAR(500),\r\n  HORATR TIME,\r\n  FECHA_CREACION TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP\r\n);\r\nCREATE INDEX IF NOT EXISTS IX_CON_HA22_RESULTADO_ARCHIVO ON CON_HA22_RESULTADO(ID_ARCHIVO);\r\n\r\n-- 10 CON_HA26_RESULTADO\r\nCREATE TABLE IF NOT EXISTS CON_HA26_RESULTADO (\r\n  ID_HA26_RESULTADO BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,\r\n  ID_ARCHIVO BIGINT NOT NULL REFERENCES CON_ARCHIVO_CARGA(ID_ARCHIVO),\r\n  NUMERO_LINEA BIGINT,\r\n  TX_ORIGEN VARCHAR(500),\r\n  TABLA_ORIGEN VARCHAR(500),\r\n  EMPRESA VARCHAR(500),\r\n  NUCTA VARCHAR(500),\r\n  CEORIGEN VARCHAR(500),\r\n  CEDESTIN VARCHAR(500),\r\n  FECON DATE,\r\n  FEPROC DATE,\r\n  NUMAS VARCHAR(500),\r\n  NUMAP VARCHAR(500),\r\n  DEBE NUMERIC(24,4),\r\n  HABER NUMERIC(24,4),\r\n  CLACON VARCHAR(500),\r\n  DESCON VARCHAR(500),\r\n  TIPAPUN VARCHAR(500),\r\n  HAYNUMDO VARCHAR(1),\r\n  NUMDO VARCHAR(500),\r\n  OBSERV VARCHAR(500),\r\n  OBSERV2 VARCHAR(500),\r\n  CODUSU VARCHAR(500),\r\n  HORATR TIMESTAMP(6),\r\n  FECHA_CREACION TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP\r\n);\r\nCREATE INDEX IF NOT EXISTS IX_CON_HA26_RESULTADO_ARCHIVO ON CON_HA26_RESULTADO(ID_ARCHIVO);\r\n\r\n-- 11 CON_HA32_RESULTADO\r\nCREATE TABLE IF NOT EXISTS CON_HA32_RESULTADO (\r\n  ID_HA32_RESULTADO BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,\r\n  ID_ARCHIVO BIGINT NOT NULL REFERENCES CON_ARCHIVO_CARGA(ID_ARCHIVO),\r\n  NUMERO_LINEA BIGINT,\r\n  TX_ORIGEN VARCHAR(500),\r\n  TABLA_ORIGEN VARCHAR(500),\r\n  TABLA_ORIGEN1 VARCHAR(500),\r\n  EMPRESA VARCHAR(500),\r\n  NUCTA VARCHAR(500),\r\n  CEDESTIN VARCHAR(500),\r\n  FECONT DATE,\r\n  DEBE NUMERIC(24,4),\r\n  HABER NUMERIC(24,4),\r\n  SALDO_INICIAL NUMERIC(24,4),\r\n  FECHA_CREACION TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP\r\n);\r\nCREATE INDEX IF NOT EXISTS IX_CON_HA32_RESULTADO_ARCHIVO ON CON_HA32_RESULTADO(ID_ARCHIVO);\r\n\r\n-- 12 CON_CANJE_RESULTADO\r\nCREATE TABLE IF NOT EXISTS CON_CANJE_RESULTADO (\r\n  ID_CANJE_RESULTADO BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,\r\n  ID_ARCHIVO BIGINT NOT NULL REFERENCES CON_ARCHIVO_CARGA(ID_ARCHIVO),\r\n  NUMERO_LINEA BIGINT,\r\n  TX VARCHAR(500),\r\n  BIN_DEST VARCHAR(500),\r\n  TIPO VARCHAR(500),\r\n  FECHA_CANJE VARCHAR(500),\r\n  OFI VARCHAR(500),\r\n  TARJETA VARCHAR(500),\r\n  VL_TOTAL NUMERIC(24,4),\r\n  VL_DESCUE NUMERIC(24,4),\r\n  VL_INTERC NUMERIC(24,4),\r\n  PLAZ VARCHAR(500),\r\n  MOT_COB VARCHAR(500),\r\n  IDEN_RED VARCHAR(500),\r\n  COD_ERROR VARCHAR(500),\r\n  MO_TO VARCHAR(500),\r\n  IND_CASH VARCHAR(500),\r\n  ESPACIOS VARCHAR(500),\r\n  COMISION_OP_EXITOSAS NUMERIC(24,4),\r\n  CUENTA VARCHAR(500),\r\n  CUENTAS_COMISIONES VARCHAR(500),\r\n  TII_RECIBIDA_EMISOR_VISA_OP_REVER_VENTAS NUMERIC(24,4),\r\n  XX VARCHAR(500),\r\n  CUENTA_880 VARCHAR(500),\r\n  FECHA_CREACION TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP\r\n);\r\nCREATE INDEX IF NOT EXISTS IX_CON_CANJE_RESULTADO_ARCHIVO ON CON_CANJE_RESULTADO(ID_ARCHIVO);\r\n\r\n-- 13 CON_DEPOSITO_RESULTADO\r\nCREATE TABLE IF NOT EXISTS CON_DEPOSITO_RESULTADO (\r\n  ID_DEPOSITO_RESULTADO BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,\r\n  ID_ARCHIVO BIGINT NOT NULL REFERENCES CON_ARCHIVO_CARGA(ID_ARCHIVO),\r\n  NUMERO_LINEA BIGINT,\r\n  TIPO_MOVIMIENTO VARCHAR(500),\r\n  BIN_FUENTE VARCHAR(500),\r\n  BIN_DESTINO VARCHAR(500),\r\n  FECHA_DEL_CANJE VARCHAR(500),\r\n  NUMERO_DEL_LOTE VARCHAR(500),\r\n  NUMERO_DEL_REGISTRO VARCHAR(500),\r\n  BIN_RECEPTOR VARCHAR(500),\r\n  FECHA_CONTABILIZACION VARCHAR(500),\r\n  NUMERO_SECUENCIA VARCHAR(500),\r\n  DIGITO_CHEQUEO VARCHAR(500),\r\n  COD_OFICINA VARCHAR(500),\r\n  NO_TARJETA VARCHAR(500),\r\n  NO_COMPROBANTE VARCHAR(500),\r\n  FECHA_COMPROBANTE DATE,\r\n  COD_COMERCIO VARCHAR(500),\r\n  PORCENTAJE_DESCUENTO VARCHAR(500),\r\n  COD_AUTORIZACION VARCHAR(500),\r\n  VALOR_COMPRA NUMERIC(24,4),\r\n  VALOR_PROPINA NUMERIC(24,4),\r\n  VALOR_TOTAL NUMERIC(24,4),\r\n  VALOR_DESCUENTO NUMERIC(24,4),\r\n  VALOR_INTERCAMBIO NUMERIC(24,4),\r\n  PLAZO VARCHAR(500),\r\n  MOTIVO_COBRO VARCHAR(500),\r\n  TX_ANTERIOR VARCHAR(500),\r\n  CAPTURA VARCHAR(500),\r\n  FECHA_DE_DEPOSITO VARCHAR(500),\r\n  CUENTA_DE_DEPOSITO VARCHAR(500),\r\n  NUMERO_DE_TERMINAL VARCHAR(500),\r\n  CODIGO_ALTERNO VARCHAR(500),\r\n  TIPO_DE_RED VARCHAR(500),\r\n  IDENTIFICADOR_RED_ADQUIRENTE VARCHAR(500),\r\n  COD_DE_ERROR VARCHAR(500),\r\n  IDENTIFICADOR_REG_INCONSISTENTE VARCHAR(500),\r\n  VALOR_DEL_IVA_VLOR_TRANSF NUMERIC(24,4),\r\n  VLOR_RETENCION_COMPRA VARCHAR(500),\r\n  VLOR_RETENCION_IVA VARCHAR(500),\r\n  VALOR_DEPOSITO_NETO NUMERIC(24,4),\r\n  VALOR_ICA NUMERIC(24,4),\r\n  VALOR_INTERCAMBIO_2 NUMERIC(24,4),\r\n  VALOR_IVA_A_RETORNAR NUMERIC(24,4),\r\n  INDICADOR_MO_TO_O_COMERCIO_ELECTRO VARCHAR(500),\r\n  INDICADOR_CASH_BACK VARCHAR(500),\r\n  ESPACIOS VARCHAR(500),\r\n  TASA_DE_INTERCAMBIO NUMERIC(24,4),\r\n  AMEX_NACIONAL VARCHAR(500),\r\n  CUENTA VARCHAR(500),\r\n  TII NUMERIC(24,4),\r\n  COMISIONES_ADQ_ATMS_BBV NUMERIC(24,4),\r\n  TII_5130 NUMERIC(24,4),\r\n  FECHA_CREACION TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP\r\n);\r\nCREATE INDEX IF NOT EXISTS IX_CON_DEPOSITO_RESULTADO_ARCHIVO ON CON_DEPOSITO_RESULTADO(ID_ARCHIVO);\r\n\r\n-- 14 CON_CARTA_COMP_RESULTADO\r\nCREATE TABLE IF NOT EXISTS CON_CARTA_COMP_RESULTADO (\r\n  ID_CARTA_COMP_RESULTADO BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,\r\n  ID_ARCHIVO BIGINT NOT NULL REFERENCES CON_ARCHIVO_CARGA(ID_ARCHIVO),\r\n  NUMERO_LINEA BIGINT,\r\n  SECCION VARCHAR(20) NOT NULL,\r\n  MOTIVO_CODIGO VARCHAR(60) NOT NULL,\r\n  ES_CONTROL BOOLEAN NOT NULL DEFAULT FALSE,\r\n  LADO VARCHAR(10),\r\n  CONCEPTO VARCHAR(200),\r\n  VALOR_PRINCIPAL NUMERIC(24,4),\r\n  VALOR_PROCESO NUMERIC(24,4),\r\n  VALOR_FINANCIACION NUMERIC(24,4),\r\n  VALOR_FOTOCOPIAS NUMERIC(24,4),\r\n  VALOR_RED NUMERIC(24,4),\r\n  VALOR_DEPOSITOS_ELECTRONICOS NUMERIC(24,4),\r\n  VALOR_TOTAL NUMERIC(24,4),\r\n  VALOR_OUTGOING NUMERIC(24,4),\r\n  VALOR_INCOMING NUMERIC(24,4),\r\n  FACTOR_COMPRA NUMERIC(18,4),\r\n  FACTOR_VENTA NUMERIC(18,4),\r\n  CINTA VARCHAR(20),\r\n  FECHA_CINTA DATE,\r\n  FECHA_CREACION TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP\r\n);\r\nCREATE INDEX IF NOT EXISTS IX_CON_CARTA_COMP_RESULTADO_ARCHIVO ON CON_CARTA_COMP_RESULTADO(ID_ARCHIVO);\r\n\r\n-- 15 CON_PMD_RESULTADO\r\nCREATE TABLE IF NOT EXISTS CON_PMD_RESULTADO (\r\n  ID_PMD_RESULTADO BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,\r\n  ID_ARCHIVO BIGINT NOT NULL REFERENCES CON_ARCHIVO_CARGA(ID_ARCHIVO),\r\n  NUMERO_LINEA BIGINT,\r\n  PRODUCTO_SERVICIO VARCHAR(500),\r\n  NIVEL VARCHAR(50),\r\n  DEBITO_CANTIDAD BIGINT,\r\n  DEBITO_VALOR NUMERIC(24,4),\r\n  DEBITO_COMISION_INTERCAMBIO NUMERIC(24,4),\r\n  DEBITO_COMISION_ADMIN NUMERIC(24,4),\r\n  DEBITO_NETO NUMERIC(24,4),\r\n  CREDITO_CANTIDAD BIGINT,\r\n  CREDITO_VALOR NUMERIC(24,4),\r\n  CREDITO_COMISION_INTERCAMBIO NUMERIC(24,4),\r\n  CREDITO_COMISION_ADMIN NUMERIC(24,4),\r\n  CREDITO_NETO NUMERIC(24,4),\r\n  TOTAL NUMERIC(24,4),\r\n  FECHA_CREACION TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP\r\n);\r\nCREATE INDEX IF NOT EXISTS IX_CON_PMD_RESULTADO_ARCHIVO ON CON_PMD_RESULTADO(ID_ARCHIVO);\r\n\r\n-- 16 CON_MEP_RESULTADO\r\nCREATE TABLE IF NOT EXISTS CON_MEP_RESULTADO (\r\n  ID_MEP_RESULTADO BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,\r\n  ID_ARCHIVO BIGINT NOT NULL REFERENCES CON_ARCHIVO_CARGA(ID_ARCHIVO),\r\n  NUMERO_LINEA BIGINT,\r\n  CENTRO_COSTO VARCHAR(500),\r\n  CUENTA VARCHAR(500),\r\n  DIVISA VARCHAR(500),\r\n  CONTRATO VARCHAR(500),\r\n  REFERENCIA_CRUCE VARCHAR(500),\r\n  IMPORTE NUMERIC(24,4),\r\n  DESCRIPCION VARCHAR(500),\r\n  FECHA DATE,\r\n  TIPO_DOCUMENTO VARCHAR(500),\r\n  NUMERO_DOCUMENTO VARCHAR(500),\r\n  DIGITO_VERIFICACION VARCHAR(500),\r\n  TIPO_PERDIDA VARCHAR(500),\r\n  CLASE_RIESGO VARCHAR(500),\r\n  TIPO_MOVIMIENTO VARCHAR(500),\r\n  PRODUCTO VARCHAR(500),\r\n  PROCESO VARCHAR(500),\r\n  LINEA_OPERATIVA VARCHAR(500),\r\n  VALOR_BASE NUMERIC(24,4),\r\n  FECHA_CREACION TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP\r\n);\r\nCREATE INDEX IF NOT EXISTS IX_CON_MEP_RESULTADO_ARCHIVO ON CON_MEP_RESULTADO(ID_ARCHIVO);\r\n\r\n-- 17 CON_VSS_REPORTE\r\nCREATE TABLE IF NOT EXISTS CON_VSS_REPORTE (\r\n  ID_VSS_REPORTE BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,\r\n  ID_ARCHIVO BIGINT NOT NULL REFERENCES CON_ARCHIVO_CARGA(ID_ARCHIVO),\r\n  NUMERO_LINEA BIGINT,\r\n  REPORT_ID VARCHAR(500),\r\n  REPORTING_FOR VARCHAR(500),\r\n  ROLLUP_TO VARCHAR(500),\r\n  FUNDS_XFER_ENTITY VARCHAR(500),\r\n  PROC_DATE DATE,\r\n  REPORT_DATE DATE,\r\n  SETTLEMENT_CURRENCY CHAR(3),\r\n  FECHA_CREACION TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP\r\n);\r\nCREATE INDEX IF NOT EXISTS IX_CON_VSS_REPORTE_ARCHIVO ON CON_VSS_REPORTE(ID_ARCHIVO);\r\n\r\n-- 18 CON_VSS_DETALLE\r\nCREATE TABLE IF NOT EXISTS CON_VSS_DETALLE (\r\n  ID_VSS_DETALLE BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,\r\n  ID_VSS_REPORTE BIGINT NOT NULL REFERENCES CON_VSS_REPORTE(ID_VSS_REPORTE),\r\n  NUMERO_LINEA BIGINT,\r\n  NUMERO_PAGINA BIGINT,\r\n  CLEARING_CURRENCY CHAR(3),\r\n  SECCION VARCHAR(500),\r\n  CONCEPTO VARCHAR(500),\r\n  SUBTIPO VARCHAR(500),\r\n  RATE_TABLE_ID VARCHAR(500),\r\n  COUNT BIGINT,\r\n  CLEARING_AMOUNT NUMERIC(24,4),\r\n  CREDIT_AMOUNT NUMERIC(24,4),\r\n  DEBIT_AMOUNT NUMERIC(24,4),\r\n  TOTAL_AMOUNT NUMERIC(24,4),\r\n  NATURALEZA CHAR(2),\r\n  FECHA_CREACION TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP\r\n);\r\nCREATE INDEX IF NOT EXISTS IX_CON_VSS_DETALLE_REPORTE_PAGINA ON CON_VSS_DETALLE(ID_VSS_REPORTE,NUMERO_PAGINA);\r\n\r\n-- 19 CON_PMPD1322_INCIDENCIA\r\nCREATE TABLE IF NOT EXISTS CON_PMPD1322_INCIDENCIA (\r\n  ID_PMPD1322_INCIDENCIA BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,\r\n  ID_ARCHIVO BIGINT NOT NULL REFERENCES CON_ARCHIVO_CARGA(ID_ARCHIVO),\r\n  NUMERO_LINEA BIGINT,\r\n  OFICINA VARCHAR(500),\r\n  NUMERO VARCHAR(500),\r\n  NUMERO_REFERENCIA VARCHAR(500),\r\n  CODIGO_INCIDENCIA VARCHAR(500),\r\n  RAZON VARCHAR(500),\r\n  NUMERO_TARJETA VARCHAR(500),\r\n  DESCRIPCION VARCHAR(500),\r\n  FECHA_CREACION TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP\r\n);\r\nCREATE INDEX IF NOT EXISTS IX_CON_PMPD1322_INCIDENCIA_ARCHIVO ON CON_PMPD1322_INCIDENCIA(ID_ARCHIVO);\r\n\r\n-- 20 CON_PMPD1322_OPERACION\r\nCREATE TABLE IF NOT EXISTS CON_PMPD1322_OPERACION (\r\n  ID_PMPD1322_OPERACION BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,\r\n  ID_ARCHIVO BIGINT NOT NULL REFERENCES CON_ARCHIVO_CARGA(ID_ARCHIVO),\r\n  ID_INCIDENCIA BIGINT NOT NULL REFERENCES CON_PMPD1322_INCIDENCIA(ID_PMPD1322_INCIDENCIA),\r\n  NUMERO_LINEA BIGINT,\r\n  FECHA_OPERACION DATE,\r\n  IMPORTE NUMERIC(24,4),\r\n  CODIGO_MO VARCHAR(500),\r\n  NUMERO_PAGINA BIGINT,\r\n  FECHA_CREACION TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP\r\n);\r\nCREATE INDEX IF NOT EXISTS IX_CON_PMPD1322_OPERACION_ARCHIVO ON CON_PMPD1322_OPERACION(ID_ARCHIVO);\r\n\r\n-- 21 CON_PMRD8000_RESULTADO\r\nCREATE TABLE IF NOT EXISTS CON_PMRD8000_RESULTADO (\r\n  ID_PMRD8000_RESULTADO BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,\r\n  ID_ARCHIVO BIGINT NOT NULL REFERENCES CON_ARCHIVO_CARGA(ID_ARCHIVO),\r\n  NUMERO_LINEA BIGINT,\r\n  SECCION VARCHAR(500),\r\n  DETALLE VARCHAR(500),\r\n  NUMERO_REGISTROS BIGINT,\r\n  VALOR_OPERACIONES NUMERIC(24,4),\r\n  VALOR_PROPINAS NUMERIC(24,4),\r\n  VALOR_IVA NUMERIC(24,4),\r\n  VALOR_TOTAL NUMERIC(24,4),\r\n  VALOR_DESCUENTO NUMERIC(24,4),\r\n  VALOR_INTERCAMBIO NUMERIC(24,4),\r\n  FECHA_CREACION TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP\r\n);\r\nCREATE INDEX IF NOT EXISTS IX_CON_PMRD8000_RESULTADO_ARCHIVO ON CON_PMRD8000_RESULTADO(ID_ARCHIVO);\r\n\r\n-- 22 CON_CANT_RESULTADO (CANT separado de CAET: tabla y parser independientes)\r\nCREATE TABLE IF NOT EXISTS CON_CANT_RESULTADO (\r\n  ID_CANT_RESULTADO BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,\r\n  ID_ARCHIVO BIGINT NOT NULL REFERENCES CON_ARCHIVO_CARGA(ID_ARCHIVO),\r\n  NUMERO_LINEA BIGINT,\r\n  TX VARCHAR(500),\r\n  BIN_DEST VARCHAR(500),\r\n  TIPO VARCHAR(500),\r\n  FECHA_CANJE VARCHAR(500),\r\n  OFI VARCHAR(500),\r\n  TARJETA VARCHAR(500),\r\n  VL_TOTAL NUMERIC(24,4),\r\n  VL_DESCUE NUMERIC(24,4),\r\n  VL_INTERC NUMERIC(24,4),\r\n  PLAZ VARCHAR(500),\r\n  MOT_COB VARCHAR(500),\r\n  IDEN_RED VARCHAR(500),\r\n  COD_ERROR VARCHAR(500),\r\n  MO_TO VARCHAR(500),\r\n  IND_CASH VARCHAR(500),\r\n  ESPACIOS VARCHAR(500),\r\n  COMISION_OP_EXITOSAS NUMERIC(24,4),\r\n  CUENTA VARCHAR(500),\r\n  CUENTAS_COMISIONES VARCHAR(500),\r\n  TII_RECIBIDA_EMISOR_VISA_OP_REVER_VENTAS NUMERIC(24,4),\r\n  XX VARCHAR(500),\r\n  CUENTA_880 VARCHAR(500),\r\n  FECHA_CREACION TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP\r\n);\r\nCREATE INDEX IF NOT EXISTS IX_CON_CANT_RESULTADO_ARCHIVO ON CON_CANT_RESULTADO(ID_ARCHIVO);\r\n\r\n-- 23 CON_ISS_RESULTADO (International Settlement Service: detalle de\r\n-- transferencia de fondos FTSRE de la liquidacion de VISA)\r\nCREATE TABLE IF NOT EXISTS CON_ISS_RESULTADO (\r\n  ID_ISS_RESULTADO BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,\r\n  ID_ARCHIVO BIGINT NOT NULL REFERENCES CON_ARCHIVO_CARGA(ID_ARCHIVO),\r\n  NUMERO_LINEA BIGINT,\r\n  ENTIDAD_CODIGO VARCHAR(50),\r\n  ENTIDAD_NOMBRE VARCHAR(500),\r\n  FTSRE VARCHAR(50),\r\n  NOMBRE VARCHAR(500),\r\n  MONEDA CHAR(3),\r\n  MONTO_NETO NUMERIC(24,4),\r\n  NATURALEZA CHAR(2),\r\n  FECHA_VALOR DATE,\r\n  FECHA_PROCESAMIENTO DATE,\r\n  FECHA_CREACION TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP\r\n);\r\nCREATE INDEX IF NOT EXISTS IX_CON_ISS_RESULTADO_ARCHIVO ON CON_ISS_RESULTADO(ID_ARCHIVO);\r\n"
  22_seed_insumos_esperados.sql: "INSERT INTO CON_INSUMO_ESPERADO(FUENTE,TIPO_INSUMO,PATRON_ARCHIVO,FORMATO,ORDEN_VISUAL,ESTADO_DESARROLLO) VALUES\r\n('HOST','PMPD1322','GOF.MP.FISD1.MPD1322.MP132210.MPLC5434.D1%%ODATE','TXT_REPORT',1,'FINAL'),\r\n('HOST','PMRD8000','GOF.MP.FJSD1.MRD8000.MRLS7803.F%%ODATE','TXT_REPORT',2,'FINAL'),\r\n('HOST','HA22','DESCARHA22_F<AAMMDD>.TXT','TXT_PIPE',3,'PRIORITARIO'),('HOST','HA26','DESCARHA26_F<AAMMDD>.TXT','TXT_PIPE',4,'PRIORITARIO'),\r\n('HOST','HA32','DESCARHA32_F<AAMMDD>.TXT','TXT_PIPE',5,'PRIORITARIO'),('CREDIBANCO','CAET','GOF.MRD0001.F<AAMMDD>.RD001.CAET.TXT','FIXED_WIDTH',6,'PRIORITARIO'),\r\n('CREDIBANCO','CANT','GOF.MRD0001.RD002.F<AAMMDD>.CANT.TXT','FIXED_WIDTH',7,'PRIORITARIO'),('CREDIBANCO','DEPO','GOF.E0007.GRMRV05.F<AAMMDD>.RD001.DEPO.TXT','FIXED_WIDTH',8,'PRIORITARIO'),\r\n('CREDIBANCO','CARTA_COMPENSACION','<DDMMAA>.xlsx','XLSX_CEI_240A',9,'PRIORITARIO'),\r\n('REDEBAN','PMD','PMDGeneralEntidad<AAAAMMDD>.xls','XLS_PMD_GENERAL',10,'PRIORITARIO'),\r\n('REDEBAN','MEP','MEP*.xlsx','XLSX',11,'PRIORITARIO'),('VISA','VSS','VSS*.txt','TXT_VSS',12,'PRIORITARIO'),\r\n('VISA','ISS','International  SS_Data_<AAAA-MM-DD>.pdf','PDF_ISS',13,'PRIORITARIO')\r\nON CONFLICT (TIPO_INSUMO) DO UPDATE SET PATRON_ARCHIVO=EXCLUDED.PATRON_ARCHIVO,FORMATO=EXCLUDED.FORMATO,ORDEN_VISUAL=EXCLUDED.ORDEN_VISUAL,ESTADO_DESARROLLO=EXCLUDED.ESTADO_DESARROLLO,ACTIVO=TRUE;\r\n"
