apiVersion: apps/v1
kind: Deployment
metadata:
  name: concilia-postgres
  labels:
    app: concilia-postgres
    app.kubernetes.io/name: concilia-postgres
    app.kubernetes.io/part-of: database
    app.kubernetes.io/component: database-postgresql
spec:
  replicas: 1
  strategy:
    type: Recreate   # evita dos pods montando a la vez el mismo PVC (RWO)
  selector:
    matchLabels:
      app: concilia-postgres
  template:
    metadata:
      labels:
        app: concilia-postgres
        app.kubernetes.io/name: concilia-postgres
        app.kubernetes.io/part-of: database
        app.kubernetes.io/component: database-postgresql
    spec:
      # SCC restringida de OKD: no fijamos runAsUser (lo asigna el clúster).
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # El ImageStream interno (image-registry.openshift-image-registry.svc:5000/openshift/postgresql)
          # no resuelve en este clúster (DNS interno del registry inalcanzable desde el pod:
          # visto en `oc describe pod` -> "lookup image-registry.openshift-image-registry.svc ... i/o timeout").
          # Se usa en su lugar la misma imagen que corre en producción en pqrs, en el mismo
          # dominio OKD (work.ocp.co.igrupobbva): registry externo, sin depender del registry
          # interno. Mismas variables POSTGRESQL_USER/PASSWORD/DATABASE y mismo mecanismo de
          # auto-ejecutar .sql desde /opt/app-root/src/postgresql-init (misma familia de imagen).
          image: registry.redhat.io/rhel9/postgresql-15:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: concilia-postgres-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
            - name: initdb
              mountPath: /opt/app-root/src/postgresql-init
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: concilia-postgres-data
        - name: initdb
          configMap:
            name: concilia-postgres-initdb
