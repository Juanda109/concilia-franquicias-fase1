apiVersion: v1
kind: Secret
metadata:
  name: concilia-postgres-secret
  labels:
    app: concilia-postgres
    app.kubernetes.io/name: concilia-postgres
    app.kubernetes.io/part-of: database
    app.kubernetes.io/component: database-postgresql
type: Opaque
stringData:
  # Nombres exigidos por la imagen postgresql de Red Hat/OKD (NO son
  # POSTGRES_USER/POSTGRES_DB como en la imagen de Docker Hub).
  POSTGRESQL_USER: "${POSTGRES_USER}"
  POSTGRESQL_PASSWORD: "${POSTGRES_PASSWORD}"
  POSTGRESQL_DATABASE: "${POSTGRES_DB}"
# No guardar credenciales reales en Git.
