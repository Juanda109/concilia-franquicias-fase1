apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: concilia-postgres-data
  labels:
    app: co-db-concilia
    app.kubernetes.io/name: co-db-concilia
    app.kubernetes.io/part-of: database
    app.kubernetes.io/component: database-postgresql
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
  # storageClassName: "${STORAGE_CLASS}"   # descomentar si el clúster exige una StorageClass explícita
