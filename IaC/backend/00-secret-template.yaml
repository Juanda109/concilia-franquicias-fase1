apiVersion: v1
kind: Secret
metadata:
  name: concilia-secrets
  labels:
    app.kubernetes.io/part-of: backend
type: Opaque
stringData:
  DATABASE_URL: "${DATABASE_URL}"
  SFTP_USERNAME: "${SFTP_USERNAME}"
  SFTP_PASSWORD: "${SFTP_PASSWORD}"
  # Mismas credenciales configuradas en IaC/bucket/00-secret-template.yaml
  # (MINIO_ROOT_USER/MINIO_ROOT_PASSWORD) — back y parseo se conectan como cliente.
  MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
  MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
# No guardar credenciales reales en Git.
