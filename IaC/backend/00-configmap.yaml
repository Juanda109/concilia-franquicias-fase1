apiVersion: v1
kind: ConfigMap
metadata:
  name: concilia-config
  labels:
    app.kubernetes.io/part-of: backend
data:
  DATABASE_URL: postgresql://POSTGRESQL_USER:POSTGRESQL_PASSWORD@postgres:5432/POSTGRESQL_DATABASE
  MINIO_ENDPOINT: "${MINIO_ENDPOINT}"
  MINIO_BUCKET: "${MINIO_BUCKET}"
  MINIO_SECURE: "false"
  PARSEO_API_URL: "http://co-api-parseo:8081"
  PAGE_SIZE: "30"
  MAX_PAGE_SIZE: "100"
