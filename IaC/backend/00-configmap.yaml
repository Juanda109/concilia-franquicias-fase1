apiVersion: v1
kind: ConfigMap
metadata:
  name: concilia-config
  labels:
    app.kubernetes.io/part-of: backend
data:
  # DATABASE_URL NO va aquí: un ConfigMap es texto plano, Kubernetes no sustituye
  # nombres de variable dentro de "data:". Se construye como "env:" directo en el
  # Deployment (ver co-backend-concilia/01-deployment.yaml), con la sintaxis real
  # de Kubernetes para referenciar otra env var del mismo pod: $(VAR), no ${VAR}.
  MINIO_ENDPOINT: "${MINIO_ENDPOINT}"
  MINIO_BUCKET: "${MINIO_BUCKET}"
  MINIO_SECURE: "false"
  PARSEO_API_URL: "http://co-api-parseo:8081"
  PAGE_SIZE: "30"
  MAX_PAGE_SIZE: "100"
  # Autenticacion Nauthilus (solo co-backend-concilia la usa; co-api-parseo
  # ignora estas claves sin problema, envFrom no falla por sobrantes).
  # OIDC_CLIENT_SECRET y SESSION_SIGN_KEY NO van aqui -son secretos- van en
  # el Secret "concilia-oidc" (ver IaC/README.md).
  APP_ENV: "okd"
  AUTH_ENABLED: "true"
  OIDC_CLIENT_ID: "1c29829d-3ddd-4110-8d7f-2eb8466645fd"
  OIDC_DISCOVERY_URL: "https://preidp.work.global.platform.bbva.com/oidc/.well-known/openid-configuration"
  OIDC_ISSUER: "https://preidp.work.global.platform.bbva.com/oidc/"
  OIDC_REDIRECT_URI: "https://co-ccrcs-frontend-concilia-ccrcs-genai-dev.apps.work.ocp.co.igrupobbva/"
  FRONTEND_ORIGIN: "https://co-ccrcs-frontend-concilia-ccrcs-genai-dev.apps.work.ocp.co.igrupobbva"
  # Nauthilus/GIAM entrega el rol sin el prefijo "conciliacion_adquirencias_"
  # (confirmado en logs: roles recibidos: ['Analista']). Se dejan ambas formas
  # por si en otro ambiente/claim si viniera con el prefijo completo.
  OIDC_ALLOWED_ROLES: "conciliacion_adquirencias_Administrador_Plataforma,conciliacion_adquirencias_Analista,Administrador_Plataforma,Analista"
  OIDC_ROLE_CLAIM_PATHS: "realm_access.roles,resource_access.<client_id>.roles,roles,groups"
  OIDC_ROLE_DIAGNOSTICS: "false"
  # Proxy corporativo (Zscaler) para salir a internet hacia Nauthilus.
  # httpx (usado en oidc.py) respeta estas variables automaticamente
  # (trust_env=True por defecto), sin necesidad de cambios de codigo.
  # Valores confirmados funcionando en el pod minio-0 de este mismo namespace.
  HTTP_PROXY: "http://172.17.81.140:9480"
  HTTPS_PROXY: "http://172.17.81.140:9480"
  NO_PROXY: "localhost,80.0.0.0/8,127.0.0.1,.ocp.co.igrupobbva,.co.igrupobbva,.apps.ocp.co.igrupobbva,10.96.0.0/12,kubernetes.default.svc,.svc,.cluster.local"
  http_proxy: "http://172.17.81.140:9480"
  https_proxy: "http://172.17.81.140:9480"
  no_proxy: "localhost,80.0.0.0/8,127.0.0.1,.ocp.co.igrupobbva,.co.igrupobbva,.apps.ocp.co.igrupobbva,10.96.0.0/12,kubernetes.default.svc,.svc,.cluster.local"
