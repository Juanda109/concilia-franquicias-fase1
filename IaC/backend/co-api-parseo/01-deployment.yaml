apiVersion: apps/v1
kind: Deployment
metadata:
  name: co-api-parseo
  labels:
    app: co-api-parseo
    app.kubernetes.io/name: co-api-parseo
    app.kubernetes.io/part-of: backend
    app.kubernetes.io/component: backend-parseo
    app.openshift.io/runtime: python
spec:
  replicas: 1
  selector:
    matchLabels:
      app: co-api-parseo
  template:
    metadata:
      labels:
        app: co-api-parseo
        app.kubernetes.io/name: co-api-parseo
        app.kubernetes.io/part-of: backend
        app.kubernetes.io/component: backend-parseo
    spec:
      # SCC restringida de OKD: no fijamos runAsUser (lo asigna el clúster).
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: parseo
          image: artifactory.globaldevtools.bbva.com:443/co-genai-public-cloud-docker-local/ccrcs-genai/co-ccrcs-genai-api-parseo:v2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8081
          # Mismo patrón que co-backend-concilia: envFrom antes de env para
          # que el DATABASE_URL explícito de abajo gane sobre cualquier valor
          # viejo que pueda quedar en concilia-secrets.
          envFrom:
            - configMapRef:
                name: concilia-config
            - secretRef:
                name: concilia-secrets
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRESQL_USER
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRESQL_PASSWORD
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRESQL_DATABASE
            - name: DATABASE_URL
              value: postgresql://$(POSTGRESQL_USER):$(POSTGRESQL_PASSWORD)@postgresql:5432/$(POSTGRESQL_DATABASE)
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
