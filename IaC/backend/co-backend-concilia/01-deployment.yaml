apiVersion: apps/v1
kind: Deployment
metadata:
  name: co-backend-concilia
  labels:
    app: co-backend-concilia
    app.kubernetes.io/name: co-backend-concilia
    app.kubernetes.io/part-of: backend
    app.kubernetes.io/component: backend-api
    app.openshift.io/runtime: python
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: co-backend-concilia
  template:
    metadata:
      labels:
        app: co-backend-concilia
        app.kubernetes.io/name: co-backend-concilia
        app.kubernetes.io/part-of: backend
        app.kubernetes.io/component: backend-api
    spec:
      
      containers:
        - name: backend
          image: ${IMAGE_CONCILIA_BACKEND}
          imagePullPolicy: Always
      
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # envFrom ANTES de env: así, si concilia-secrets todavía trae un
          # DATABASE_URL viejo (apuntando a nuestro propio Postgres, no al de
          # la plataforma), el DATABASE_URL explícito de abajo —el correcto—
          # siempre gana (Kubernetes resuelve por orden de aparición; lo que
          # está más abajo en el pod sobrescribe lo de más arriba).
          envFrom:
            - configMapRef:
                name: concilia-config
            - secretRef:
                name: concilia-secrets

          env:
            - name: TZ
              value: America/Bogota

            - name: APP_ENV
              value: okd
            - name: AUTH_ENABLED
              value: "true"
            - name: OIDC_CLIENT_ID
              value: 1c29829d-3ddd-4110-8d7f-2eb8466645fd
            - name: OIDC_DISCOVERY_URL
              value: https://preidp.work.global.platform.bbva.com/oidc/.well-known/openid-configuration
            - name: OIDC_ISSUER
              value: https://preidp.work.global.platform.bbva.com/oidc/
            - name: OIDC_REDIRECT_URI
              value: https://co-ccrcs-frontend-concilia-ccrcs-genai-dev.apps.work.ocp.co.igrupobbva/
            - name: FRONTEND_ORIGIN
              value: https://co-ccrcs-frontend-concilia-ccrcs-genai-dev.apps.work.ocp.co.igrupobbva
            - name: OIDC_ALLOWED_ROLES
              value: conciliacion_adquirencias_Administrador_Plataforma,conciliacion_adquirencias_Analista
            - name: OIDC_ROLE_DIAGNOSTICS
              value: "true"
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: concilia-oidc
                  key: OIDC_CLIENT_SECRET
            - name: SESSION_SIGN_KEY
              valueFrom:
                secretKeyRef:
                  name: concilia-oidc
                  key: SESSION_SIGN_KEY

            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRESQL_USER

            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRESQL_PASSWORD

            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRESQL_DATABASE

            # $(VAR) -no ${VAR}- es la sintaxis real de Kubernetes para
            # referenciar otra env var YA definida arriba en este mismo pod.
            # TODO: confirmar que el Service de Postgres real se llama
            # "postgresql" (lo inferimos de POSTGRESQL_SERVICE_HOST en el pod
            # postgresql-0, pero no lo vimos confirmado con "oc get svc").
            - name: DATABASE_URL
              value: postgresql://$(POSTGRESQL_USER):$(POSTGRESQL_PASSWORD)@postgresql:5432/$(POSTGRESQL_DATABASE)
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # Protects initial startup phase
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10

          # Determines if traffic should be routed to this pod
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Determines if the pod must be restarted
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
