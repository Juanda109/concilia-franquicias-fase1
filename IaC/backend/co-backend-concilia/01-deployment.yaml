apiVersion: apps/v1
kind: Deployment
metadata:
  name: co-backend-concilia
  labels:
    app: co-backend-concilia
    app.kubernetes.io/name: co-backend-concilia
    app.kubernetes.io/part-of: backend
    app.kubernetes.io/component: backend-api
    app.openshift.io/runtime: python
spec:
  replicas: 1
  selector:
    matchLabels:
      app: co-backend-concilia
  template:
    metadata:
      labels:
        app: co-backend-concilia
        app.kubernetes.io/name: co-backend-concilia
        app.kubernetes.io/part-of: backend
        app.kubernetes.io/component: backend-api
    spec:
      # SCC restringida de OKD: no fijamos runAsUser (lo asigna el clúster).
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ${IMAGE_CONCILIA_BACKEND}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: concilia-config
            - secretRef:
                name: concilia-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
