# Pod de un solo uso: copia el contenido de postgresql-data (10Gi) a
# postgresql-data-v2 (5Gi). NO está en ningún kustomization: se aplica a mano
# siguiendo IaC/migracion-pvc/README.md, con el StatefulSet postgresql en 0
# réplicas (si no, el volumen RWO sigue tomado y la copia no sería consistente).
apiVersion: v1
kind: Pod
metadata:
  name: copiar-pvc-postgresql
  labels:
    app.kubernetes.io/part-of: database
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: copiar
      # Misma imagen que el StatefulSet: ya se sabe que el pull funciona y trae tar.
      image: registry.redhat.io/rhel9/postgresql-15:latest
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      command: ["bash", "-c"]
      args:
        - |
          set -euo pipefail
          echo "Origen:";  du -sh /origen;  find /origen -path /origen/lost+found -prune -o -type f -print | wc -l
          if [ -n "$(ls -A /destino | grep -v '^lost+found$' || true)" ]; then
            echo "ERROR: /destino no está vacío, no se copia nada."; exit 1
          fi
          # tar conserva permisos (PGDATA exige 0700) y fechas; lost+found es de root y se omite.
          (cd /origen && tar cf - --exclude=./lost+found .) | (cd /destino && tar xpf -)
          echo "Destino:"; du -sh /destino; find /destino -path /destino/lost+found -prune -o -type f -print | wc -l
          echo "COPIA OK"
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {cpu: 500m, memory: 512Mi}
      volumeMounts:
        - name: origen
          mountPath: /origen
          readOnly: true
        - name: destino
          mountPath: /destino
  volumes:
    - name: origen
      persistentVolumeClaim:
        claimName: postgresql-data
        readOnly: true
    - name: destino
      persistentVolumeClaim:
        claimName: postgresql-data-v2
