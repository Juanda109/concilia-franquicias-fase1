# Pod de un solo uso: copia el contenido de minio-data-pvc (50Gi) a
# minio-data-v2 (10Gi). NO está en ningún kustomization: se aplica a mano
# siguiendo IaC/migracion-pvc/README.md, con el StatefulSet minio en 0 réplicas.
# MinIO/AIStor de un solo disco guarda los objetos como archivos normales en
# /data (incluido .minio.sys con la configuración), así que basta con copiar
# el directorio completo con el servidor detenido.
apiVersion: v1
kind: Pod
metadata:
  name: copiar-pvc-minio
  labels:
    app.kubernetes.io/part-of: document-validation
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: copiar
      # Se usa la imagen de postgres solo porque trae bash/tar y su pull ya
      # está probado en el clúster; no se ejecuta postgres.
      image: registry.redhat.io/rhel9/postgresql-15:latest
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      command: ["bash", "-c"]
      args:
        - |
          set -euo pipefail
          echo "Origen:";  du -sh /origen;  find /origen -path /origen/lost+found -prune -o -type f -print | wc -l
          if [ -n "$(ls -A /destino | grep -v '^lost+found$' || true)" ]; then
            echo "ERROR: /destino no está vacío, no se copia nada."; exit 1
          fi
          (cd /origen && tar cf - --exclude=./lost+found .) | (cd /destino && tar xpf -)
          echo "Destino:"; du -sh /destino; find /destino -path /destino/lost+found -prune -o -type f -print | wc -l
          echo "COPIA OK"
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {cpu: 500m, memory: 512Mi}
      volumeMounts:
        - name: origen
          mountPath: /origen
          readOnly: true
        - name: destino
          mountPath: /destino
  volumes:
    - name: origen
      persistentVolumeClaim:
        claimName: minio-data-pvc
        readOnly: true
    - name: destino
      persistentVolumeClaim:
        claimName: minio-data-v2
