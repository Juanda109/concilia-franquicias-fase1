apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: concilia-minio-data
  labels:
    app: co-bucket-concilia
    app.kubernetes.io/name: co-bucket-concilia
    app.kubernetes.io/part-of: bucket
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
