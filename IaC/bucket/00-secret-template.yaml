apiVersion: v1
kind: Secret
metadata:
  name: concilia-minio-secret
  labels:
    app: concilia-minio
    app.kubernetes.io/name: concilia-minio
    app.kubernetes.io/part-of: bucket
type: Opaque
stringData:
  MINIO_ROOT_USER: "${MINIO_ACCESS_KEY}"
  MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY}"
# Mismas credenciales que MINIO_ACCESS_KEY/MINIO_SECRET_KEY en concilia-secrets
# (back y parseo se conectan como cliente con esas mismas claves).
# No guardar credenciales reales en Git.
