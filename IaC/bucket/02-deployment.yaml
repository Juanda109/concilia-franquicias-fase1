apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  labels:
    app: minio
    app.kubernetes.io/part-of: document-validation
spec:
  serviceName: minio-headless
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
        app.kubernetes.io/part-of: document-validation
    spec:
      serviceAccountName: default
      imagePullSecrets:
        - name: artifactory-auth
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          # AIStor (MinIO comercial): sustituye al minio/minio@sha256:... de
          # antes. Imagen directo de quay.io (confirmado que si funciona el
          # pull para esta imagen, a diferencia de minio/minio community que
          # daba "unauthorized" - ver comentario en docker-compose.yml). Si
          # quay.io/minio/aistor es un repo privado/con licencia, puede
          # necesitar un imagePullSecret propio (no el de Artifactory de
          # abajo, que es para otro registry) - agregarlo a imagePullSecrets
          # si el pull falla por auth en vez de por timeout/DNS.
          # TODO: fijar un tag/digest concreto en vez de :latest.
          image: quay.io/minio/aistor/minio:latest
          imagePullPolicy: Always
          args:
            - server
            - /data
            - --console-address
            - :9001
            - --license
            - /minio.license
          env:
            # El Secret "minio-secret" se crea directamente en OKD (seccion
            # Secrets), no se versiona en este repo.
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_BROWSER_REDIRECT
              value: "false"
          ports:
            - name: s3-api
              containerPort: 9000
              protocol: TCP
            - name: console
              containerPort: 9001
              protocol: TCP
          startupProbe:
            httpGet:
              path: /minio/health/live
              port: s3-api
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3-api
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3-api
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1500m"
              memory: 4Gi
          volumeMounts:
            - name: minio-data
              mountPath: /data
            # El Secret "minio-license" se crea directamente en OKD (igual
            # que minio-secret), no se versiona en este repo - ver IaC/README.md.
            - name: minio-license
              mountPath: /minio.license
              subPath: minio.license
              readOnly: true
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-data-pvc
        - name: minio-license
          secret:
            secretName: minio-license
