apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: concilia-frontend
  labels:
    app.kubernetes.io/part-of: frontend
spec:
  # Host lo asigna la plataforma. Este es el punto de entrada real de los
  # usuarios finales — el back ya no necesita su propia Route pública si el
  # front es el único que la gente visita (el front le habla al back por
  # DNS interno vía /api/, ver frontend/nginx.container.conf).
  host: ${OKD_ROUTE_HOST}
  to:
    kind: Service
    name: concilia-frontend
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
