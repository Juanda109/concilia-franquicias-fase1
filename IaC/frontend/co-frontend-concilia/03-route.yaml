apiVersion: route.openshift.io/v1
kind: Route
metadata:
  # El cluster arma la URL final como <name>-<namespace>.<dominio>, por eso
  # el nombre de esta Route queda fijo asi para que la URL resultante sea
  # https://co-ccrcs-frontend-concilia-ccrcs-genai-dev.apps.work.ocp.co.igrupobbva/
  name: co-ccrcs-frontend-concilia
  labels:
    app: co-ccrcs-frontend-concilia
    app.kubernetes.io/component: co-ccrcs-frontend-concilia
    app.kubernetes.io/instance: co-ccrcs-frontend-concilia
    app.kubernetes.io/name: co-ccrcs-frontend-concilia
    app.kubernetes.io/part-of: frontend
spec:
  to:
    kind: Service
    name: co-frontend-concilia
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
