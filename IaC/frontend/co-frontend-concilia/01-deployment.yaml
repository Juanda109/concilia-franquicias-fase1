apiVersion: apps/v1
kind: Deployment
metadata:
  name: co-frontend-concilia
  labels:
    app: co-frontend-concilia
    app.kubernetes.io/component: co-frontend-concilia
    app.kubernetes.io/instance: co-frontend-concilia
    app.kubernetes.io/name: co-frontend-concilia
    app.kubernetes.io/part-of: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: co-frontend-concilia
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: co-frontend-concilia
        deployment: co-frontend-concilia
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      schedulerName: default-scheduler
      containers:
        - name: co-frontend-concilia
          image: 'artifactory.globaldevtools.bbva.com:443/co-genai-public-cloud-docker-local/ccrcs-genai/co-ccrcs-frontend-concilia:v1'
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          resources: {}
          # Montamos carpetas temporales para que Nginx no lance "Permission denied"
          volumeMounts:
            - name: tmp-run
              mountPath: /run
            - name: tmp-cache
              mountPath: /var/cache/nginx
            - name: tmp-log
              mountPath: /var/log/nginx
      # Volúmenes en memoria efímeros con permisos de escritura
      volumes:
        - name: tmp-run
          emptyDir: {}
        - name: tmp-cache
          emptyDir: {}
        - name: tmp-log
          emptyDir: {}
