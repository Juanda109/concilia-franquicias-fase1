apiVersion: apps/v1
kind: Deployment
metadata:
  name: co-frontend-concilia
  labels:
    app: co-frontend-concilia
    app.kubernetes.io/name: co-frontend-concilia
    app.kubernetes.io/part-of: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: co-frontend-concilia
  template:
    metadata:
      labels:
        app: co-frontend-concilia
        app.kubernetes.io/name: co-frontend-concilia
        app.kubernetes.io/part-of: frontend
    spec:
      # SCC restringida de OKD: no fijamos runAsUser (lo asigna el clúster).
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ${IMAGE_CONCILIA_FRONTEND}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
