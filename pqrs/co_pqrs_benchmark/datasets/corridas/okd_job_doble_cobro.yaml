# Corrida one-off del benchmark con el dataset doble_cobro, SIN MinIO.
# Pegar completo en la consola de OKD (+ Import YAML), namespace pqr-genai-dev.
# El dataset entra como ConfigMap montado; el NDJSON sale por stdout (queda en
# los logs del pod) y el resumen se imprime al final del log.
apiVersion: v1
kind: ConfigMap
metadata:
  name: benchmark-doble-cobro-dataset
  labels:
    app: co-pqrs-benchmark
data:
  doble_cobro_routing.json: |
    [
      {
        "question": "Me cobraron dos veces.",
        "expect_output": "doble_cobro",
        "nota": "sanity: ejemplo literal del catalogo"
      },
      {
        "question": "La web se quedó cargando y después aparecieron dos cargos.",
        "expect_output": "doble_cobro",
        "nota": "sanity: ejemplo literal del catalogo (reintento tecnico)"
      },
      {
        "question": "Tengo una compra pendiente y otra ya cobrada.",
        "expect_output": "doble_cobro",
        "nota": "sanity: ejemplo literal del catalogo (retencion + cobro)"
      },
      {
        "question": "Me pasaron la tarjeta dos veces.",
        "expect_output": "doble_cobro",
        "nota": "sanity: ejemplo literal del catalogo"
      },
      {
        "question": "Pagué una sola vez en el supermercado y en la app me aparecen dos débitos por el mismo valor.",
        "expect_output": "doble_cobro",
        "nota": "generalizacion: parafraseo no presente en el catalogo"
      },
      {
        "question": "El datáfono se quedó pensando y la cajera volvió a pasar mi tarjeta, ahora tengo dos cargos.",
        "expect_output": "doble_cobro",
        "nota": "generalizacion: reintento presencial"
      },
      {
        "question": "Hice un pago por PSE y se me descontó la plata doble.",
        "expect_output": "doble_cobro",
        "nota": "generalizacion: canal PSE, vocabulario coloquial"
      },
      {
        "question": "En el extracto sale repetido el pago del restaurante de anoche.",
        "expect_output": "doble_cobro",
        "nota": "generalizacion: sin la palabra cobro ni duplicado"
      },
      {
        "question": "Me llegaron dos notificaciones de compra por el mismo valor en el mismo almacén.",
        "expect_output": "doble_cobro",
        "nota": "generalizacion: senal indirecta (notificaciones)"
      },
      {
        "question": "El peaje me lo cobraron dos veces seguidas.",
        "expect_output": "doble_cobro",
        "nota": "generalizacion: comercio no retail"
      },
      {
        "question": "Compré por internet, la página se cayó y al final quedaron dos cobros iguales.",
        "expect_output": "doble_cobro",
        "nota": "generalizacion: fallo tecnico en linea"
      },
      {
        "question": "Aparece el mismo débito duplicado en mi cuenta de ahorros.",
        "expect_output": "doble_cobro",
        "nota": "generalizacion: producto cuenta, no tarjeta"
      },
      {
        "question": "Cancelé con tarjeta en la droguería y quedó el cargo repetido.",
        "expect_output": "doble_cobro",
        "nota": "generalizacion: 'cancele' como sinonimo de pagar"
      },
      {
        "question": "Intenté pagar, salió error, volví a intentar y ahora veo los dos pagos cobrados.",
        "expect_output": "doble_cobro",
        "nota": "generalizacion: reintento tras error"
      },
      {
        "question": "Uber me cobró el mismo viaje dos veces.",
        "expect_output": "doble_cobro",
        "nota": "generalizacion: comercio de app"
      },
      {
        "question": "Veo un cargo aprobado y otro en proceso por la misma compra.",
        "expect_output": "doble_cobro",
        "nota": "generalizacion: variante de retencion + cobro"
      },
      {
        "question": "Hay una compra en mi tarjeta que yo no hice.",
        "expect_output": "trx_no_reconocida",
        "nota": "frontera: desconoce la operacion -> NO es doble cobro"
      },
      {
        "question": "Me descontaron una plata que no reconozco de mi cuenta.",
        "expect_output": "trx_no_reconocida",
        "nota": "frontera: no reconoce el debito"
      },
      {
        "question": "Aparecen dos compras que no reconozco en mi extracto.",
        "expect_output": "trx_no_reconocida",
        "nota": "frontera DURA: dice 'dos' pero las DESCONOCE -> trx, no doble_cobro"
      },
      {
        "question": "Perdí mi tarjeta y ahora veo cargos que no son míos.",
        "expect_output": "trx_no_reconocida",
        "nota": "frontera: posible fraude por perdida"
      },
      {
        "question": "Me siguen cobrando la suscripción de Netflix que ya cancelé.",
        "expect_output": "pqrs_no_ruteo",
        "follow_ups": [
          "Quiero reclamar por un cobro recurrente de una suscripción que ya cancelé."
        ],
        "nota": "frontera: cobro RECURRENTE, no puntual -> formulario (caso real ago-2026)"
      },
      {
        "question": "Cada mes me descuentan un seguro que nunca autoricé.",
        "expect_output": "pqrs_no_ruteo",
        "follow_ups": [
          "Reclamo por el cobro mensual de un seguro que no autoricé."
        ],
        "nota": "frontera: cobro periodico de poliza -> formulario"
      },
      {
        "question": "El gimnasio me sigue debitando la mensualidad aunque terminé el contrato.",
        "expect_output": "pqrs_no_ruteo",
        "follow_ups": [
          "Reclamo por una mensualidad que me siguen debitando tras terminar el contrato."
        ],
        "nota": "frontera: domiciliacion recurrente -> formulario"
      },
      {
        "question": "Hice la compra pero me cobraron más de lo que costaba.",
        "expect_output": "pqrs_no_ruteo",
        "follow_ups": [
          "Reclamo porque el valor cobrado es más alto que el valor de la compra."
        ],
        "nota": "frontera: valor incorrecto (un solo cobro), ruta aun no disponible -> formulario"
      },
      {
        "question": "Reconozco el pago pero el valor que me descontaron no es el correcto.",
        "expect_output": "pqrs_no_ruteo",
        "follow_ups": [
          "Reclamo por un valor descontado incorrecto en un pago que sí reconozco."
        ],
        "nota": "frontera: valor incorrecto, sin duplicidad"
      },
      {
        "question": "Quiero ver los movimientos de mi cuenta de este mes.",
        "expect_output": "consulta_de_movimientos",
        "nota": "control: consulta simple, sin reclamo"
      },
      {
        "question": "Necesito descargar el extracto de mi tarjeta del mes pasado.",
        "expect_output": "extractos_bancarios",
        "nota": "control: extracto, sin reclamo"
      },
      {
        "question": "¿Por qué me están cobrando cuota de manejo?",
        "expect_output": "cuota_de_manejo",
        "nota": "control: 'me estan cobrando' sin duplicidad -> cuota de manejo"
      }
    ]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: benchmark-doble-cobro-manual
  labels:
    app: co-pqrs-benchmark
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: co-pqrs-benchmark
    spec:
      restartPolicy: Never
      volumes:
        - name: dataset
          configMap:
            name: benchmark-doble-cobro-dataset
      containers:
        - name: co-pqr-benchmark
          image: quay.apps.work.ocp.co.igrupobbva/pqr-genai/co_pqrs_benchmark:v8
          imagePullPolicy: Always
          command: ["python", "main.py"]
          envFrom:
            - configMapRef:
                name: conf-pqrs-benchmark-env
          env:
            - name: TZ
              value: "America/Bogota"
            # Dataset desde el ConfigMap y salida por stdout: ni entrada ni
            # salida tocan MinIO, todo queda en los logs del pod.
            - name: MINIO_ENABLED
              value: "false"
            - name: INPUT_JSON
              value: /data/input/doble_cobro_routing.json
            - name: OUTPUT_JSON
              value: /dev/stdout
            - name: SUMMARY_TXT
              value: /tmp/summary.txt
            # Eventos benchmark.* por RabbitMQ (mismo exchange que el agente).
            # Se repiten aqui los valores del ConfigMap para que el YAML sea
            # autocontenido. Fire-and-forget: sin RabbitMQ el job sigue igual.
            - name: RABBITMQ_ENABLED
              value: "true"
            - name: RABBITMQ_HOST
              value: rabbitmq.pqr-genai-dev.svc.cluster.local
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_VHOST
              value: "/"
            - name: RABBITMQ_EXCHANGE
              value: pqr.events
            - name: RABBITMQ_EXCHANGE_TYPE
              value: topic
            - name: BENCHMARK_SOURCE
              value: "benchmark"
            - name: RUN_NAME
              value: "doble_cobro_manual"
            - name: ENVIRONMENT
              value: "dev"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: password
          volumeMounts:
            - name: dataset
              mountPath: /data/input
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
