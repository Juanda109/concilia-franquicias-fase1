[project]
name = "co-pqrs-authorization"
version = "0.1.0"
description = "Ciclo de vida de autorizaciones OOB (push + estado + timeout) para los workflows PQRS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
