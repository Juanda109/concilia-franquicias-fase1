apiVersion: apps/v1
kind: Deployment
metadata:
  name: co-pqrs-back-data
  labels:
    app: co-pqrs-back-data
    app.kubernetes.io/part-of: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: co-pqrs-back-data
  template:
    metadata:
      labels:
        app: co-pqrs-back-data
    spec:
      containers:
        - name: co-pqrs-back-data
          image: quay.apps.work.ocp.co.igrupobbva/pqr-genai/co_pqrs_back_data:1.0.7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
              protocol: TCP
          env:
            - name: TZ
              value: America/Bogota
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRESQL_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRESQL_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRESQL_DATABASE
            - name: OPENSEARCH_USER
              valueFrom:
                secretKeyRef:
                  name: conf-pqr-secret
                  key: OPENSEARCH_USER
            - name: OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: conf-pqr-secret
                  key: OPENSEARCH_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: conf-pqr-data-env
              mountPath: /app/.env
              subPath: .env

      volumes:
        - name: conf-pqr-data-env
          configMap:
            name: conf-pqr-data-env








