apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: co-pqrs-back-data-hpa
  labels:
    app: co-pqrs-back-data
    app.kubernetes.io/part-of: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: co-pqrs-back-data
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80