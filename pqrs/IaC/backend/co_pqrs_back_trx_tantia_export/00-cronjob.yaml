apiVersion: batch/v1
kind: CronJob
metadata:
  name: co-pqrs-back-trx-tantia-export
  namespace: pqr-genai-dev
  labels:
    app.kubernetes.io/name: co-pqrs-back-trx-tantia-export
    app.kubernetes.io/part-of: jobs
    app.openshift.io/runtime: python
spec:
  # 16:00 hora Bogota, LUNES A VIERNES.
  schedule: "0 16 * * 1-5"
  timeZone: "America/Bogota"
  concurrencyPolicy: Forbid
  suspend: false
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: co-pqrs-back-trx-tantia-export
            app.kubernetes.io/part-of: jobs
        spec:
          restartPolicy: Never
          containers:
          - name: trx-tantia-export
            image: quay.apps.work.ocp.co.igrupobbva/pqr-genai/co_pqrs_back_trx_tantia_export:v1
            imagePullPolicy: IfNotPresent
            env:
            - name: TZ
              value: "America/Bogota"
            - name: OPENSEARCH_URL
              value: "https://opensearch.pqr-genai-dev.svc.cluster.local:9200"
            - name: OPENSEARCH_USER
              value: admin
            - name: OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-secret
                  key: OPENSEARCH_INITIAL_ADMIN_PASSWORD
            - name: OPENSEARCH_VERIFY_CERTS
              value: "false"
            - name: TRX_CASES_INDEX
              value: "trx-no-reconocida-cases"
            - name: RUTA_PROCESO
              value: "/mnt/ada_data"
            # Subcarpeta acordada con Tantia dentro del recurso de red.
            - name: TANTIA_FOLDER_NAME
              value: "ficheros_rpa"
            # CSV separado por ";" con encabezado. Nombre DDMMAAAANotificaciones.csv
            - name: CSV_DELIMITER
              value: ";"
            # utf-8-sig: BOM para que el RPA en Windows lea bien los acentos.
            - name: CSV_ENCODING
              value: "utf-8-sig"
            # Los festivos nacionales colombianos se CALCULAN en codigo (libreria
            # holidays, incluye Ley Emiliani). Esta lista es para dias no laborales
            # ADICIONALES que no son festivos nacionales (cierre bancario, dia civico).
            - name: FESTIVOS
              value: ""
            - name: SCAN_LOOKBACK_DAYS
              value: "0"
            # Campos del detalle (operations) — CONFIGURABLES (lista de candidatos por comas).
            # responseOperati PRIMERO: es el campo que trae el codigo en el ASO real.
            - name: CAMPO_CODIGO_AUTORIZACION
              value: "responseOperati,process.responseOperati,codigo_autorizacion"
            # `interest` es el nombre exacto que devuelve el ASO real.
            - name: CAMPO_INTERES
              value: "interest,interes,valor_intereses"
            - name: LOG_LEVEL
              value: "INFO"
            resources:
              requests:
                memory: "512Mi"
                cpu: "250m"
              limits:
                memory: "1Gi"
                cpu: "500m"
            volumeMounts:
            - name: ada-data
              mountPath: /mnt/ada_data
              subPath: RECEPCION_HOST/XC/STG/automatizacion_pqrs
          volumes:
          - name: ada-data
            persistentVolumeClaim:
              claimName: smb-pvc-tx
