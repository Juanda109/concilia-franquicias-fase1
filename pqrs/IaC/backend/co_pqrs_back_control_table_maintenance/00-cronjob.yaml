# =============================================================================
# MANTENIMIENTO DEL ESQUEMA DE client-control-table
# =============================================================================
# CronJob SUSPENDIDO. No corre por horario: se lanza a demanda.
#
#   oc create job saneo-$(date +%m%d-%H%M) \
#     --from=cronjob/co-pqrs-back-control-table-maintenance -n pqr-genai
#   oc logs -n pqr-genai job/saneo-<ese-sufijo> -f
#
# Se despliega como cualquier otro modulo de IaC/backend, igual que
# co_pqrs_back_load_ada_data. NO forma parte del IaC de OpenSearch, asi que
# aplicarlo no toca ese stack ni lo reinicia.
#
# QUE PROBLEMA RESUELVE (03/09/2026)
# ----------------------------------
# El indice client-control-table de produccion se creo SIN el index template,
# asi que OpenSearch registro en el esquema cada ruta de campo que fue viendo.
# La tabla usa FECHAS como nombre de campo:
#
#   daily_categories.<YYYYMMDD>.<categoria>.count
#   monthly.<YYYY-MM>.workflows.<wf>.back_data_run_id
#
# o sea que cada dia y cada mes anaden rutas NUEVAS. El 03/09 se agoto el limite
# de 1000 campos y toda escritura empezo a responder:
#
#   400 illegal_argument_exception: Limit of total fields [1000] has been exceeded
#
# Falla la escritura del agente -que se traga la excepcion y solo deja rastro en
# el log del pod- y la de back_data. El cliente ve "En este momento no puedo
# validar el estado de tus productos en las centrales de riesgo".
#
# QUE HACE, Y QUE NO
# ------------------
#   1. dynamic:false en las ramas indexadas por fecha -> dejan de anadir campos
#      al esquema. El contenido se sigue guardando y leyendo (_source): solo
#      deja de indexarse, y nadie lo busca porque el agente lee por id.
#      Las ramas son: monthly.<YYYY-MM>, daily_categories.<YYYYMMDD>,
#      daily_sessions.<YYYYMMDD> y workflows. Se incluye tambien 'daily',
#      que el codigo actual ya NO escribe, por si quedan documentos viejos.
#   2. Sube el techo de campos, porque los ~1000 ya registrados no se pueden
#      desregistrar sin reindexar. Con el paso 1 ese margen ya no se consume.
#
#   NO borra documentos.  NO reindexa.  NO reinicia OpenSearch.
#   NO toca el index template ni el job de bootstrap.
#   Idempotente: relanzarlo no hace dano.
#
# Se usa 'dynamic:false' y NO 'enabled:false': cambiar 'enabled' sobre un objeto
# ya mapeado es un conflicto y OpenSearch lo rechaza. 'dynamic' si es
# actualizable en caliente.
#
# El job imprime la respuesta de CADA peticion y termina en fallo si alguna no
# fue reconocida, para que no haya que deducir nada de un log en silencio.
# =============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: co-pqrs-back-control-table-maintenance
  labels:
    app.kubernetes.io/name: co-pqrs-back-control-table-maintenance
    app.kubernetes.io/part-of: jobs
    app.kubernetes.io/component: mantenimiento
spec:
  # Suspendido a proposito: es una herramienta de mantenimiento, no una tarea
  # periodica. El horario existe solo porque un CronJob lo exige.
  suspend: true
  schedule: "0 3 * * *"
  timeZone: "America/Bogota"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: co-pqrs-back-control-table-maintenance
            app.kubernetes.io/part-of: jobs
        spec:
          restartPolicy: Never
          volumes:
            - name: templates
              configMap:
                name: opensearch-index-templates
                optional: true
          containers:
            - name: maintenance
              image: curlimages/curl:8.10.1
              imagePullPolicy: IfNotPresent
              env:
                - name: TZ
                  value: America/Bogota
                - name: OPENSEARCH_URL
                  value: "https://opensearch.pqr-genai-dev.svc.cluster.local:9200"
                - name: OPENSEARCH_USER
                  value: "admin"
                - name: INDEX
                  value: "client-control-table"
                - name: FIELD_LIMIT
                  value: "3000"
                # Apagado a proposito. En 'true' el job registra la plantilla,
                - name: RECREAR_INDICE
                  value: "true"
                - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: opensearch-secret
                      key: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              volumeMounts:
                - name: templates
                  mountPath: /templates
                  readOnly: true
              resources:
                requests:
                  cpu: "50m"
                  memory: 64Mi
                limits:
                  cpu: "200m"
                  memory: 128Mi
              command:
                - /bin/sh
                - -c
                - |
                  # 'set -u' si (una variable sin definir es un error real),
                  # pero NO 'set -e': el script comprueba el resultado de cada
                  # peticion a mano y acumula en FALLOS. Con 'set -e' un grep
                  # sin coincidencias -que es un resultado VALIDO y esperado-
                  # abortaria el job antes de imprimir el diagnostico.
                  set -u
                  AUTH="$OPENSEARCH_USER:$OPENSEARCH_INITIAL_ADMIN_PASSWORD"
                  OS="$OPENSEARCH_URL"

                  echo "=========================================================="
                  echo " Mantenimiento del esquema de $INDEX"
                  echo " NO borra documentos. NO reindexa. NO reinicia OpenSearch."
                  echo "=========================================================="
                  echo

                  echo "Esperando a OpenSearch en $OS ..."
                  i=0
                  until curl -ks -u "$AUTH" "$OS" >/dev/null 2>&1; do
                    i=$((i+1))
                    if [ "$i" -ge 30 ]; then
                      echo "ERROR: OpenSearch no respondio tras 150s."
                      exit 1
                    fi
                    sleep 5
                  done
                  echo "OpenSearch listo."
                  echo

                  CODE=$(curl -ks -o /dev/null -w '%{http_code}' -u "$AUTH" "$OS/$INDEX")
                  if [ "$CODE" = "404" ]; then
                    echo "ERROR: el indice $INDEX no existe (HTTP 404)."
                    echo "  Este job SOLO sanea un indice existente. Crearlo es"
                    echo "  tarea del job de bootstrap del IaC de OpenSearch."
                    exit 1
                  fi
                  if [ "$CODE" != "200" ]; then
                    echo "ERROR: respuesta inesperada consultando el indice: HTTP $CODE"
                    exit 1
                  fi
                  echo "Indice $INDEX presente (HTTP 200)."
                  echo

                  echo "--- ANTES ------------------------------------------------"
                  echo "limite de campos declarado:"
                  curl -ks -u "$AUTH" "$OS/$INDEX/_settings?flat_settings=true" \
                    | tr ',' '\n' | grep -i "total_fields.limit" \
                    || echo "  (no declarado -> 1000 por defecto)"
                  echo "----------------------------------------------------------"
                  echo

                  FALLOS=0

                  echo "[1/2] dynamic:false en las ramas indexadas por fecha ..."
                  RESP=$(curl -ks -u "$AUTH" -X PUT "$OS/$INDEX/_mapping" \
                    -H 'Content-Type: application/json' \
                    -d '{
                          "properties": {
                            "daily_categories": { "type": "object", "dynamic": false },
                            "monthly":          { "type": "object", "dynamic": false },
                            "daily_sessions":   { "type": "object", "dynamic": false },
                            "workflows":        { "type": "object", "dynamic": false },
                            "daily":            { "type": "object", "dynamic": false }
                          }
                        }')
                  echo "  respuesta: $RESP"
                  case "$RESP" in
                    *'"acknowledged":true'*)
                      echo "  OK: el esquema deja de crecer." ;;
                    *)
                      echo "  FALLO: OpenSearch no reconocio el cambio de mapping."
                      FALLOS=$((FALLOS+1)) ;;
                  esac
                  echo

                  echo "[2/2] subiendo el techo de campos a $FIELD_LIMIT ..."
                  RESP=$(curl -ks -u "$AUTH" -X PUT "$OS/$INDEX/_settings" \
                    -H 'Content-Type: application/json' \
                    -d "{ \"index.mapping.total_fields.limit\": $FIELD_LIMIT }")
                  echo "  respuesta: $RESP"
                  case "$RESP" in
                    *'"acknowledged":true'*)
                      echo "  OK: limite ampliado." ;;
                    *)
                      echo "  FALLO: OpenSearch no reconocio el cambio de settings."
                      FALLOS=$((FALLOS+1)) ;;
                  esac
                  echo

                  echo "--- DESPUES ----------------------------------------------"
                  echo "limite de campos efectivo:"
                  curl -ks -u "$AUTH" "$OS/$INDEX/_settings?flat_settings=true" \
                    | tr ',' '\n' | grep -i "total_fields.limit" \
                    || { echo "  (no declarado -> 1000 por defecto)  <-- MAL"
                         FALLOS=$((FALLOS+1)); }
                  echo

                  # La verificacion ANTERIOR era inservible: partia el JSON por '{'
                  # y mostraba el texto ANTERIOR a cada clave, no su configuracion.
                  # El job decia "completado" con una comprobacion que no comprobaba
                  # nada.
                  #
                  # Ahora se usa filter_path de OpenSearch para que la respuesta
                  # contenga UNICAMENTE el dato que se pregunta. Asi un grep si es
                  # concluyente, y no hace falta un parser de JSON (esta imagen es
                  # Alpine minima: NO trae python3).
                  echo "dynamic de las ramas indexadas por fecha:"
                  for RAMA in monthly daily_categories daily_sessions workflows daily; do
                    RESP=$(curl -ks -u "$AUTH" \
                      "$OS/$INDEX/_mapping?filter_path=*.mappings.properties.$RAMA.dynamic" \
                      2>/dev/null || echo "")
                    case "$RESP" in
                      *'"dynamic":"false"'*|*'"dynamic":false'*)
                        echo "  $RAMA: dynamic=false  OK" ;;
                      '{}'|'')
                        # filter_path devuelve {} si la rama no existe o si no tiene
                        # 'dynamic' declarado. Se distinguen preguntando por la rama.
                        EXISTE=$(curl -ks -u "$AUTH" \
                          "$OS/$INDEX/_mapping?filter_path=*.mappings.properties.$RAMA" \
                          2>/dev/null || echo "")
                        if [ "$EXISTE" = "{}" ] || [ -z "$EXISTE" ]; then
                          echo "  $RAMA: no existe todavia (la creara la plantilla)"
                        else
                          echo "  $RAMA: sin 'dynamic' declarado  <-- MAL, hereda true"
                          FALLOS=$((FALLOS+1))
                        fi ;;
                      *)
                        echo "  $RAMA: $RESP  <-- MAL, deberia ser dynamic=false"
                        FALLOS=$((FALLOS+1)) ;;
                    esac
                  done
                  echo

                  # =====================================================================
                  # CONFLICTO DE TIPO: lo que este saneamiento NO puede arreglar
                  # =====================================================================
                  # 'dynamic:false' impide MAPEAR CAMPOS NUEVOS. NO borra los que ya
                  # estan mapeados, y esos SIGUEN validando su tipo.
                  #
                  # Caso real (dev, 07/09/2026): el campo
                  #   monthly.<mes>.workflows.centrales_de_riesgo
                  #          .data.hallazgos.validaciones.hallazgos.valor
                  # se mapeo como 'text' la primera vez que llego de un cliente AL DIA,
                  # donde vale la cadena "Al dia". Un cliente CON EMBARGO trae ahi una
                  # LISTA DE OBJETOS (nombre_entidad, numero_oficio, fecha_oficio,
                  # valor_pago) y OpenSearch rechaza el documento entero:
                  #
                  #   400 mapper_parsing_exception: failed to parse field
                  #       [...hallazgos.valor] of type [text]
                  #
                  # Se vio con nitidez porque la escritura del sobre 'ok' -que lleva
                  # 'data'- fallo, y 60 ms despues la del sobre 'error' -que NO lo
                  # lleva- funciono.
                  #
                  # Para que ese campo no tenga tipo NO debe estar mapeado, y eso solo
                  # se decide al CREAR el indice, con la plantilla. En un indice que ya
                  # lo tiene mapeado hay que recrearlo (RECREAR_INDICE=true).
                  echo "conflicto de tipo (algo mapeado bajo un 'data'):"
                  CAMPOS_DATA=$(curl -ks -u "$AUTH" \
                    "$OS/$INDEX/_mapping/field/*.data.*?filter_path=**.full_name" \
                    2>/dev/null | grep -o '"full_name"' | wc -l | tr -d ' ')
                  if [ "${CAMPOS_DATA:-0}" -eq 0 ]; then
                    echo "  ningun campo mapeado bajo 'data': no hay conflicto posible"
                  else
                    echo "  ATENCION: $CAMPOS_DATA campo(s) mapeado(s) bajo un 'data'."
                    echo "    Ejemplo del que rompe en centrales:"
                    curl -ks -u "$AUTH" \
                      "$OS/$INDEX/_mapping/field/*hallazgos.valor" 2>/dev/null \
                      | head -c 300 | sed 's/^/      /'; echo
                    echo "    El saneamiento evita que el esquema CREZCA, pero los campos"
                    echo "    ya mapeados siguen validando su tipo. Si un cliente trae un"
                    echo "    objeto donde antes hubo texto, la escritura seguira dando"
                    echo "    400 mapper_parsing_exception."
                    echo "    Para cerrarlo hay que RECREAR el indice con la plantilla:"
                    echo "    relanza este job con RECREAR_INDICE=true."
                    echo "    OJO: eso BORRA los contadores de control de todos los"
                    echo "    clientes (sesiones/dia y topes por categoria). El agente"
                    echo "    los recrea por upsert en la siguiente conversacion."
                    CONFLICTO_POSIBLE=1
                  fi
                  echo "----------------------------------------------------------"
                  echo

                  # =====================================================================
                  # RECREACION: explicita, apagada por defecto y destructiva
                  # =====================================================================
                  if [ "${RECREAR_INDICE:-false}" = "true" ]; then
                    echo "=========================================================="
                    echo " RECREAR_INDICE=true"
                    echo " Registra la plantilla y recrea el indice desde cero."
                    echo " SE PIERDEN los contadores de control de TODOS los clientes."
                    echo "=========================================================="
                    PLANTILLA=/templates/client-control-table-template.json
                    if [ ! -f "$PLANTILLA" ]; then
                      echo "ERROR: no hay plantilla en $PLANTILLA."
                      echo "  Sin ella el indice se recrearia SIN proteccion, que es"
                      echo "  exactamente el estado que causa el problema."
                      echo "  Se aborta ANTES de borrar nada."
                      exit 1
                    fi
                    echo "[R1] registrando la plantilla en el clUster ..."
                    RESP=$(curl -ks -u "$AUTH" -X PUT \
                      "$OS/_index_template/client-control-table" \
                      -H 'Content-Type: application/json' \
                      --data-binary "@$PLANTILLA")
                    echo "  respuesta: $RESP"
                    case "$RESP" in
                      *'"acknowledged":true'*) echo "  OK: plantilla registrada." ;;
                      *) echo "  FALLO: no se registro la plantilla."
                         echo "  Se aborta ANTES de borrar nada."; exit 1 ;;
                    esac
                    echo "[R2] borrando el indice ..."
                    curl -ks -u "$AUTH" -X DELETE "$OS/$INDEX"; echo
                    echo "[R3] recreando (la plantilla se aplica sola) ..."
                    curl -ks -u "$AUTH" -X PUT "$OS/$INDEX"; echo
                    echo "[R4] comprobando que quedo protegido ..."
                    RESP=$(curl -ks -u "$AUTH" \
                      "$OS/$INDEX/_mapping?filter_path=*.mappings.properties.monthly.dynamic")
                    case "$RESP" in
                      *'"dynamic":"false"'*|*'"dynamic":false'*)
                        echo "  monthly.dynamic=false OK: nada dentro se mapeara." ;;
                      *) echo "  MAL: monthly no quedo con dynamic=false ($RESP)."
                         echo "  Revisa la plantilla del ConfigMap."
                         FALLOS=$((FALLOS+1)) ;;
                    esac
                    CAMPOS_DATA=$(curl -ks -u "$AUTH" \
                      "$OS/$INDEX/_mapping/field/*.data.*?filter_path=**.full_name" \
                      2>/dev/null | grep -o '"full_name"' | wc -l | tr -d ' ')
                    echo "  campos mapeados bajo 'data': ${CAMPOS_DATA:-0} (debe ser 0)"
                    [ "${CAMPOS_DATA:-0}" -eq 0 ] || FALLOS=$((FALLOS+1))
                    CONFLICTO_POSIBLE=0
                    echo "Indice recreado."
                    echo
                  elif [ "${CONFLICTO_POSIBLE:-0}" = "1" ]; then
                    echo "NOTA: hay conflicto de tipo y RECREAR_INDICE=false, asi que NO"
                    echo "  se ha tocado el indice. Lo aplicado evita que el esquema"
                    echo "  crezca, pero no resuelve el tipo ya mapeado."
                    echo
                  fi

                  if [ "$FALLOS" -ne 0 ]; then
                    echo "RESULTADO: $FALLOS comprobacion(es) fallida(s)."
                    echo "  Revisa las respuestas de arriba ANTES de probar con un"
                    echo "  cliente."
                    exit 1
                  fi

                  echo "RESULTADO: mantenimiento completado."
                  if [ "${CONFLICTO_POSIBLE:-0}" = "1" ]; then
                    echo "  PERO queda el conflicto de tipo de arriba: la consulta de un"
                    echo "  cliente CON EMBARGO puede seguir fallando. Relanza con"
                    echo "  RECREAR_INDICE=true para cerrarlo."
                    exit 0
                  fi
                  echo "  Siguiente paso: probar una consulta de centrales de punta a"
                  echo "  punta con un cliente CON EMBARGO, que es el caso que rompia."
                  echo "  El bot deberia responder en 2-3s, no en 15."
                  exit 0
