apiVersion: v1
kind: ConfigMap
metadata:
  name: conf-pqr-trxnr-env
  labels:
    app.kubernetes.io/part-of: backend
data:
  .env: |
    DATA_CSV=unifi
    # TXNR lee el CSV de identidad por ruta; DATA_CSV es el nombre que usa back_data (sin extension)
    TRX_IDENTITY_CSV_FILE=data/unifi.csv

    TRX_PRODUCTS_SOURCE=fo
    CUSTOMER_IDENTITY_SOURCE=fo   #### fo / postgres (deprecado) / mock
    TRX_SALESFORCE_SOURCE=mock   #### aso_real / mock
    TRX_SALESFORCE_MOCK_FILE=/app/data/aso_salesforce.json


    # GUARDRAIL de mocks. En DEV se permite (true) porque el ASO es el SIMULADOR y la
    
    TRX_ALLOW_MOCKS=true
    DB_HOST=postgresql.pqr-genai-dev.svc.cluster.local
    POSTGRES_PORT=5432
    POSTGRES_CONNECT_TIMEOUT=5
    TRX_POSTGRES_TABLE=ada_info_detail
    POSTGRES_TABLE_EMB=bgdtemb
    POSTGRES_TABLE_DEM=bgdtdem
    POSTGRES_TABLE_JOIN=bgdt_salida_join

    # (COMMERCIAL_INFO_* removido: TXNR es independiente; ver bloque ASO abajo)

    # ===== ASOs Transaccion No Reconocida (Fase 2) — independiente =====
    # Switch de origen: "simulator" (dev) usa ASO_SIMULATOR_URL; "real" usa ASO_REAL_URL.
    ASO_SOURCE=simulator
    # URL del simulador ASO (Service de k8s creado en IaC/backend/co_pqrs_back_trx_aso_simulator).
    ASO_SIMULATOR_URL=http://co-pqrs-back-trx-aso-simulator.pqr-genai-dev.svc.cluster.local:8050
    # URL del ASO REAL (pasarela BBVA). Se usa cuando ASO_SOURCE=real.
    ASO_REAL_URL=https://dev-arqaso.work.co.nextgen.igrupobbva:8050
    # Base exclusiva de subida de nivel: security y cards/operations.
    ASO_CHALLENGE_BASE_URL=https://aso-dev-co.work-02.nextgen.igrupobbva
    # Override manual opcional: si se define, GANA sobre ASO_SOURCE (deja vacio/comentado normalmente).
    # ASO_BASE_URL=https://dev-arqaso.work.co.nextgen.igrupobbva:8050

    # --- Credenciales grantingTicket (para el ASO REAL; el simulador las ignora) ---
    # Si TRX_TICKET_URL esta vacio, se usa {base}/TechArchitecture/co/grantingTicket/V02.
    TRX_TICKET_URL=
    TRX_API_USER_ID=ZM12035
    TRX_API_CONSUMER_ID=12000035
    TRX_API_AUTHENTICATION_TYPE=04
    TRX_API_PASSWORD=PTDada2026_PQRS
    TRX_API_VERIFY_SSL=false
    TRX_API_TIMEOUT=30
    TRX_API_CUSTOMER_ID_LENGTH=15

    # --- Endpoints ASO (configurables; {card_id} se reemplaza en runtime) ---
    ASO_SALESFORCE_PATH=/salesforce-issue-tracker/v0/issues
    ASO_FO_PATH=/financial-overview/v0/financial-overview
    ASO_OPERATIONS_PATH=/cards/v2/operations
    ASO_ACTIVATIONS_PATH=/cards/v1/cards/{card_id}/activations
    ASO_REISSUANCE_PATH=/cards/v2/operations
    # ---- Subida de nivel: notificacion push previa al bloqueo -------------
    # MISMA base URL (ASO_REAL_URL): solo cambian los paths.
    ASO_USER_STATUS_PATH=/security/v0/user-status
    ASO_ORDER_CHANNEL_PATH=/security/v0/order-chanel/{challenge}
    # Constantes del contrato del reto (fijas, configurables por ambiente).
    ASO_CHALLENGE_AUTH_TYPE=241
    ASO_CHALLENGE_CHANNEL=12000035
    ASO_CHALLENGE_SMC=SMGG20210970
    ASO_CHALLENGE_OPERATION=NMONETARY
    ASO_CHALLENGE_REASON=Fraude
    ASO_CHALLENGE_RETENTION_NAME=Titular
    ASO_CHALLENGE_DESCRIPTION=bloqueo y reexpedicion

    # Mapeo de campos ASO (financial-overview / transactions / operations).
    FO_CONTRACT_MATCH_FIELD=number
    FO_CARD_NUMBER_PATH=id
    TX_OP_ID_FIELD=id
    ECI_PATH=eci
    ECARD_PATH=eCard
    RESPONSE_OPER_PATH=responseOperati
    ECI_CHARGEBACK_SET=0,1,2,3,7
    # Vigencia por franquicia (dias) y rango de monto.
    VIGENCIA_VISA_DIAS=180
    VIGENCIA_MASTER_DIAS=120
    TRX_MONTO_MIN=35000
    TRX_MONTO_MAX=500000
    # Recurrencia-bot: 1 caso por cliente cada 6 meses.
    MAX_TRX_BOT_RECURRENCE=3
    TRX_RECURRENCIA_MESES=6
    DIAS_HABILES_DEVOLUCION=10
    # Indice durable de casos TXNR (sin TTL).
    TRX_CASES_INDEX=trx-no-reconocida-cases

    # ===== Trazas E2E hacia el error_handler (MinIO audit-logs/clients) =====
    ERROR_HANDLER_SERVICE_URL=http://co-pqrs-back-error-handler.pqr-genai-dev.svc.cluster.local:8002
    # Incluir el body ASO enmascarado+truncado en la traza (por defecto solo longitud).
    # ---- DEBUG COMPLETO DE LAS LLAMADAS ASO (diagnostico 2026-08-25) --------
    # Se traza la peticion entera: metodo, URL con query, params, headers y cuerpo.
    #
    # KYNS IT 3 (2026-09-09): el TSEC completo y la contrasena del granting ya no
    # se escriben NUNCA en las trazas; los flags ASO_TRACE_TSEC_FULL y
    # ASO_TRACE_PASSWORD_FULL se retiraron del codigo y no tienen efecto. Sale
    # una huella del TSEC (longitud + prefijo + sufijo + SHA256) que permite
    # comparar tokens entre llamadas sin exponerlos.
    ASO_TRACE_FULL_BODY=true
    TRACE_BODY_MAXLEN=4000
    # Debug E2E: guarda el body COMPLETO del ASO (sin enmascarar; nunca tsec/password). Usar solo para depurar.
    # El cuerpo completo de las respuestas del ASO ya sale ENMASCARADO cuando se
    # enciende; apagado por defecto porque duplica el volumen de trazas.
    E2E_DEBUG_TRACE=false
