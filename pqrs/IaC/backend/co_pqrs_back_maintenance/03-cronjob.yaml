apiVersion: batch/v1
kind: CronJob
metadata:
  name: co-pqrs-back-maintenance-sweep
  namespace: pqr-genai-dev
  labels:
    app: co-pqrs-back-maintenance
    app.kubernetes.io/name: co-pqrs-back-maintenance-sweep
    app.kubernetes.io/component: batch-maintenance
    app.kubernetes.io/part-of: jobs
    app.openshift.io/runtime: python
  annotations:
    app.openshift.io/display-name: "Maintenance Sweep + Export to MinIO"

spec:
  # Cierra conversaciones inactivas (>= INACTIVE_MINUTES) y exporta las cerradas
  # a MinIO. Garantiza que todas las conversaciones lleguen al bucket aunque no
  # se invoque la API /end.
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  suspend: false
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120

  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 280

      template:
        metadata:
          labels:
            app: co-pqrs-back-maintenance
            app.kubernetes.io/name: co-pqrs-back-maintenance-sweep
            app.kubernetes.io/component: batch-maintenance
            app.kubernetes.io/part-of: jobs
            app.openshift.io/runtime: python

        spec:
          restartPolicy: Never
          serviceAccountName: default

          containers:
            - name: maintenance-sweep
              image: quay.apps.work.ocp.co.igrupobbva/pqr-genai/co_pqrs_back_maintenance:v1
              imagePullPolicy: IfNotPresent

              # Ejecuta el barrido una sola vez (main.py -> run_maintenance_job).
              command: ["python", "main.py"]

              env:
                - name: TZ
                  value: America/Bogota
                # Credenciales MinIO desde el secret (override del .env montado).
                - name: MINIO_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-creds
                      key: MINIO_ROOT_USER
                - name: MINIO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-creds
                      key: MINIO_ROOT_PASSWORD

              volumeMounts:
                - name: env-config
                  mountPath: /app/.env
                  subPath: .env
                  readOnly: true

              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi

          volumes:
            - name: env-config
              configMap:
                name: conf-pqr-maintenance-env
