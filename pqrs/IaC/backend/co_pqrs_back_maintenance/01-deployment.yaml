apiVersion: apps/v1
kind: Deployment
metadata:
  name: co-pqrs-back-maintenance
  namespace: pqr-genai-dev
  labels:
    app: co-pqrs-back-maintenance
    app.kubernetes.io/part-of: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: co-pqrs-back-maintenance
      deployment: co-pqrs-back-maintenance
  template:
    metadata:
      labels:
        app: co-pqrs-back-maintenance
        deployment: co-pqrs-back-maintenance
    spec:
      serviceAccountName: default

      containers:
        - name: co-pqrs-back-maintenance
          image: quay.apps.work.ocp.co.igrupobbva/pqr-genai/co_pqrs_back_maintenance:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8001
              protocol: TCP

          # MinIO credentials are injected from the minio-creds secret.
          # These env vars override the values loaded from the mounted .env
          # (python-dotenv does not override existing environment variables).
          env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: MINIO_ROOT_PASSWORD

          volumeMounts:
            - name: env-config
              mountPath: /app/.env
              subPath: .env
              readOnly: true

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

      volumes:
        - name: env-config
          configMap:
            name: conf-pqr-maintenance-env
