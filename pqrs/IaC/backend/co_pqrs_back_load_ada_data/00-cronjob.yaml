apiVersion: batch/v1
kind: CronJob
metadata:
  name: co-pqrs-back-load-ada-data-am
  labels:
    app.kubernetes.io/name: co-pqrs-back-load-ada-data
    app.kubernetes.io/part-of: jobs
    app.openshift.io/runtime: python
spec:
  # 07:14 America/Bogota. timeZone requiere K8s >= 1.25 / OpenShift >= 4.12.
  # Si el cluster no soporta timeZone, usar UTC: "14 12 * * *".
  schedule: "14 7 * * *"
  timeZone: "America/Bogota"
  concurrencyPolicy: Forbid
  suspend: false
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: co-pqrs-back-load-ada-data
            app.kubernetes.io/part-of: jobs
        spec:
          restartPolicy: Never
          containers:
            - name: loader
              image: quay.apps.work.ocp.co.igrupobbva/pqr-genai/co_pqrs_back_load_ada_data:v2
              imagePullPolicy: IfNotPresent
              env:
                - name: TZ
                  value: America/Bogota
                - name: DB_HOST
                  value: postgresql.pqr-genai-dev.svc.cluster.local
                - name: DB_PORT
                  value: "5432"
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: postgresql-secret
                      key: POSTGRESQL_DATABASE
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgresql-secret
                      key: POSTGRESQL_USER
                - name: DB_PASS
                  valueFrom:
                    secretKeyRef:
                      name: postgresql-secret
                      key: POSTGRESQL_PASSWORD
                - name: ADA_DATA_PATH
                  value: "/mnt/ada_data"
                - name: ADA_FOLDER_PREFIX
                  value: "pqrs_ada_data_"
                - name: TARGET_TABLE
                  value: "ada_info_detail"
                - name: PARQUET_BATCH_SIZE
                  value: "100000"
                - name: DB_UNLOGGED
                  value: "true"
                - name: WORK_MEM
                  value: "256MB"
                - name: MAINTENANCE_WORK_MEM
                  value: "1GB"
                - name: MAX_PARALLEL_MAINTENANCE_WORKERS
                  value: "4"
                - name: ERROR_HANDLER_SERVICE_URL
                  value: "http://co-pqrs-back-error-handler.pqr-genai-dev.svc.cluster.local:8002"
              resources:
                requests:
                  cpu: "1"
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 3Gi
              volumeMounts:
                - name: ada-data
                  mountPath: /mnt/ada_data
                  subPath: RECEPCION_HOST/XC/STG/automatizacion_pqrs
                  readOnly: true
          volumes:
            - name: ada-data
              persistentVolumeClaim:
                claimName: smb-pvc-tx
---
