apiVersion: batch/v1
kind: Job
metadata:
  name: authorizations-bootstrap-index
  labels:
    app.kubernetes.io/part-of: jobs
  annotations:
    # Argo CD: re-ejecuta en cada sync (idempotente). Con kustomize/oc apply
    # directo, borrar el Job antes de re-aplicar para que vuelva a correr.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: authorizations-bootstrap
        app.kubernetes.io/part-of: jobs
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: bootstrap
          image: curlimages/curl:8.10.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          env:
            - name: OPENSEARCH_URL
              value: "https://opensearch:9200"
            - name: OPENSEARCH_USER
              value: "admin"
            # El indice de autorizaciones NO se borra por defecto: contiene jobs
            # en curso. Solo re-registra el template (idempotente); si un indice
            # viejo tuviera mapping incorrecto, sanearlo es manual y deliberado.
            - name: FORCE_REINDEX
              value: "false"
            - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-secret
                  key: OPENSEARCH_INITIAL_ADMIN_PASSWORD
          volumeMounts:
            - name: template
              mountPath: /templates
              readOnly: true
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              AUTH="$OPENSEARCH_USER:$OPENSEARCH_INITIAL_ADMIN_PASSWORD"
              OS="$OPENSEARCH_URL"
              INDEX="authorizations"
              MARKER="lease_until"

              echo "Esperando a OpenSearch en $OS ..."
              i=0
              until curl -ks -u "$AUTH" "$OS" >/dev/null; do
                i=$((i+1))
                if [ "$i" -ge 60 ]; then echo "OpenSearch no respondio a tiempo"; exit 1; fi
                sleep 5
              done
              echo "OpenSearch listo."

              echo "Registrando index template (idempotente) ..."
              curl -ks -u "$AUTH" -X PUT \
                "$OS/_index_template/authorizations" \
                -H 'Content-Type: application/json' \
                --data-binary @/templates/authorizations-template.json
              echo

              CODE=$(curl -ks -o /dev/null -w '%{http_code}' -u "$AUTH" "$OS/$INDEX")
              if [ "$CODE" = "404" ]; then
                echo "Indice no existe -> creando desde el template ..."
                curl -ks -u "$AUTH" -X PUT "$OS/$INDEX"; echo
                echo "Bootstrap completado (indice nuevo con mapping correcto)."
                exit 0
              fi

              echo "Indice existe (HTTP $CODE). Verificando mapping ..."
              if curl -ks -u "$AUTH" "$OS/$INDEX/_mapping" | grep -q "$MARKER"; then
                echo "Mapping correcto (marcador '$MARKER' presente). No se hace nada."
                exit 0
              fi

              echo "ATENCION: el indice existe SIN el mapping esperado (sin '$MARKER')."
              if [ "$FORCE_REINDEX" = "true" ]; then
                echo "FORCE_REINDEX=true -> borrando y recreando (SE PIERDEN jobs en curso)."
                curl -ks -u "$AUTH" -X DELETE "$OS/$INDEX"; echo
                curl -ks -u "$AUTH" -X PUT "$OS/$INDEX"; echo
                echo "Bootstrap completado (indice recreado)."
              else
                echo "FORCE_REINDEX=false -> NO se modifica el indice (contiene jobs)."
                echo "  Sanealo manualmente si de verdad tiene mapping incorrecto."
              fi
              exit 0
      volumes:
        - name: template
          configMap:
            name: authorizations-index-template
