apiVersion: v1
kind: ConfigMap
metadata:
  name: conf-pqr-authorization-env
  labels:
    app.kubernetes.io/part-of: backend
data:
  .env: |
    AUTHORIZATION_SERVICE_PORT=8005
    AUTHORIZATION_DEADLINE_SECONDS=180

    # --- worker durable ---
    AUTHORIZATION_WORKER_ENABLED=true
    AUTHORIZATION_WORKER_TICK=5
    AUTHORIZATION_RETRY_SECONDS=10
    AUTHORIZATION_LEASE_SECONDS=30
    AUTHORIZATION_WORKER_BATCH=20

    # --- persistencia (OpenSearch operativo) ---
    OPENSEARCH_URL=https://opensearch.pqr-genai-dev.svc.cluster.local:9200
    OPENSEARCH_USER=admin
    OPENSEARCH_PASS=admin
    AUTHORIZATIONS_INDEX=authorizations

    # --- trazas MinIO (via error_handler), paridad con agente/TXNR ---
    ERROR_HANDLER_SERVICE_URL=http://co-pqrs-back-error-handler.pqr-genai-dev.svc.cluster.local:8002
    OPENSEARCH_VERIFY_SSL=false

    # --- ASO: solo granting + order-chanel (el push NO vive aqui) ---
    # DEV usa el simulador; QA/PRD -> ASO_SOURCE=real + ASO_REAL_URL
    ASO_SOURCE=simulator
    ASO_SIMULATOR_URL=http://co-pqrs-back-trx-aso-simulator.pqr-genai-dev.svc.cluster.local:8050
    ASO_REAL_URL=
    ASO_CHALLENGE_BASE_URL=
    ASO_GRANTING_PATH=/TechArchitecture/co/grantingTicket/V02
    ASO_ORDER_CHANNEL_PATH=/security/v0/order-chanel/{challenge}
    TRX_API_CONSUMER_ID=12000035
    TRX_API_AUTHENTICATION_TYPE=04
    # credenciales del granting: mismas que consume TXNR; se inyectan por
    # secret/config del entorno, no se hardcodean aqui.
    TRX_API_USER_ID=
    TRX_API_PASSWORD=
