apiVersion: apps/v1
kind: Deployment
metadata:
  name: co-pqrs-authorization
  labels:
    app: co-pqrs-authorization
    app.kubernetes.io/name: co-pqrs-authorization
    app.kubernetes.io/part-of: backend
    app.kubernetes.io/component: backend-authorization
    app.kubernetes.io/version: v1
    app.openshift.io/runtime: python
spec:
  replicas: 1
  selector:
    matchLabels:
      app: co-pqrs-authorization
  template:
    metadata:
      labels:
        app: co-pqrs-authorization
        app.kubernetes.io/name: co-pqrs-authorization
        app.kubernetes.io/part-of: backend
        app.kubernetes.io/component: backend-authorization
        app.kubernetes.io/version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8005"
    spec:
      serviceAccountName: default
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      containers:
        - name: authorization
          image: quay.apps.work.ocp.co.igrupobbva/pqr-genai/co_pqrs_authorization:test_v1.0.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8005
              protocol: TCP
          env:
            - name: TZ
              value: America/Bogota
            - name: NO_PROXY
              value: "localhost,127.0.0.1,.svc,.cluster.local,co-pqrs-back-agent,co-pqrs-back-trx-noreconocida,co-pqrs-back-trx-aso-simulator,opensearch,.co.nextgen.igrupobbva"
            - name: no_proxy
              value: "localhost,127.0.0.1,.svc,.cluster.local,co-pqrs-back-agent,co-pqrs-back-trx-noreconocida,co-pqrs-back-trx-aso-simulator,opensearch,.co.nextgen.igrupobbva"
          volumeMounts:
            - name: conf-pqr-env
              mountPath: /app/.env
              subPath: .env
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "400m"
              memory: "384Mi"
      volumes:
        - name: conf-pqr-env
          configMap:
            name: conf-pqr-authorization-env
