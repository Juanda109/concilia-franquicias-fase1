apiVersion: v1
kind: ConfigMap
metadata:
  name: authorizations-index-template
  labels:
    app.kubernetes.io/part-of: backend
data:
  # Mapping EXPLICITO (regla del repo: nunca dynamic mapping para campos que se
  # filtran/ordenan; ver el desastre de 1000 campos en client-control-table).
  # Igual al _MAPPING del servicio (authorizations_store.py): el servicio lo
  # crea al arrancar y este Job lo deja registrado como template idempotente.
  authorizations-template.json: |
    {
      "index_patterns": ["authorizations*"],
      "priority": 100,
      "template": {
        "settings": {
          "number_of_shards": 1,
          "number_of_replicas": 1
        },
        "mappings": {
          "dynamic": false,
          "properties": {
            "authorization_id": { "type": "keyword" },
            "conversation_id": { "type": "keyword" },
            "workflow": { "type": "keyword" },
            "step": { "type": "keyword" },
            "challenge": { "type": "keyword" },
            "idempotency_key": { "type": "keyword" },
            "status": { "type": "keyword" },
            "technical_status": { "type": "keyword" },
            "created_at": { "type": "double" },
            "deadline": { "type": "double" },
            "next_check_at": { "type": "double" },
            "attempts": { "type": "integer" },
            "resolved_at": { "type": "double" },
            "result_published": { "type": "boolean" },
            "last_error": { "type": "text" },
            "lease_until": { "type": "double" },
            "metadata": { "type": "object", "enabled": false }
          }
        }
      }
    }
