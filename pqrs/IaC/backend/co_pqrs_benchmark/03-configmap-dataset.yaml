      },
      {
        "question": "Hice la compra pero me cobraron más de lo que costaba.",
        "expect_output": "pqrs_no_ruteo",
        "follow_ups": [
          "Reclamo porque el valor cobrado es más alto que el valor de la compra."
        ],
        "nota": "frontera: valor incorrecto (un solo cobro), ruta aun no disponible -> formulario"
      },
      {
        "question": "Reconozco el pago pero el valor que me descontaron no es el correcto.",
        "expect_output": "pqrs_no_ruteo",
        "follow_ups": [
          "Reclamo por un valor descontado incorrecto en un pago que sí reconozco."
