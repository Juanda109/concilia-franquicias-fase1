apiVersion: batch/v1
kind: CronJob
metadata:
  name: co-pqrs-benchmark
  labels:
    app: co-pqrs-benchmark
    app.kubernetes.io/part-of: benchmark
spec:
  suspend: true
  schedule: "0 3 * * *"
  timeZone: "America/Bogota"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: co-pqrs-benchmark
        spec:
          restartPolicy: Never
          containers:
            - name: co-pqr-benchmark
              image: quay.apps.work.ocp.co.igrupobbva/pqr-genai/co_pqrs_benchmark:v9
              imagePullPolicy: Always
              command: ["python", "main.py"]
              envFrom:
                - configMapRef:
                    name: conf-pqrs-benchmark-env
              env:
                - name: TZ
                  value: "America/Bogota"
                - name: MINIO_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-creds
                      key: MINIO_ROOT_USER
                - name: MINIO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-creds
                      key: MINIO_ROOT_PASSWORD
                # Resultados tambien como eventos benchmark.* en pqr.events
                # (fire-and-forget: sin RabbitMQ el job sigue igual).
                - name: RABBITMQ_ENABLED
                  value: "true"
                # El banco viene del ConfigMap montado en /data/input, no de MinIO.
                # Sin esta bandera el job buscaba el fichero como objeto de MinIO y
                # fallaba con "Input object not found in MinIO" (15/09).
                - name: MINIO_ENABLED
                  value: "false"
                - name: BENCHMARK_SOURCE
                  value: "benchmark"
                # Dataset versionado en git (ConfigMap), no el lote de MinIO.
                - name: INPUT_JSON
                  value: /data/input/doble_cobro_routing.json
                - name: RUN_NAME
                  value: benchmark_doble_cobro
                - name: RABBITMQ_USER
                  valueFrom:
                    secretKeyRef:
                      name: rabbitmq-secret
                      key: username
                - name: RABBITMQ_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: rabbitmq-secret
                      key: password
              resources:
                requests:
                  cpu: 200m
                  memory: 256Mi
                limits:
                  cpu: 1000m
                  memory: 1024Mi
              volumeMounts:
                - name: dataset
                  mountPath: /data/input
                  readOnly: true
          volumes:
            - name: dataset
              configMap:
                name: conf-pqrs-benchmark-dataset
