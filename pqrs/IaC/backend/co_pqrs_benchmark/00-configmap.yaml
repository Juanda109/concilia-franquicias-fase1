apiVersion: v1
kind: ConfigMap
metadata:
  name: conf-pqrs-benchmark-env
  labels:
    app.kubernetes.io/part-of: benchmark
data:
  API_BASE_URL: "http://co-pqrs-back-agent.pqr-genai-dev.svc.cluster.local:8000"
  MINIO_ENABLED: "true"
  MINIO_ENDPOINT_URL: "http://minio.pqr-genai-dev.svc.cluster.local:9000"
  MINIO_BUCKET: "pqr-benchmark"
  MINIO_REGION: "us-east-1"
  MINIO_ADDRESSING_STYLE: "path"
  INPUT_JSON: "input_data/user_inputs.json"
  OUTPUT_JSON: "output_data/user_output.json"
  LOG_LEVEL: "INFO"
  # Eventos benchmark.case / benchmark.run por el MISMO exchange que el agente
  # (ver IaC/backend/co_pqrs_back_agent/01-configmap.yaml). El flag
  # RABBITMQ_ENABLED y BENCHMARK_SOURCE los fija cada CronJob; las credenciales
  # llegan del Secret rabbitmq-secret (username/password), igual que en el agente.
  RABBITMQ_HOST: "rabbitmq.pqr-genai-dev.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: "/"
  RABBITMQ_EXCHANGE: "pqr.events"
  RABBITMQ_EXCHANGE_TYPE: "topic"
  RABBITMQ_PUBLISH_TIMEOUT_SECONDS: "5"
  # Identidad de la corrida en los eventos (indice pqr-benchmark-runs-*).
  ENVIRONMENT: "dev"
  # Version evaluada contra la que se mide, que enlaza cada corrida con su ficha.
  # Se estampa con scripts/stamp_catalog_version.sh <commit>, que la fija aqui y en
  # el deployment del front; "unknown" deja las corridas sin poder compararse ni
  # acreditar la trazabilidad (evidencia T19).
  CATALOG_VERSION: "2504788d"
