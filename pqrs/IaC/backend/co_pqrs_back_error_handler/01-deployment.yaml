apiVersion: apps/v1
kind: Deployment
metadata:
  name: co-pqrs-back-error-handler
  namespace: pqr-genai-dev
  labels:
    app: co-pqrs-back-error-handler
    app.kubernetes.io/name: co-pqrs-back-error-handler
    app.kubernetes.io/part-of: backend
    app.kubernetes.io/component: backend-error-handler
    app.openshift.io/runtime: python
spec:
  replicas: 1
  selector:
    matchLabels:
      app: co-pqrs-back-error-handler
  template:
    metadata:
      labels:
        app: co-pqrs-back-error-handler
        app.kubernetes.io/name: co-pqrs-back-error-handler
        app.kubernetes.io/part-of: backend
        app.kubernetes.io/component: backend-error-handler
    spec:
      serviceAccountName: default

      containers:
        - name: error-handler
          image: quay.apps.work.ocp.co.igrupobbva/pqr-genai/co_pqrs_back_error_handler:v2
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8002
              protocol: TCP

          env:
            - name: TZ
              value: America/Bogota

            # OpenSearch credentials (read-only enrichment of conversations).
            - name: OPENSEARCH_USER
              valueFrom:
                secretKeyRef:
                  name: conf-pqr-secret
                  key: OPENSEARCH_USER
            - name: OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: conf-pqr-secret
                  key: OPENSEARCH_PASSWORD

            # MinIO credentials for the audit-logs bucket.
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: MINIO_ROOT_PASSWORD

          volumeMounts:
            - name: env-config
              mountPath: /app/.env
              subPath: .env
              readOnly: true

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

      volumes:
        - name: env-config
          configMap:
            name: conf-pqr-error-handler-env
