apiVersion: batch/v1
kind: CronJob
metadata:
  name: co-pqrs-back-report
  labels:
    app.kubernetes.io/name: co-pqrs-back-report
    app.kubernetes.io/part-of: jobs
    app.openshift.io/runtime: nodejs
spec:
  # 07:00 America/Bogota. timeZone requiere K8s >= 1.25 / OpenShift >= 4.12.
  # Si el cluster no soporta timeZone, usar UTC: "0 12 * * *".
  schedule: "0 7 * * *"
  timeZone: "America/Bogota"
  concurrencyPolicy: Forbid
  suspend: false
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: co-pqrs-back-report
            app.kubernetes.io/part-of: jobs
        spec:
          restartPolicy: Never
          serviceAccountName: opensearch-analytics-sa
          containers:
            - name: report
              image: quay.apps.work.ocp.co.igrupobbva/pqr-genai/co_pqrs_back_report:v1
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: report-config
              env:
                - name: TZ
                  value: America/Bogota
                # Password del usuario 'admin' del OpenSearch analitico (para que el
                # reporting-cli inicie sesion en OSD y renderice el dashboard).
                - name: OPENSEARCH_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: opensearch-analytics-secret
                      key: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              resources:
                requests:
                  cpu: "250m"
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
