apiVersion: v1
kind: ConfigMap
metadata:
  name: report-config
  labels:
    app.kubernetes.io/name: co-pqrs-back-report
    app.kubernetes.io/part-of: jobs
data:
  # URL del dashboard en OSD analitica. REEMPLAZA <DASHBOARD_ID> por el UUID real
  # del tablero (lo ves en la URL al abrirlo: .../app/dashboards#/view/<UUID>).
  # OJO: el OSD sirve por HTTP (server.ssl.enabled: false) -> usar http.
  #
  # El RANGO DE TIEMPO va embebido en la URL (parametro _g). Para reportar el DIA
  # ANTERIOR completo se usa date-math: from=now-1d/d (inicio de ayer),
  # to=now/d (inicio de hoy). El "/" se codifica como %2F.
  #   - Dia anterior completo:  ?_g=(time:(from:now-1d%2Fd,to:now%2Fd))
  #   - Ultimas 24h (rolling):  ?_g=(time:(from:now-24h,to:now))
  DASHBOARD_URL: "http://opensearch-dashboards-analytics:5601/app/dashboards#/view/<DASHBOARD_ID>?_g=(time:(from:now-1d%2Fd,to:now%2Fd))"
  REPORT_FORMAT: "pdf"
  REPORT_SENDER: "agente_pqrs@bbva.com"
  # Destinatarios (uno o varios separados por coma). Editable sin rebuild.
  REPORT_RECIPIENTS: "fabianandres.figueroa@bbva.com"
  REPORT_SUBJECT: "Informe PQRS - Analitica"
  # SMTP interno de BBVA (igual que co_pqrs_back_data): sin auth ni TLS.
  SMTP_HOST: "mailB.bbva.com.co"
  SMTP_PORT: "25"
