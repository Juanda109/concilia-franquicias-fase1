apiVersion: v1
kind: ConfigMap
metadata:
  name: conf-pqr-env
  labels:
    app.kubernetes.io/part-of: backend
data:
  .env: |
    BOT_NAME=blue
    ENDPOINT=https://genai-agentepqrs-work-llm-openai.openai.azure.com/
    LLM_EMBEDDINGS=agentepqrs-llm-live-emebed-3-large
    SSL_VERIFY=false
    OPENSEARCH_ENDPOINT=https://opensearch.pqr-genai-dev.svc.cluster.local:9200
    OPENSEARCH_VERIFY_SSL=false
    OPENSEARCH_CONVERSATIONS_INDEX=conversations-reference
    OPENSEARCH_MESSAGES_INDEX=conversations-messages
    OPENSEARCH_TIMEOUT=10
    LLM_MODEL=agentepqrs-llm-live-test-gpt56-terra
    BACK_DATA_SERVICE_URL=http://co-pqrs-back-data.pqr-genai-dev.svc.cluster.local:8003
    ERROR_HANDLER_SERVICE_URL=http://co-pqrs-back-error-handler.pqr-genai-dev.svc.cluster.local:8002
    AUDIT_MIN_STATUS=400
    END_CONVERSATION_CALLBACK_URL=http://co-pqrs-back-maintenance.pqr-genai-dev:8001/end/{conversation_id}
    MAX_DAILY_SESSIONS=1000
    MAX_DAILY_CATEGORY_INTERACTIONS=1000
    MAX_REPEAT_RECHECKS=1000
    TRX_SERVICE_URL=http://co-pqrs-back-trx-noreconocida.pqr-genai-dev.svc.cluster.local:8004
    # Fase 4 (co_pqrs_authorization) DESACTIVADA: aun no se usa y PRD no la tiene.
    # Sin AUTHORIZATION_SERVICE_URL el agente consulta el estado del reto directo
    # a trx (/subida-nivel/estado), igual que en PRD.

    # Token acceso pruebas
    TRX_FLOW_ENABLED=true #False = usar token; True = abierto a los clientes
    TRX_CANARY_TOKEN=BLUE-TRX-PILOTO-2026

    # Vigencia franquisias
    VIGENCIA_VISA_DIAS=180
    VIGENCIA_MASTER_DIAS=120
    # Recurrencia-bot: 1 caso por cliente cada 6 meses (indice durable).
    MAX_TRX_BOT_RECURRENCE=3
    TRX_RECURRENCIA_MESES=6
    TRX_CASES_INDEX=trx-no-reconocida-cases

    # Polling
    BACK_DATA_POLL_INTERVAL_SECONDS=0.25
    BACK_DATA_MAX_POLL_ATTEMPTS=60

    # Días hábiles configurables usados por los prompts del flujo TXNR
    DIAS_HABILES_DEVOLUCION=10
    DIAS_HABILES_TARJETA=5

    # Transacciones por pagina en el selector de doble cobro (3.4.0.6).
    # Tope: 10, que son las casillas declaradas en doble_cobro.yml.
    TRANSACTIONS_PER_PAGE=5
    DC_SERVICE_URL=http://co-pqrs-back-doble-cobro.pqr-genai-dev.svc.cluster.local:8006

    #Guardrail
    GUARDRAIL_JUDGE_ENABLED=true
    # Cierre de flujos guia redactado por el LLM. false = solo mensajes aprobados
    # del YAML (decision de negocio: el modelo no escribe lo que ve el cliente;
    # se observo que imitaba el dialecto del cliente). true = el LLM reescribe el
    # mensaje de cierre.
    LLM_CLOSURE_ENABLED=false


    #LOGS
    REQUEST_LOG_CAPTURE_ENABLED=true
    REQUEST_LOG_CAPTURE_LEVEL=INFO
    REQUEST_LOG_MAX_LINES=3000
    REQUEST_LOG_MAX_BYTES=512000
    RABBITMQ_ENABLED=true
    RABBITMQ_HOST=rabbitmq.pqr-genai-dev.svc.cluster.local
    RABBITMQ_PORT=5672
    RABBITMQ_VHOST=/
    RABBITMQ_EXCHANGE=pqr.events
    RABBITMQ_EXCHANGE_TYPE=topic
