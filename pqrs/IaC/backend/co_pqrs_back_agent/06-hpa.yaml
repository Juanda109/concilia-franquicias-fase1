apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-hpa
  labels:
    app: co-pqrs-back-agent
    app.kubernetes.io/part-of: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: co-pqrs-back-agent
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80