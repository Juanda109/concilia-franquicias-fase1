apiVersion: batch/v1
kind: Job
metadata:
  name: opensearch-bootstrap-templates
  labels:
    app.kubernetes.io/part-of: jobs
  annotations:
    # Si usan Argo CD, esto re-ejecuta el Job en cada sync (idempotente).
    # Si despliegan con kustomize/oc apply directo, borra el Job antes de re-aplicar
    # para que vuelva a correr (un Job con el mismo nombre no se re-ejecuta solo).
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: opensearch-bootstrap
        app.kubernetes.io/part-of: jobs
    spec:
      restartPolicy: OnFailure
      serviceAccountName: opensearch-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: bootstrap
          image: curlimages/curl:8.10.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          env:
            - name: OPENSEARCH_URL
              value: "https://opensearch:9200"
            - name: OPENSEARCH_USER
              value: "admin"
            # DESTRUCTIVO: si el indice existe con el mapping antiguo, lo borra y
            # recrea. En dev es seguro (los documentos de control se vuelven a crear
            # solos via upsert del agente). En PROD debe ir en "false".
            - name: FORCE_REINDEX
              value: "true"
            - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-secret
                  key: OPENSEARCH_INITIAL_ADMIN_PASSWORD
          volumeMounts:
            - name: templates
              mountPath: /templates
              readOnly: true
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              AUTH="$OPENSEARCH_USER:$OPENSEARCH_INITIAL_ADMIN_PASSWORD"
              OS="$OPENSEARCH_URL"
              INDEX="client-control-table"
              MARKER="monthly_workflow_data_blob"

              echo "Esperando a OpenSearch en $OS ..."
              i=0
              until curl -ks -u "$AUTH" "$OS" >/dev/null; do
                i=$((i+1))
                if [ "$i" -ge 60 ]; then echo "OpenSearch no respondio a tiempo"; exit 1; fi
                sleep 5
              done
              echo "OpenSearch listo."

              echo "Registrando index template (idempotente) ..."
              curl -ks -u "$AUTH" -X PUT \
                "$OS/_index_template/client-control-table" \
                -H 'Content-Type: application/json' \
                --data-binary @/templates/client-control-table-template.json
              echo

              CODE=$(curl -ks -o /dev/null -w '%{http_code}' -u "$AUTH" "$OS/$INDEX")

              if [ "$CODE" = "404" ]; then
                echo "Indice no existe -> creando desde el template ..."
                curl -ks -u "$AUTH" -X PUT "$OS/$INDEX"; echo
                echo "Bootstrap completado (indice nuevo con mapping correcto)."
                exit 0
              fi

              echo "Indice existe (HTTP $CODE). Verificando mapping ..."
              if curl -ks -u "$AUTH" "$OS/$INDEX/_mapping" | grep -q "$MARKER"; then
                echo "Mapping correcto (marcador '$MARKER' presente). No se hace nada."
                exit 0
              fi

              echo "ATENCION: el indice tiene el mapping ANTIGUO (sin '$MARKER')."
              if [ "$FORCE_REINDEX" = "true" ]; then
                echo "FORCE_REINDEX=true -> borrando y recreando el indice."
                echo "  (los documentos de control se pierden; el agente los re-crea via upsert)"
                curl -ks -u "$AUTH" -X DELETE "$OS/$INDEX"; echo
                curl -ks -u "$AUTH" -X PUT "$OS/$INDEX"; echo
                echo "Bootstrap completado (indice recreado con mapping correcto)."
              else
                echo "FORCE_REINDEX=false -> NO se modifica el indice existente."
                echo "  Corrige manualmente (DELETE + recrear) o habilita FORCE_REINDEX en este ambiente."
              fi
              exit 0
      volumes:
        - name: templates
          configMap:
            name: opensearch-index-templates
