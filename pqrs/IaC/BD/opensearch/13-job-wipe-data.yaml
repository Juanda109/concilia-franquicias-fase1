apiVersion: batch/v1
kind: CronJob
metadata:
  name: opensearch-wipe-data
  namespace: pqr-genai-dev
  labels:
    app.kubernetes.io/part-of: jobs
    app.kubernetes.io/component: opensearch-wipe-data
spec:
  # Suspendido: NUNCA se dispara por horario. Solo se ejecuta de forma manual
  suspend: true
  schedule: "0 0 31 2 *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app: opensearch-wipe-data
            app.kubernetes.io/part-of: jobs
        spec:
          restartPolicy: Never
          serviceAccountName: opensearch-sa
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          containers:
            - name: wipe
              image: curlimages/curl:8.10.1
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1000
                capabilities:
                  drop:
                    - ALL
              env:
                - name: OPENSEARCH_URL
                  value: "https://opensearch:9200"
                - name: OPENSEARCH_USER
                  value: "admin"
                - name: WIPE_INDICES
                  value: "conversations-reference conversations-messages client-control-table"
                - name: CONFIRM_WIPE
                  value: "true"
                - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: opensearch-secret
                      key: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  AUTH="$OPENSEARCH_USER:$OPENSEARCH_INITIAL_ADMIN_PASSWORD"
                  OS="$OPENSEARCH_URL"

                  if [ "$CONFIRM_WIPE" != "true" ]; then
                    echo "CONFIRM_WIPE != true -> se aborta sin borrar nada."
                    exit 1
                  fi

                  echo "Esperando a OpenSearch en $OS ..."
                  i=0
                  until curl -ks -u "$AUTH" "$OS" >/dev/null; do
                    i=$((i+1))
                    if [ "$i" -ge 60 ]; then echo "OpenSearch no respondio a tiempo"; exit 1; fi
                    sleep 5
                  done
                  echo "OpenSearch listo."

                  for INDEX in $WIPE_INDICES; do
                    CODE=$(curl -ks -o /dev/null -w '%{http_code}' -u "$AUTH" "$OS/$INDEX")
                    if [ "$CODE" = "404" ]; then
                      echo "[$INDEX] no existe (HTTP 404) -> se omite."
                      continue
                    fi

                    echo "[$INDEX] borrando todos los documentos (_delete_by_query match_all) ..."
                    curl -ks -u "$AUTH" \
                      -X POST "$OS/$INDEX/_delete_by_query?refresh=true&conflicts=proceed&wait_for_completion=true" \
                      -H 'Content-Type: application/json' \
                      -d '{"query":{"match_all":{}}}'
                    echo

                    COUNT=$(curl -ks -u "$AUTH" "$OS/$INDEX/_count" | sed -n 's/.*"count":\([0-9]*\).*/\1/p')
                    echo "[$INDEX] documentos restantes: ${COUNT:-desconocido}"
                  done

                  echo "Limpieza de OpenSearch completada."
                  exit 0
