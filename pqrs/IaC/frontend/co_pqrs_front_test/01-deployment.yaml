apiVersion: apps/v1
kind: Deployment
metadata:
  name: co-pqrs-front-test
  labels:
    app: co-pqrs-front-test
    app.kubernetes.io/name: co-pqrs-front-test
    app.kubernetes.io/part-of: frontend
    app.kubernetes.io/component: frontend-test
    app.kubernetes.io/version: v1
    app.openshift.io/runtime: python
spec:
  # Streamlit mantiene el estado de sesion en memoria y usa websockets; con mas
  # de 1 replica y un Route sin afinidad de sesion las reconexiones podrian caer
  # en otro pod. Al ser un front de PRUEBA, se deja en 1.
  replicas: 1
  selector:
    matchLabels:
      app: co-pqrs-front-test
  template:
    metadata:
      labels:
        app: co-pqrs-front-test
        app.kubernetes.io/name: co-pqrs-front-test
        app.kubernetes.io/part-of: frontend
        app.kubernetes.io/component: frontend-test
        app.kubernetes.io/version: v1
    spec:
      serviceAccountName: default
      dnsPolicy: ClusterFirst
      enableServiceLinks: false

      # SCC restringida de OKD: no fijamos runAsUser (lo asigna el cluster).
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: front
          image: quay.apps.work.ocp.co.igrupobbva/pqr-genai/co_pqrs_front_test:v5
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8501
              protocol: TCP

          env:
            - name: TZ
              value: America/Bogota

            # URL del agente dentro del cluster (el front la lee de aqui).
            - name: PQRS_AGENT_API_URL
              value: "http://co-pqrs-back-agent.pqr-genai-dev.svc.cluster.local:8000"

            # HOME escribible (UID aleatorio en OKD): Streamlit escribe ~/.streamlit.
            - name: HOME
              value: /tmp

            # ---- Vista "Benchmark" (requiere la imagen construida con
            #      co_pqrs_front_test/Dockerfile.benchmark, que trae el benchmark en /app/benchmark).
            - name: BENCHMARK_DIR
              value: /app/benchmark
            # Ruta publica de OpenSearch Dashboards (analitica) para los enlaces al tablero.
            # Es el host que OKD asigna a la Route opensearch-dashboards-analytics del namespace;
            # confirmar con: oc get route opensearch-dashboards-analytics -n pqr-genai-dev
            - name: OSD_URL
              value: "https://opensearch-dashboards-analytics-pqr-genai-dev.apps.work.ocp.co.igrupobbva"
            - name: ENVIRONMENT
              value: dev
            - name: CATALOG_VERSION
              value: 2504788d
            # Las corridas lanzadas desde el front publican sus eventos igual que el CronJob.
            - name: RABBITMQ_ENABLED
              value: "true"
            - name: RABBITMQ_HOST
              value: rabbitmq.pqr-genai-dev.svc.cluster.local
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_VHOST
              value: "/"
            - name: RABBITMQ_EXCHANGE
              value: pqr.events
            - name: RABBITMQ_EXCHANGE_TYPE
              value: topic
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: password

            # Ajustes de Streamlit para correr headless detras del Route.
            - name: STREAMLIT_SERVER_HEADLESS
              value: "true"
            - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
              value: "false"
            - name: STREAMLIT_SERVER_ENABLE_CORS
              value: "false"
            - name: STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION
              value: "false"
            - name: STREAMLIT_SERVER_FILE_WATCHER_TYPE
              value: "none"

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          startupProbe:
            httpGet:
              path: /_stcore/health
              port: http
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

      volumes:
        - name: tmp
          emptyDir: {}
