apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rabbitmq-hpa
  labels:
    app: rabbitmq
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: elk-metrics
    app.kubernetes.io/component: queue-broker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: rabbitmq
  # DEV: broker mono-nodo (NO es clúster: RABBITMQ_NODENAME=rabbit@localhost,
  # PVC por réplica). Escalar a >1 crearía brokers INDEPENDIENTES detrás del
  # mismo Service -> split-brain y pérdida de métricas (agente y Logstash
  # caerían en brokers distintos). Por eso se fija en 1/1.
  # Durabilidad ya cubierta: exchange durable + mensajes PERSISTENT + cola
  # durable "pqr-metrics" + cola persistida en disco de Logstash.
  # Producción/HA: clúster de 3 nodos + quorum queues (RabbitMQ Cluster
  # Operator / peer_discovery_k8s), réplicas fijas, SIN HPA. Ver IaC/elk/METRICS.md.
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80