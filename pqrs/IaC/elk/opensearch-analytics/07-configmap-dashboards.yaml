apiVersion: v1
kind: ConfigMap
metadata:
  name: opensearch-dashboards-analytics-config
  labels:
    app.kubernetes.io/part-of: elk-metrics
data:
  opensearch_dashboards.yml: |
    server.host: "0.0.0.0"
    server.ssl.enabled: false
    opensearch.hosts: ["https://opensearch-analytics:9200"]
    opensearch.ssl.verificationMode: none
    # Multiple Data Sources: permite registrar clústeres OpenSearch ADICIONALES
    data_source.enabled: true
