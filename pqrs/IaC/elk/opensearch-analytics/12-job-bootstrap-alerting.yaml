# Bootstrap de la alerta del canario en el OpenSearch de ANALITICA.
#
# Mismo estilo que 06-job-bootstrap-templates.yaml (curl + secret admin), pero
# aqui cada objeto se COMPRUEBA antes de crearlo: si ya existe se actualiza
# (PUT) y si no, se crea (POST). Re-sincronizar N veces no duplica nada.
#
#   1. smtp_account   -> GET/PUT/POST _plugins/_notifications/configs/<config_id>
#   2. email channel  -> idem (referencia al smtp_account por config_id)
#   3. monitor        -> busca por nombre en _plugins/_alerting/monitors/_search;
#                        PUT <_id> si existe, POST si no.
#
# Variables que el operador puede cambiar sin tocar el ConfigMap 11:
#   CANARIO_PRECISION_THRESHOLD  umbral de precision_pct (PROVISIONAL, decision de Fabian)
#   ALERT_RECIPIENTS             correos destino separados por coma
#   ALERT_LOOKBACK               ventana hacia atras del "ultimo run" (date-math: 24h, 2d)
#
# Requiere que 06 ya haya corrido (indices/templates) solo por orden logico; el
# monitor no falla si aun no existe pqr-benchmark-runs-* (0 hits = no dispara).
apiVersion: batch/v1
kind: Job
metadata:
  name: opensearch-analytics-bootstrap-alerting
  labels:
    app.kubernetes.io/part-of: elk-metrics
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: opensearch-analytics-bootstrap-alerting
        app.kubernetes.io/part-of: elk-metrics
    spec:
      restartPolicy: OnFailure
      serviceAccountName: opensearch-analytics-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: bootstrap-alerting
          image: curlimages/curl:8.10.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          env:
            - name: OS_URL
              value: "https://opensearch-analytics:9200"
            - name: OS_USER
              value: "admin"
            - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-analytics-secret
                  key: OPENSEARCH_INITIAL_ADMIN_PASSWORD
            # ---- UMBRAL PROVISIONAL (decision pendiente de Fabian) ----------------
            # precision_pct del ultimo benchmark.run con source=canario por debajo
            # de este valor dispara el correo. 90 = se tolera 1 fallo de 8 casos
            # dorados (87.5 dispara). Cambiar aqui y re-sincronizar.
            - name: CANARIO_PRECISION_THRESHOLD
              value: "90"
            # Destinatarios del correo (separados por coma, sin espacios).
            # Mismo destinatario por defecto que REPORT_RECIPIENTS de co_pqrs_back_report.
            - name: ALERT_RECIPIENTS
              value: "fabianandres.figueroa@bbva.com"
            # Solo se mira el ultimo run dentro de esta ventana; con el canario
            # apagado (suspend: true) la alerta se apaga sola al vencer.
            - name: ALERT_LOOKBACK
              value: "24h"
            # Ruta critica caida: una misma ruta con fallo en >= N corridas dentro de la ventana.
            - name: RUTA_CAIDA_LOOKBACK
              value: "70m"
            - name: RUTA_CAIDA_MIN_CORRIDAS
              value: "2"
          volumeMounts:
            - name: alerting
              mountPath: /alerting
              readOnly: true
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              AUTH="$OS_USER:$OPENSEARCH_INITIAL_ADMIN_PASSWORD"
              OS="$OS_URL"
              WORK=/tmp/alerting
              mkdir -p "$WORK"

              echo "Esperando a OpenSearch-analitica en $OS ..."
              i=0
              until curl -ks -u "$AUTH" "$OS" >/dev/null; do
                i=$((i+1))
                if [ "$i" -ge 60 ]; then echo "OpenSearch no respondio a tiempo"; exit 1; fi
                sleep 5
              done
              echo "OpenSearch-analitica listo."

              # Notifications: /features responde 200 en cuanto el plugin esta arriba.
              # Alerting: monitors/_search responde 200 si hay monitores y 404
              # (index_not_found de .opendistro-alerting-config, que solo se crea con
              # el PRIMER monitor) en un cluster recien creado. Ambos codigos son
              # "plugin listo"; exigir solo 200 dejaba el Job en Failed justo en el
              # primer despliegue.
              plugins_ready() {
                n="$(curl -ks -o /dev/null -w '%{http_code}' -u "$AUTH" "$OS/_plugins/_notifications/features")"
                [ "$n" = "200" ] || return 1
                a="$(curl -ks -o /dev/null -w '%{http_code}' -u "$AUTH" -X POST "$OS/_plugins/_alerting/monitors/_search" \
                  -H 'Content-Type: application/json' -d '{"size":0}')"
                case "$a" in
                  200|404) return 0 ;;
                  *) return 1 ;;
                esac
              }
              echo "Esperando a los plugins notifications y alerting ..."
              i=0
              until plugins_ready; do
                i=$((i+1))
                if [ "$i" -ge 30 ]; then echo "Plugins de alerting/notifications no responden"; exit 1; fi
                sleep 5
              done
              echo "Plugins listos."

              # ---- Helper: comprobar el http_code de un upsert -------------------------
              # $1 = codigo HTTP, $2 = descripcion, $3 = fichero con el cuerpo de respuesta.
              # Sin esto un 400 (JSON mal renderizado, config rechazada) terminaba el Job
              # en exit 0 y ArgoCD lo daba por bueno sin que existiera la alerta.
              check_http() {
                echo "  HTTP $1: $(cat "$3")"
                case "$1" in
                  200|201) ;;
                  *) echo "FALLO: $2 devolvio HTTP $1"; exit 1 ;;
                esac
              }

              # ---- Render de los JSON: sustituir marcadores __...__ -------------------
              RECIPIENTS_JSON=""
              OLDIFS="$IFS"; IFS=','
              for r in $ALERT_RECIPIENTS; do
                r="$(echo "$r" | tr -d ' ')"
                [ -z "$r" ] && continue
                if [ -n "$RECIPIENTS_JSON" ]; then RECIPIENTS_JSON="$RECIPIENTS_JSON,"; fi
                RECIPIENTS_JSON="$RECIPIENTS_JSON{\"recipient\":\"$r\"}"
              done
              IFS="$OLDIFS"
              if [ -z "$RECIPIENTS_JSON" ]; then echo "ALERT_RECIPIENTS vacio"; exit 1; fi

              cp /alerting/notification-smtp-account.json "$WORK/smtp.json"
              sed -e "s|__ALERT_RECIPIENTS_JSON__|$RECIPIENTS_JSON|g" \
                /alerting/notification-channel-email.json > "$WORK/channel.json"
              sed -e "s|__PRECISION_THRESHOLD__|$CANARIO_PRECISION_THRESHOLD|g" \
                  -e "s|__ALERT_LOOKBACK__|$ALERT_LOOKBACK|g" \
                /alerting/monitor-benchmark-canario-precision.json > "$WORK/monitor-precision.json"
              sed -e "s|__RUTA_CAIDA_LOOKBACK__|$RUTA_CAIDA_LOOKBACK|g" \
                  -e "s|__RUTA_CAIDA_MIN_CORRIDAS__|$RUTA_CAIDA_MIN_CORRIDAS|g" \
                /alerting/monitor-benchmark-canario-ruta-caida.json > "$WORK/monitor-ruta-caida.json"
              cp /alerting/monitor-benchmark-resumen-corrida.json "$WORK/monitor-resumen.json"
              echo "Umbral provisional precision_pct < $CANARIO_PRECISION_THRESHOLD ; ventana now-$ALERT_LOOKBACK ; ruta caida: >= $RUTA_CAIDA_MIN_CORRIDAS corridas en now-$RUTA_CAIDA_LOOKBACK ; destinatarios: $ALERT_RECIPIENTS"

              # ---- Helper: upsert de un config del Notifications plugin --------------
              # $1 = config_id fijo, $2 = fichero JSON (con config_id dentro para el POST).
              upsert_notification_config() {
                cid="$1"; f="$2"
                code="$(curl -ks -o /dev/null -w '%{http_code}' -u "$AUTH" "$OS/_plugins/_notifications/configs/$cid")"
                if [ "$code" = "200" ]; then
                  echo "  config '$cid' existe -> actualizando (PUT)"
                  rc="$(curl -ks -o "$WORK/resp.json" -w '%{http_code}' -u "$AUTH" -X PUT "$OS/_plugins/_notifications/configs/$cid" \
                    -H 'Content-Type: application/json' --data-binary @"$f")"
                  check_http "$rc" "PUT notifications config '$cid'" "$WORK/resp.json"
                else
                  echo "  config '$cid' no existe (HTTP $code) -> creando (POST)"
                  rc="$(curl -ks -o "$WORK/resp.json" -w '%{http_code}' -u "$AUTH" -X POST "$OS/_plugins/_notifications/configs" \
                    -H 'Content-Type: application/json' --data-binary @"$f")"
                  check_http "$rc" "POST notifications config '$cid'" "$WORK/resp.json"
                fi
              }

              echo "Registrando cuenta SMTP (Notifications) ..."
              upsert_notification_config "pqr-analytics-smtp" "$WORK/smtp.json"

              echo "Registrando canal email (Notifications) ..."
              upsert_notification_config "pqr-benchmark-canario-email" "$WORK/channel.json"

              # ---- Monitores (Alerting): buscar por nombre, PUT si existe, POST si no ---
              # $1 = nombre del monitor, $2 = fichero JSON renderizado.
              # Un 404 en la busqueda (cero monitores, indice de config inexistente) deja
              # MON_ID vacio y cae en el POST: es el camino normal del primer despliegue.
              upsert_monitor() {
                MON_NAME="$1"; f="$2"
                echo "Buscando monitor '$MON_NAME' por nombre ..."
                found="$(curl -ks -u "$AUTH" -X POST "$OS/_plugins/_alerting/monitors/_search" \
                  -H 'Content-Type: application/json' \
                  -d "{\"size\":1,\"query\":{\"term\":{\"monitor.name.keyword\":\"$MON_NAME\"}}}")"
                MON_ID="$(printf '%s' "$found" | grep -o '"_id"[[:space:]]*:[[:space:]]*"[^"]*"' | head -n 1 | sed 's/.*"\([^"]*\)"$/\1/')"
                if [ -n "$MON_ID" ]; then
                  echo "  monitor existe (_id=$MON_ID) -> actualizando (PUT)"
                  rc="$(curl -ks -o "$WORK/resp.json" -w '%{http_code}' -u "$AUTH" -X PUT "$OS/_plugins/_alerting/monitors/$MON_ID" \
                    -H 'Content-Type: application/json' --data-binary @"$f")"
                  check_http "$rc" "PUT monitor '$MON_NAME'" "$WORK/resp.json"
                else
                  echo "  monitor no existe -> creando (POST)"
                  rc="$(curl -ks -o "$WORK/resp.json" -w '%{http_code}' -u "$AUTH" -X POST "$OS/_plugins/_alerting/monitors" \
                    -H 'Content-Type: application/json' --data-binary @"$f")"
                  check_http "$rc" "POST monitor '$MON_NAME'" "$WORK/resp.json"
                fi
              }

              # 1) precision del canario bajo umbral  2) una misma ruta critica caida
              # en N corridas seguidas aunque el agregado siga alto  3) resumen de cada
              # corrida del benchmark completo (respuesta automatica a negocio).
              upsert_monitor "pqr-benchmark-canario-precision"  "$WORK/monitor-precision.json"
              upsert_monitor "pqr-benchmark-canario-ruta-caida" "$WORK/monitor-ruta-caida.json"
              upsert_monitor "pqr-benchmark-resumen-corrida"    "$WORK/monitor-resumen.json"
              echo "Bootstrap alerting completado."
              exit 0
      volumes:
        - name: alerting
          configMap:
            name: opensearch-analytics-alerting
