# Importa los cuatro tableros en OpenSearch Dashboards desde DENTRO del cluster.
#
# Por que existe: los .ndjson son ficheros del repositorio y Dashboards no los conoce
# hasta que alguien los importa. Quien opera desde Citrix solo tiene Argo, OpenShift,
# MinIO y Quay: no puede descargar ficheros ni usar terminal. Con este Job, importar
# los tableros es sincronizar en Argo.
#
# Es un hook PostSync: Argo lo ejecuta despues de cada sincronizacion y borra el
# anterior, asi que reimportar (tras regenerar los tableros) es volver a sincronizar.
# La importacion usa overwrite=true, de modo que repetirla no duplica nada.
apiVersion: batch/v1
kind: Job
metadata:
  name: opensearch-dashboards-import
  labels:
    app.kubernetes.io/part-of: elk-metrics
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: opensearch-dashboards-import
        app.kubernetes.io/part-of: elk-metrics
    spec:
      restartPolicy: OnFailure
      serviceAccountName: opensearch-analytics-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: import-dashboards
          image: curlimages/curl:8.10.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          env:
            - name: OSD_URL
              value: "http://opensearch-dashboards-analytics:5601"
            - name: OSD_USER
              value: "admin"
            - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-analytics-secret
                  key: OPENSEARCH_INITIAL_ADMIN_PASSWORD
          volumeMounts:
            - name: objetos
              mountPath: /tableros
              readOnly: true
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              AUTH="$OSD_USER:$OPENSEARCH_INITIAL_ADMIN_PASSWORD"

              # Se espera por CODIGO DE RESPUESTA, no por el texto del estado: la forma del
              # JSON de /api/status cambia entre versiones de Dashboards y una comprobacion
              # por texto dejaria el Job esperando sin que nadie pueda depurarlo.
              echo "Esperando a OpenSearch Dashboards en $OSD_URL ..."
              i=0
              until [ "$(curl -ks -o /dev/null -w '%{http_code}' -u "$AUTH" "$OSD_URL/api/status")" = "200" ]; do
                i=$((i+1))
                if [ "$i" -ge 90 ]; then
                  echo "Dashboards no respondio 200 a tiempo. Ultimo codigo:"
                  curl -ks -o /dev/null -w '%{http_code}\n' -u "$AUTH" "$OSD_URL/api/status"
                  exit 1
                fi
                sleep 5
              done
              echo "Dashboards listo."

              fallos=0
              for f in /tableros/*.ndjson; do
                nombre=$(basename "$f")
                echo "Importando $nombre ..."
                # El tenant Global es el compartido: si se importa en otro, solo lo ve un usuario.
                respuesta=$(curl -ks -u "$AUTH" -X POST \
                  -H 'osd-xsrf: true' -H 'securitytenant: global' \
                  -F "file=@$f" \
                  "$OSD_URL/api/saved_objects/_import?overwrite=true")
                echo "$respuesta"
                echo "$respuesta" | grep -q '"success":true' || fallos=$((fallos+1))
              done

              if [ "$fallos" -gt 0 ]; then
                echo "$fallos tablero(s) no se importaron."
                exit 1
              fi
              echo "Los cuatro tableros quedaron importados en el tenant Global."
              exit 0
      volumes:
        - name: objetos
          configMap:
            name: opensearch-dashboards-objects
