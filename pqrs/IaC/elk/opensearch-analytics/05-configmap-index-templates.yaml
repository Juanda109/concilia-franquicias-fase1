apiVersion: v1
kind: ConfigMap
metadata:
  name: opensearch-analytics-index-templates
  labels:
    app.kubernetes.io/part-of: elk-metrics
data:
  # Politica ISM (Index State Management) de retencion: borra indices diarios a los 30 dias.
  # Se auto-aplica a los indices nuevos que casen con los patrones (ism_template).
  ism-retention-30d.json: |
    {
      "policy": {
        "description": "Retencion 30 dias para indices de analitica PQRS (metricas + conversaciones).",
        "default_state": "hot",
        "states": [
          {
            "name": "hot",
            "actions": [],
            "transitions": [
              { "state_name": "delete", "conditions": { "min_index_age": "30d" } }
            ]
          },
          {
            "name": "delete",
            "actions": [ { "delete": {} } ],
            "transitions": []
          }
        ],
        "ism_template": [
          { "index_patterns": ["pqr-metrics-*", "pqr-conversations-*"], "priority": 100 }
        ]
      }
    }

  # Politica ISM de retencion para los resultados del benchmark/canario
  # (pqr-benchmark-runs-*, indices mensuales): 365 dias.
  # Prioridad distinta a la de 30d para que ISM no detecte solapes.
  ism-benchmark-retention-365d.json: |
    {
      "policy": {
        "description": "Retencion 365 dias para resultados del benchmark/canario de ruteo (benchmark.case + benchmark.run).",
        "default_state": "hot",
        "states": [
          {
            "name": "hot",
            "actions": [],
            "transitions": [
              { "state_name": "delete", "conditions": { "min_index_age": "365d" } }
            ]
          },
          {
            "name": "delete",
            "actions": [ { "delete": {} } ],
            "transitions": []
          }
        ],
        "ism_template": [
          { "index_patterns": ["pqr-benchmark-runs-*"], "priority": 210 }
        ]
      }
    }

  # Politica ISM de retencion para las conversaciones sinteticas del benchmark
  # (pqr-benchmark-conversations-*, indices mensuales): 90 dias.
  ism-benchmark-retention-90d.json: |
    {
      "policy": {
        "description": "Retencion 90 dias para conversaciones sinteticas del benchmark/canario (conversation.* con source=benchmark).",
        "default_state": "hot",
        "states": [
          {
            "name": "hot",
            "actions": [],
            "transitions": [
              { "state_name": "delete", "conditions": { "min_index_age": "90d" } }
            ]
          },
          {
            "name": "delete",
            "actions": [ { "delete": {} } ],
            "transitions": []
          }
        ],
        "ism_template": [
          { "index_patterns": ["pqr-benchmark-conversations-*"], "priority": 220 }
        ]
      }
    }

  # Metricas (sin contenido de mensajes).
  pqr-metrics-template.json: |
    {
      "index_patterns": ["pqr-metrics-*"],
      "template": {
        "settings": { "number_of_shards": 1, "number_of_replicas": 0 },
        "mappings": {
          "properties": {
            "@timestamp":          { "type": "date" },
            "ts":                  { "type": "date" },
            "event":               { "type": "keyword" },
            "conversation_id":     { "type": "keyword" },
            "user_id":             { "type": "keyword" },
            "general_workflow":    { "type": "keyword" },
            "workflow":            { "type": "keyword" },
            "current_step":        { "type": "keyword" },
            "status":              { "type": "keyword" },
            "satisfaction_status": { "type": "keyword" },
            "satisfaction_result": { "type": "boolean" },
            "error_type":          { "type": "keyword" },
            "error_message":       { "type": "text" },
            "llm_usage_status":    { "type": "keyword" },
            "llm_fallback_reason": { "type": "keyword" },
            "llm_used":            { "type": "boolean" },
            "guardrail_blocked":   { "type": "boolean" },
            "routing_outcome":     { "type": "keyword" },
            "subflow_key":         { "type": "keyword" },
            "resolution":          { "type": "keyword" },
            "limit_key":           { "type": "keyword" },
            "limit_label":         { "type": "keyword" },
            "limit_scope":         { "type": "keyword" },
            "message_count":       { "type": "long" },
            "duration_ms":         { "type": "long" },
            "duration_total_ms":   { "type": "long" },
            "tokens": {
              "properties": {
                "input_tokens":  { "type": "long" },
                "output_tokens": { "type": "long" },
                "total_tokens":  { "type": "long" }
              }
            },
            "cluster_origen":      { "type": "keyword" },
            "source":              { "type": "keyword" }
          }
        }
      }
    }

  # Traza de conversaciones (Q&A por turno). SIN enmascarado (acceso confidencial/SOC).
  pqr-conversations-template.json: |
    {
      "index_patterns": ["pqr-conversations-*"],
      "template": {
        "settings": { "number_of_shards": 1, "number_of_replicas": 0 },
        "mappings": {
          "properties": {
            "@timestamp":          { "type": "date" },
            "ts":                  { "type": "date" },
            "event":               { "type": "keyword" },
            "conversation_id":     { "type": "keyword" },
            "user_id":             { "type": "keyword" },
            "general_workflow":    { "type": "keyword" },
            "workflow":            { "type": "keyword" },
            "current_step":        { "type": "keyword" },
            "status":              { "type": "keyword" },
            "satisfaction_status": { "type": "keyword" },
            "satisfaction_result": { "type": "boolean" },
            "user_content":        { "type": "text",  "fields": { "raw": { "type": "keyword", "ignore_above": 8191 } } },
            "assistant_content":   { "type": "text" },
            "message_count":       { "type": "long" },
            "duration_ms":         { "type": "long" },
            "tokens": {
              "properties": {
                "input_tokens":  { "type": "long" },
                "output_tokens": { "type": "long" },
                "total_tokens":  { "type": "long" }
              }
            },
            "cluster_origen":      { "type": "keyword" },
            "source":              { "type": "keyword" }
          }
        }
      }
    }

  # Resultados del benchmark/canario de ruteo: un doc por caso (benchmark.case)
  # y un doc por corrida (benchmark.run). Mapping explicito de TODOS los campos
  # del contrato. priority > 0 para que nunca compita con pqr-metrics/pqr-conversations.
  pqr-benchmark-runs-template.json: |
    {
      "index_patterns": ["pqr-benchmark-runs-*"],
      "priority": 200,
      "template": {
        "settings": { "number_of_shards": 1, "number_of_replicas": 0 },
        "mappings": {
          "properties": {
            "@timestamp":              { "type": "date" },
            "timestamp":               { "type": "date" },
            "event":                   { "type": "keyword" },
            "source":                  { "type": "keyword" },
            "run_name":                { "type": "keyword" },
            "run_id":                  { "type": "keyword" },
            "catalog_version":         { "type": "keyword" },
            "environment":             { "type": "keyword" },
            "flow":                    { "type": "keyword" },
            "llm_model":               { "type": "keyword" },
            "cluster_origen":          { "type": "keyword" },

            "case_index":              { "type": "long" },
            "user_input":              { "type": "text",  "fields": { "raw": { "type": "keyword", "ignore_above": 8191 } } },
            "note":                    { "type": "text",  "fields": { "raw": { "type": "keyword", "ignore_above": 8191 } } },
            "workflow_expect":         { "type": "keyword" },
            "outcome_expect":          { "type": "keyword" },
            "workflow_result":         { "type": "keyword" },
            "workflow_llm":            { "type": "keyword" },
            "routing_outcome":         { "type": "keyword" },
            "confidence":              { "type": "keyword" },
            "acierto":                 { "type": "boolean" },
            "category": { "type": "keyword" },
            "final_step": { "type": "keyword" },
            "fail_kind":               { "type": "keyword" },
            "response_source":         { "type": "keyword" },
            "resolution":              { "type": "keyword" },
            "turns":                   { "type": "long" },
            "llm_token_input":         { "type": "long" },
            "llm_token_output":        { "type": "long" },
            "llm_token_cached":        { "type": "long" },
            "llm_token_cache_hit_pct": { "type": "float" },
            "routing_time_total_s":    { "type": "float" },
            "user_time_total_s":       { "type": "float" },
            "conversation_id":         { "type": "keyword" },

            "cases_total":             { "type": "long" },
            "cases_ok":                { "type": "long" },
            "cases_unresolved":        { "type": "long" },
            "precision_pct":           { "type": "float" },
            "precision_workflow_pct":  { "type": "float" },
            "routing_p50_s":           { "type": "float" },
            "routing_p95_s":           { "type": "float" },
            "e2e_p50_s":               { "type": "float" },
            "e2e_p95_s":               { "type": "float" },
            "tokens_input_total":      { "type": "long" },
            "tokens_output_total":     { "type": "long" },
            "cache_hit_pct_avg":       { "type": "float" },
            "duration_s":              { "type": "float" }
          }
        }
      }
    }

  # Conversaciones sinteticas del benchmark/canario (conversation.* con source=benchmark):
  # metricas Y traza en un solo indice mensual. Union de los mappings de
  # pqr-metrics + pqr-conversations (user_content/assistant_content) + source.
  pqr-benchmark-conversations-template.json: |
    {
      "index_patterns": ["pqr-benchmark-conversations-*"],
      "priority": 200,
      "template": {
        "settings": { "number_of_shards": 1, "number_of_replicas": 0 },
        "mappings": {
          "properties": {
            "@timestamp":          { "type": "date" },
            "ts":                  { "type": "date" },
            "event":               { "type": "keyword" },
            "source":              { "type": "keyword" },
            "conversation_id":     { "type": "keyword" },
            "user_id":             { "type": "keyword" },
            "general_workflow":    { "type": "keyword" },
            "workflow":            { "type": "keyword" },
            "current_step":        { "type": "keyword" },
            "status":              { "type": "keyword" },
            "satisfaction_status": { "type": "keyword" },
            "satisfaction_result": { "type": "boolean" },
            "error_type":          { "type": "keyword" },
            "error_message":       { "type": "text" },
            "llm_usage_status":    { "type": "keyword" },
            "llm_fallback_reason": { "type": "keyword" },
            "llm_used":            { "type": "boolean" },
            "guardrail_blocked":   { "type": "boolean" },
            "routing_outcome":     { "type": "keyword" },
            "subflow_key":         { "type": "keyword" },
            "resolution":          { "type": "keyword" },
            "limit_key":           { "type": "keyword" },
            "limit_label":         { "type": "keyword" },
            "limit_scope":         { "type": "keyword" },
            "user_content":        { "type": "text",  "fields": { "raw": { "type": "keyword", "ignore_above": 8191 } } },
            "assistant_content":   { "type": "text" },
            "message_count":       { "type": "long" },
            "duration_ms":         { "type": "long" },
            "duration_total_ms":   { "type": "long" },
            "tokens": {
              "properties": {
                "input_tokens":  { "type": "long" },
                "output_tokens": { "type": "long" },
                "total_tokens":  { "type": "long" }
              }
            },
            "cluster_origen":      { "type": "keyword" }
          }
        }
      }
    }
