# PLANTILLA — NO commitear valores reales ni registrar en kustomization.yaml.
# Copiar, reemplazar el valor y aplicar por-entorno:
#   oc apply -f secret.example.yaml   (con el valor real)
# o crearlo directo:
#   oc create secret generic opensearch-analytics-secret \
#     --from-literal=OPENSEARCH_INITIAL_ADMIN_PASSWORD='<PASSWORD_FUERTE>'
#
# Requisitos de OpenSearch 2.13 para el password inicial de admin:
#   min 8 caracteres, con mayuscula, minuscula, digito y caracter especial.
apiVersion: v1
kind: Secret
metadata:
  name: opensearch-analytics-secret
  labels:
    app.kubernetes.io/part-of: elk-metrics
type: Opaque
stringData:
  # Password del usuario 'admin' del OpenSearch de ANALITICA (lo usan el cluster,
  # Logstash, OSD-analitica y el CronJob de reporte).
  OPENSEARCH_INITIAL_ADMIN_PASSWORD: "REEMPLAZAR_POR_PASSWORD_FUERTE"
