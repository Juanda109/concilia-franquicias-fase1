apiVersion: batch/v1
kind: Job
metadata:
  name: opensearch-analytics-bootstrap
  labels:
    app.kubernetes.io/part-of: elk-metrics
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: opensearch-analytics-bootstrap
        app.kubernetes.io/part-of: elk-metrics
    spec:
      restartPolicy: OnFailure
      serviceAccountName: opensearch-analytics-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: bootstrap
          image: curlimages/curl:8.10.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          env:
            - name: OS_URL
              value: "https://opensearch-analytics:9200"
            - name: OS_USER
              value: "admin"
            - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-analytics-secret
                  key: OPENSEARCH_INITIAL_ADMIN_PASSWORD
          volumeMounts:
            - name: templates
              mountPath: /templates
              readOnly: true
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              AUTH="$OS_USER:$OPENSEARCH_INITIAL_ADMIN_PASSWORD"
              OS="$OS_URL"

              echo "Esperando a OpenSearch-analitica en $OS ..."
              i=0
              until curl -ks -u "$AUTH" "$OS" >/dev/null; do
                i=$((i+1))
                if [ "$i" -ge 60 ]; then echo "OpenSearch no respondio a tiempo"; exit 1; fi
                sleep 5
              done
              echo "OpenSearch-analitica listo."

              echo "Registrando politica ISM de retencion 30 dias (idempotente) ..."
              curl -ks -u "$AUTH" -X PUT \
                "$OS/_plugins/_ism/policies/pqr-analytics-retention-30d" \
                -H 'Content-Type: application/json' \
                --data-binary @/templates/ism-retention-30d.json || true
              echo

              echo "Registrando politica ISM de retencion 365 dias para el benchmark (idempotente) ..."
              curl -ks -u "$AUTH" -X PUT \
                "$OS/_plugins/_ism/policies/pqr-benchmark-retention-365d" \
                -H 'Content-Type: application/json' \
                --data-binary @/templates/ism-benchmark-retention-365d.json || true
              echo

              echo "Registrando politica ISM de retencion 90 dias para conversaciones del benchmark (idempotente) ..."
              curl -ks -u "$AUTH" -X PUT \
                "$OS/_plugins/_ism/policies/pqr-benchmark-retention-90d" \
                -H 'Content-Type: application/json' \
                --data-binary @/templates/ism-benchmark-retention-90d.json || true
              echo

              echo "Registrando index template pqr-metrics ..."
              curl -ks -u "$AUTH" -X PUT "$OS/_index_template/pqr-metrics" \
                -H 'Content-Type: application/json' \
                --data-binary @/templates/pqr-metrics-template.json
              echo

              echo "Registrando index template pqr-conversations ..."
              curl -ks -u "$AUTH" -X PUT "$OS/_index_template/pqr-conversations" \
                -H 'Content-Type: application/json' \
                --data-binary @/templates/pqr-conversations-template.json
              echo

              echo "Registrando index template pqr-benchmark-runs ..."
              curl -ks -u "$AUTH" -X PUT "$OS/_index_template/pqr-benchmark-runs" \
                -H 'Content-Type: application/json' \
                --data-binary @/templates/pqr-benchmark-runs-template.json
              echo

              echo "Registrando index template pqr-benchmark-conversations ..."
              curl -ks -u "$AUTH" -X PUT "$OS/_index_template/pqr-benchmark-conversations" \
                -H 'Content-Type: application/json' \
                --data-binary @/templates/pqr-benchmark-conversations-template.json
              echo
              echo "Bootstrap analitica completado."
              exit 0
      volumes:
        - name: templates
          configMap:
            name: opensearch-analytics-index-templates
