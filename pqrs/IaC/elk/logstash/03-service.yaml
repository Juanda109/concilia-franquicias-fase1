apiVersion: v1
kind: Service
metadata:
  name: logstash-service
  labels:
    app.kubernetes.io/part-of: elk-metrics
spec:
  selector:
    app: logstash
  ports:
  - name: beats
    protocol: TCP
    port: 5044
    targetPort: 5044
  - name: http
    protocol: TCP
    port: 8080
    targetPort: 8080