apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  labels:
    app.kubernetes.io/part-of: elk-metrics
data:
  logstash.yml: |
    api.http.host: "0.0.0.0"
    config.support_escapes: true
    pipeline.ecs_compatibility: disabled
    queue.type: persisted
    queue.max_bytes: 4gb
    path.queue: /usr/share/logstash/data/queue

  main.conf: |
    input {
      beats {
        port => 5044
      }
      http {
        port => 8080
        codec => json
      }
      # Stream de metricas de negocio del agente (eventos pqr.events).
      # El plugin logstash-input-rabbitmq viene incluido en la imagen oficial.
      rabbitmq {
        host          => "rabbitmq"
        port          => 5672
        vhost         => "/"
        user          => "${RABBITMQ_USER}"
        password      => "${RABBITMQ_PASSWORD}"
        exchange      => "pqr.events"
        exchange_type => "topic"
        durable       => true
        queue         => "pqr-metrics"
        key           => "conversation.#"
        ack           => true
        heartbeat     => 30
      }
      # Resultados del benchmark/canario (eventos benchmark.case y benchmark.run).
      # Mismo exchange, cola propia: la cola pqr-metrics y su binding no se tocan.
      rabbitmq {
        host          => "rabbitmq"
        port          => 5672
        vhost         => "/"
        user          => "${RABBITMQ_USER}"
        password      => "${RABBITMQ_PASSWORD}"
        exchange      => "pqr.events"
        exchange_type => "topic"
        durable       => true
        queue         => "pqr-benchmark"
        key           => "benchmark.#"
        ack           => true
        heartbeat     => 30
      }
    }
    filter {
      mutate {
        add_field => { "cluster_origen" => "openshift" }
      }
      # Eventos de metricas: usar su timestamp de negocio (ts) como @timestamp
      # y asegurar tipos numericos para que Kibana agregue bien.
      if [event] =~ /^conversation\./ {
        date {
          match  => ["ts", "ISO8601"]
          target => "@timestamp"
        }
        mutate {
          convert => {
            "duration_ms"            => "integer"
            "duration_total_ms"      => "integer"
            "message_count"          => "integer"
            "[tokens][input_tokens]" => "integer"
            "[tokens][output_tokens]"=> "integer"
            "[tokens][total_tokens]" => "integer"
          }
        }
      }
      # Eventos del benchmark/canario: su timestamp de negocio (timestamp, ISO UTC)
      # pasa a @timestamp y se fijan los tipos numericos/booleanos del contrato.
      else if [event] =~ /^benchmark\./ {
        date {
          match  => ["timestamp", "ISO8601"]
          target => "@timestamp"
        }
        mutate {
          convert => {
            "case_index"              => "integer"
            "turns"                   => "integer"
            "llm_token_input"         => "integer"
            "llm_token_output"        => "integer"
            "llm_token_cached"        => "integer"
            "llm_token_cache_hit_pct" => "float"
            "routing_time_total_s"    => "float"
            "user_time_total_s"       => "float"
            "acierto"                 => "boolean"
            "cases_total"             => "integer"
            "cases_ok"                => "integer"
            "cases_unresolved"        => "integer"
            "precision_pct"           => "float"
            "precision_workflow_pct"  => "float"
            "routing_p50_s"           => "float"
            "routing_p95_s"           => "float"
            "e2e_p50_s"               => "float"
            "e2e_p95_s"               => "float"
            "tokens_input_total"      => "integer"
            "tokens_output_total"     => "integer"
            "cache_hit_pct_avg"       => "float"
            "duration_s"              => "float"
          }
        }
      }
    }
    output {
      # Resultados del benchmark/canario (benchmark.case / benchmark.run)
      # -> indice mensual pqr-benchmark-runs-* (ISM 365 dias).
      if [event] =~ /^benchmark\./ {
        opensearch {
          hosts    => ["https://opensearch-analytics:9200"]
          index    => "pqr-benchmark-runs-%{+YYYY.MM}"
          user     => "admin"
          password => "${OPENSEARCH_PASSWORD}"
          ssl      => true
          ssl_certificate_verification => false
        }
      }
      # Conversaciones sinteticas abiertas por el benchmark/canario (source == "benchmark"),
      # tanto metricas (started/turn/closed/...) como la traza (conversation.trace)
      # -> indice mensual pqr-benchmark-conversations-* (ISM 90 dias).
      # Asi NO contaminan pqr-metrics-* ni pqr-conversations-*. Los eventos con
      # source == "live" o sin campo source siguen las ramas de abajo, sin cambios.
      else if [event] =~ /^conversation\./ and [source] == "benchmark" {
        opensearch {
          hosts    => ["https://opensearch-analytics:9200"]
          index    => "pqr-benchmark-conversations-%{+YYYY.MM}"
          user     => "admin"
          password => "${OPENSEARCH_PASSWORD}"
          ssl      => true
          ssl_certificate_verification => false
        }
      }
      # Traza de conversaciones (evento enriquecido con user_content/assistant_content)
      # -> indice pqr-conversations-* en OpenSearch de ANALITICA.
      else if [event] == "conversation.trace" {
        opensearch {
          hosts    => ["https://opensearch-analytics:9200"]
          index    => "pqr-conversations-%{+YYYY.MM.dd}"
          user     => "admin"
          password => "${OPENSEARCH_PASSWORD}"
          ssl      => true
          ssl_certificate_verification => false
        }
      }
      # Metricas de negocio -> indice pqr-metrics-*
      else if [event] =~ /^conversation\./ {
        opensearch {
          hosts    => ["https://opensearch-analytics:9200"]
          index    => "pqr-metrics-%{+YYYY.MM.dd}"
          user     => "admin"
          password => "${OPENSEARCH_PASSWORD}"
          ssl      => true
          ssl_certificate_verification => false
        }
      }
      # Logs tecnicos (beats/http) -> indice de logs
      else {
        opensearch {
          hosts    => ["https://opensearch-analytics:9200"]
          index    => "logs-openshift-%{+YYYY.MM.dd}"
          user     => "admin"
          password => "${OPENSEARCH_PASSWORD}"
          ssl      => true
          ssl_certificate_verification => false
        }
      }
    }