# Cuenta de servicio de logstash.
#
# Estaba definida en IaC/elk/elastic/, y al retirar aquel stack sus lineas quedaron
# comentadas en la kustomization: el deployment de logstash siguio pidiendo elk-sa,
# que ya nadie creaba. Sin cuenta, el ReplicaSet no puede crear el pod, y el sintoma
# es un deployment en "0, escalando a 1" sin pods y sin eventos.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: elk-sa
  labels:
    app.kubernetes.io/part-of: elk-metrics
---
# El init container de logstash corre como root (runAsUser: 0) para ajustar permisos
# del volumen, asi que la cuenta necesita anyuid, igual que la de analitica.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: elk-sa-anyuid
  labels:
    app.kubernetes.io/part-of: elk-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: elk-sa
