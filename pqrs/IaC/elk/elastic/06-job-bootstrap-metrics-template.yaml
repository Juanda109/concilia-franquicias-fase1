apiVersion: batch/v1
kind: Job
metadata:
  name: pqr-metrics-bootstrap-template
  labels:
    app.kubernetes.io/part-of: elk-metrics
  annotations:
    # Argo CD: re-ejecuta en cada sync (PUT de template es idempotente).
    # Con kustomize/oc apply directo: borra el Job antes de re-aplicar para re-correrlo.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: pqr-metrics-bootstrap
        app.kubernetes.io/part-of: elk-metrics
    spec:
      restartPolicy: OnFailure
      serviceAccountName: elk-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: bootstrap
          image: curlimages/curl:8.10.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          env:
            - name: ES_URL
              value: "http://elasticsearch-service.pqr-genai-dev.svc.cluster.local:9200"
            - name: ES_USER
              value: "elastic"
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elk-credentials
                  key: ELASTIC_PASSWORD
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              AUTH="$ES_USER:$ELASTIC_PASSWORD"

              echo "Esperando a Elasticsearch en $ES_URL ..."
              i=0
              until curl -ks -u "$AUTH" "$ES_URL" >/dev/null; do
                i=$((i+1))
                if [ "$i" -ge 60 ]; then echo "Elasticsearch no respondio a tiempo"; exit 1; fi
                sleep 5
              done
              echo "Elasticsearch listo."

              echo "Registrando index template pqr-metrics (idempotente) ..."
              cat > /tmp/pqr-metrics-template.json <<'JSON'
              {
                "index_patterns": ["pqr-metrics-*"],
                "template": {
                  "settings": {
                    "number_of_replicas": 0
                  },
                  "mappings": {
                    "properties": {
                      "@timestamp":          { "type": "date" },
                      "ts":                  { "type": "date" },
                      "event":               { "type": "keyword" },
                      "conversation_id":     { "type": "keyword" },
                      "user_id":             { "type": "keyword" },
                      "general_workflow":    { "type": "keyword" },
                      "workflow":            { "type": "keyword" },
                      "current_step":        { "type": "keyword" },
                      "status":              { "type": "keyword" },
                      "satisfaction_status": { "type": "keyword" },
                      "satisfaction_result": { "type": "boolean" },
                      "error_type":          { "type": "keyword" },
                      "error_message":       { "type": "text" },
                      "llm_usage_status":    { "type": "keyword" },
                      "llm_fallback_reason": { "type": "keyword" },
                      "message_count":       { "type": "long" },
                      "duration_ms":         { "type": "long" },
                      "duration_total_ms":   { "type": "long" },
                      "tokens": {
                        "properties": {
                          "input_tokens":  { "type": "long" },
                          "output_tokens": { "type": "long" },
                          "total_tokens":  { "type": "long" }
                        }
                      },
                      "cluster_origen":      { "type": "keyword" }
                    }
                  }
                }
              }
              JSON

              HTTP=$(curl -ks -o /tmp/resp.txt -w '%{http_code}' -u "$AUTH" \
                -X PUT "$ES_URL/_index_template/pqr-metrics" \
                -H 'Content-Type: application/json' \
                --data-binary @/tmp/pqr-metrics-template.json)
              echo "Respuesta ES (HTTP $HTTP):"; cat /tmp/resp.txt; echo
              case "$HTTP" in
                2*) echo "Index template pqr-metrics registrado."; exit 0 ;;
                *)  echo "Fallo al registrar el index template (HTTP $HTTP)."; exit 1 ;;
              esac
