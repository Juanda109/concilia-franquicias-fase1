apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
#ELK 
  #- elastic/00-serviceaccount.yaml
  #- elastic/01-rolebinding.yaml
  #- elastic/02-configmap.yaml
  #- elastic/03-pvc.yaml
  #- elastic/04-deployment.yaml
  #- elastic/05-service.yaml
  #- elastic/06-job-bootstrap-metrics-template.yaml
#Logstas
    # La cuenta elk-sa vivia en elastic/, que quedo retirado: sin ella el pod de
    # logstash no llega a crearse. Se declara aqui, junto al deployment que la usa.
  - logstash/04-serviceaccount.yaml
  - logstash/00-pvc.yaml
  - logstash/01-configmap.yaml
  - logstash/02-deployment.yaml
  - logstash/03-service.yaml

#KIBANA DASH
 #- kibana/00-pvc.yaml
 # - kibana/01-configmap.yaml
 # - kibana/02-deployment.yaml
 # - kibana/03-service.yaml
 # - kibana/04-route.yaml

#OPENSEARCH ANALITICA (nuevo cluster dedicado; aislado del OpenSearch operativo)
# Requiere el Secret 'opensearch-analytics-secret' (OPENSEARCH_INITIAL_ADMIN_PASSWORD),
  - opensearch-analytics/00-serviceaccount.yaml
  - opensearch-analytics/01-rolebinding-anyuid.yaml
  - opensearch-analytics/02-pvc.yaml
  - opensearch-analytics/03-deployment.yaml
  - opensearch-analytics/04-service.yaml
  - opensearch-analytics/05-configmap-index-templates.yaml
  - opensearch-analytics/06-job-bootstrap-templates.yaml
  - opensearch-analytics/07-configmap-dashboards.yaml
  - opensearch-analytics/08-deployment-dashboards.yaml
  - opensearch-analytics/09-service-dashboards.yaml
  - opensearch-analytics/10-route-dashboards.yaml
  - opensearch-analytics/11-configmap-alerting.yaml
  - opensearch-analytics/12-job-bootstrap-alerting.yaml
    # Los cuatro tableros como objetos guardados + el Job que los importa (hook PostSync):
    # sincronizar en Argo deja los tableros creados, sin terminal ni descargas.
  - opensearch-analytics/13-configmap-dashboards-objects.yaml
  - opensearch-analytics/14-job-import-dashboards.yaml


