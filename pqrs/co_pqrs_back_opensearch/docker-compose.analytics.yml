# Pipeline de analitica en LOCAL: RabbitMQ + Logstash con la MISMA configuracion
# que corre en OKD (IaC/elk/logstash/01-configmap.yaml, renderizada por
# render_logstash_local.py). Se engancha a la red del docker-compose.yml de esta
# carpeta para escribir en opensearch-node1.
#
#   docker compose -f docker-compose.yml up -d                # OpenSearch + Dashboards
#   python render_logstash_local.py                           # IaC -> .analytics-local/
#   docker compose -f docker-compose.analytics.yml run --rm logstash \
#       logstash --config.test_and_exit -f /usr/share/logstash/pipeline/logstash.conf
#   docker compose -f docker-compose.analytics.yml up -d
#
# Credenciales: RabbitMQ guest/guest (solo escucha en localhost), OpenSearch
# admin/admin (el de la imagen 2.9 local). El agente y el benchmark locales
# publican con RABBITMQ_HOST=127.0.0.1 y RABBITMQ_ENABLED=true.

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"   # consola: http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - opensearch-net

  logstash:
    # Misma imagen que IaC/elk/logstash/02-deployment.yaml.
    image: opensearchproject/logstash-oss-with-opensearch-output-plugin:8.9.0
    container_name: logstash-analytics
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_PASSWORD=admin
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
    volumes:
      - ./.analytics-local/main.conf:/usr/share/logstash/pipeline/logstash.conf
      - ./.analytics-local/logstash.yml:/usr/share/logstash/config/logstash.yml
    # Sin puertos publicados: el 9600 del host lo usa opensearch-node1 (Performance
    # Analyzer). Logs con `docker logs logstash-analytics`.
    networks:
      - opensearch-net

networks:
  opensearch-net:
    external: true
    name: co_pqrs_back_opensearch_opensearch-net
