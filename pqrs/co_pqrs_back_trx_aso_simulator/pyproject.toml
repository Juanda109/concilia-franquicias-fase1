[project]
name = "co-pqrs-back-trx-aso-simulator"
version = "0.1.0"
description = "FastAPI simulator for TXNR ASOs (grantingTicket, salesforce, financial-overview, transactions, operations, activations, reissuance)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
pythonpath = [
    "src"
]
testpaths = [
    "tests"
]
