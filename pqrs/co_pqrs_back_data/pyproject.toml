[project]
name = "co-pqrs-back-data"
version = "0.1.0"
description = "API para consultar informacion de clientes desde CSV"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.135.2",
    "httpx>=0.28.1",
    "pandas>=2.3.0",
    "psycopg[binary]>=3.2.13",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]
