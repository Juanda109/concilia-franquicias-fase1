[project]
name = "co-pqrs-back-error-handler"
version = "0.1.0"
description = "API para capturar fallos del agente, recuperar la conversacion desde OpenSearch y exportar reportes JSON locales."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.135.2",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.35.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "moto[s3]>=5.0.0",
]
