satisfaction_check:
  question: "¿Te ha ayudado esta información?"
  action: "build_satisfaction_check_message"
  input_type: "choice"
  save_as: "satisfaccion_respuesta"
  options:
    - key: "si"
      label: "Sí, me ayudó"
      next_step: "satisfaction_si"
    - key: "no"
      label: "No, ver línea de atención"
      next_step: "satisfaction_no"

satisfaction_check_faq:
  question: "¿Te ha ayudado esta información?"
  action: "build_satisfaction_check_message"
  input_type: "choice"
  save_as: "satisfaccion_respuesta"
  options:
    - key: "si"
      label: "Sí, me ayudó"
      next_step: "satisfaction_si"
    - key: "no"
      label: "No, necesito más ayuda"
      next_step: "faq_no_goto_centrales"

faq_no_goto_centrales:
  question: "Entendido, déjame conectarte con el flujo de centrales de riesgo."
  action: "goto_centrales_de_riesgo"
  input_type: "choice"
  options: []

satisfaction_si:
  question: "Gracias por comunicarte."
  action: "build_satisfaction_si_message"
  input_type: "terminal"
  terminal: true

satisfaction_no:
  question: "Gracias por comunicarte."
  action: "build_satisfaction_no_message"
  input_type: "terminal"
  terminal: true
