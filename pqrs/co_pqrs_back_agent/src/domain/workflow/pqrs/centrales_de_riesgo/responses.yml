version: 1
# Mensajes indexados por id_msg provenientes del campo hallazgos del back_data.
# Cada mensaje corresponde a un id_msg retornado en la estructura:
#   hallazgos.validaciones[].hallazgos[].id_msg
messages:
  1:
    text: |
      ¡Buenas noticias! He terminado la validación y no tienes reportes negativos en las centrales de riesgo asociados a tus productos en BBVA.

      Puedes tener la tranquilidad de que tu historial crediticio está al día y no presenta novedades negativas en este momento.
  2:
    text: |
      ¡Buenas noticias! He terminado la revisión y no tienes reportes negativos en las centrales de riesgo asociados a ninguno de tus productos en BBVA.

      Puedes tener la tranquilidad de que tu historial crediticio está al día y no presenta novedades negativas en este momento.

  3:
    text: |
      Revisé tu caso y encontré que tu contrato terminado en {key_id_last} fue vendido a {comprador}. Esta operación se realizó siguiendo la normativa vigente (Artículos 20, 333 y 335 de la Constitución Política).
      
      Para conocer el estado actual de tu obligación, por favor comunícate directamente con la nueva entidad acreedora, quien te indicará los datos de contacto y los pasos a seguir.

  4:
    text: |
      Validé tu caso y encontré que tienes un reporte negativo asociado a tu producto [{tipo_producto} / número terminado en {key_id_last}], porque quedó un pago pendiente.

      Es importante que sepas que, en tu caso, este reporte no genera un castigo.

      Tienes el detalle completo de esta información disponible en el último extracto de tu producto BBVA.

  5:
    text: |
      Validé tu caso y encontré que tienes un reporte negativo asociado a tu producto [{tipo_producto} / número terminado en {key_id_last}], generado por {motivo_reporte}.

      Es importante que sepas que, en tu caso, este reporte no genera un castigo.

      Tienes el detalle completo de esta información disponible en el último extracto de tu producto BBVA.

  6:
    option:
      key: radicar_pqrs
      label: https://peticiones.bbva.com.co/
    text: |
      Tu caso requiere una revisión a fondo por parte de nuestro equipo especializado. Para radicar tu solicitud, por favor completa el siguiente formulario. Así podremos analizar lo ocurrido con tu reporte y darte una respuesta oficial.

  7:
    text: |
      validar

  8:
    text: |
      He revisado tus productos BBVA y encontré que la información reportada coincide con tu estado actual en el banco. Ninguno de ellos presenta bloqueos que afecten tu historial:

      {tipo} terminado en {key_id_last}: {status}

      Quédate con la tranquilidad de que todo está en orden y reflejado correctamente.

  9:
    text: |
      Revisé tu caso y encontré que tu cuenta en BBVA no presenta bloqueos y la información reportada coincide con tu estado actual en el banco:

      Estado de tu cuenta: {status}

  10:
    text: |
      Hice la validación de tu caso y encontré que el embargo sobre tu cuenta  BBVA fue levantado el día {fecha}. La información reportada coincide con tu estado actual en el banco.

      El estado actual de tu cuenta es: {status}

  11:
    text: |
      Hice la validación de tu caso y encontré que los siguientes embargos sobre tu cuenta BBVA fueron levantados. La información reportada coincide con tu estado actual en el banco.

      {detalles_desembargos}

      El estado actual de tu cuenta es: {status}

  12:
    text: |
      Revisé tu caso y encontré que tu cuenta en BBVA tiene un **embargo vigente**. ¡Pero no te preocupes! Es muy importante aclararte que esto no es un **reporte negativo en tus centrales de riesgo**; simplemente es el estado actual de tu producto por esta medida.

      Aquí tienes los detalles para que los tengas a la mano:

      {detalles_embargos}

      **¿Qué sigue ahora?** Para levantar la medida, lo mejor es que te pongas en contacto directo con **{nombre_entidad}**. Ellos  crearán un oficio de desembargo, por favor recuérdales que este debe estar dirigido a nosotros como BBVA.

      Una vez que ellos nos envíen el oficio de desembargo, nosotros actualizaremos tu cuenta. Ten en cuenta que este proceso puede tardar hasta **30 días** después de que recibamos el documento.
  13:
    option:
      key: radicar_pqrs
      label: https://peticiones.bbva.com.co/
    text: |
      Tu caso requiere una revisión a fondo por parte de nuestro equipo especializado. Para radicar tu solicitud, por favor completa el siguiente formulario. Así podremos analizar lo ocurrido con tu reporte y darte una respuesta oficial.

  14:
    text: |
      Entiendo tu duda. Revisé tu caso y esa consulta ocurrió porque el {fecha} contrataste {tipo} finalizado en {contract_id_last4}.

      Puedes tener la tranquilidad de que es solo una 'huella' de consulta necesaria para el proceso y no es un reporte negativo. Tu historial crediticio sigue intacto.

  15:
