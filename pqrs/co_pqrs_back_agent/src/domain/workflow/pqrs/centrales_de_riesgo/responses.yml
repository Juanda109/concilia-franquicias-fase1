  16:
    text: |
      Comprendo tu inquietud. Revisé tu caso y encontré que la notificación preventiva sobre tu reporte se realizó a través de tu extracto bancario de tu producto en BBVA, tal como lo establece la ley.

      {detalle_notificacion}

      En tu extracto, puedes ver el aviso que indica que, tras 20 días de mora, se generaría el reporte negativo.

