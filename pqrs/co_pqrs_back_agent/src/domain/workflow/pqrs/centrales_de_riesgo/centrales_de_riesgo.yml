version: 1
start_step: "1.4.1"
steps:
  "1.4.1":
    question: |
      Para brindarte la solución adecuada, indícame cuál es tu situación:

    input_type: "choice"
    save_as: "tipo_inconveniente_centrales_de_riesgo"
    options:
      - key: "reporte_no_reconocido_o_incorrecto"
        label: "No estoy de acuerdo con mi reporte en centrales de riesgo"
        next_step: "1.4.1.0"
      - key: "embargo_o_desembargo"
        label: "Tengo un embargo o requiero información sobre un desembargo"
        next_step: "1.4.1.0.embargo"
      - key: "cartera_vendida_o_cedida"
        label: "Mi cartera fue vendida o cedida"
        next_step: "1.4.1.0.cartera_vendida"
      - key: "consulta_sin_permiso"
        label: "Consultaron mi información en centrales de riesgo sin mi autorización"
        next_step: "1.4.1.2"
      - key: "reporte_negativo_sin_notificacion"
        label: "Tengo un reporte negativo en centrales de riesgo y no recibí notificación"
        next_step: "1.4.1.3"

  "1.4.1.0":
    question: "Consultando el estado de tus productos en centrales de riesgo."
    action: "consultar_todos_productos_centrales"
    input_type: "choice"
    options:
      - key: "continuar_seleccion_producto"
        label: "Continuar"
        next_step: "satisfaction_check"

  "1.4.1.0.embargo":
    question: "Consultando el estado de tus productos para revisar tu embargo."
    action: "consultar_productos_embargo_centrales"
    input_type: "choice"
    options:
      - key: "continuar_seleccion_producto"
        label: "Continuar"
        next_step: "satisfaction_check"

  "1.4.1.0.cartera_vendida":
    question: "Consultando el estado de tus productos para revisar la venta de cartera."
    action: "consultar_productos_cartera_vendida_centrales"
    input_type: "choice"
    options:
      - key: "continuar_seleccion_producto"
        label: "Continuar"
        next_step: "satisfaction_check"

  "1.4.1.0.embargo.sin_resultados":
    question: "No encontré productos con embargo o desembargo para revisar en este momento."
    input_type: "terminal"
    terminal: true

  "1.4.1.0.embargo.sin_embargos":
    question: |
      No encontré embargos vigentes asociados a tus productos.

      Si quieres, también puedo revisar si tienes **desembargos registrados**. ¿Te gustaría consultarlos?
    input_type: "choice"
    options:
      - key: "si_consultar_desembargos"
        label: "Sí, consultar"
        next_step: "1.4.1.1.embargo.desembargos"
      - key: "no_consultar_desembargos"
        label: "No, gracias"
        next_step: "satisfaction_check"

  "1.4.1.0.embargo.sin_embargos.sin_desembargos":
    question: "No encontré embargos vigentes asociados a tus productos."
    input_type: "choice"
    options:
      - key: "continuar"
        label: "Continuar"
        next_step: "satisfaction_check"

  "1.4.1.1.embargo.ofrecer_desembargos":
