repeated_flow_warning_template: "Entiendo. Hace poco hiciste una consulta relacionada a {last_flow_label}. ¿Quieres hacer una consulta diferente?"
repeated_flow_continue_message: "Genial, por favor cuéntame tu solicitud."
repeated_flow_decline_message: "Qué bueno que logramos resolverlo. Recuerda que estoy aquí para apoyarte siempre que necesites ayuda con tus productos BBVA. Hasta pronto."
# NOTA UX: los dos textos siguientes son propuestas y deben ser validados por UX.
daily_session_limit_message: "Has alcanzado el número de sesiones disponibles por hoy. Te invito a volver mañana o, si necesitas atención inmediata, a comunicarte con nuestro equipo especializado al 601 401 0000. Estaré aquí cuando lo necesites."
repeat_flow_recheck_exhausted_message: "Hemos revisado varias consultas en esta sesión. Para darte una atención más completa, te invito a comunicarte con nuestro equipo especializado al 601 401 0000. Estaré aquí cuando lo necesites."
satisfaction_questions:
  - "¿Te ha ayudado esta información con lo que necesitabas?"
  - "¿Ha quedado clara tu duda con esta respuesta o necesitas algo más?"
  - "¿He resuelto tu consulta?"
satisfaction_si_messages:
  - "Qué bueno que logramos resolverlo. Recuerda que estoy aquí para apoyarte siempre que necesites ayuda con tus productos BBVA. Hasta pronto."
  - "¡Me alegra haberte ayudado! Estaré por aquí para lo que necesites con tus cuentas o inversiones. ¡Que tengas un buen día!"
satisfaction_no_messages:
  - "Siento no haber podido resolver tu caso por este canal. Para revisar tu caso a fondo y darte una solución, por favor contacta con nuestro equipo especializado al 601 401 0000."
  - "Lamento no tener la respuesta exacta por este medio. Para que podamos darte una solución personalizada, llámenos al 601 401 0000 y un especialista se encargará de todo."