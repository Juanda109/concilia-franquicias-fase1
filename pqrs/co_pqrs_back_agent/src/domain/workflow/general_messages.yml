  certificado_de_deuda: "obtener tu certificado de deuda"
  certificados_fondos_de_inversion: "obtener certificados de tus fondos de inversión"
  impuesto_4x1000: "una consulta sobre el 4x1000"
  puntos_y_promociones: "consultar tus puntos y promociones"
  cuota_de_manejo: "una consulta sobre la cuota de manejo"
  limites_transaccionales: "ajustar tus límites transaccionales"
