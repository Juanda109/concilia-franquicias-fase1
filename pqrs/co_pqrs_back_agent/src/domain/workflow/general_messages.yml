start_greeting_template: "Hola, {customer_name}, soy **Blue**. la asistencia virtual de BBVA. Estoy aqui para ayudarte a consultar tu informacion en centrales de riesgo y a descargar tus certificados paso a paso.\n\nCuéntame de forma detallada tu solicitud, si no puedo resolverlo, te ayudare a contactar con nuestro equipo especializado."
# NOTA UX: saludo alterno cuando no se resuelve el nombre de pila (sin "cliente"). Propuesta a validar por UX.
start_greeting_template_no_name: "Hola, soy **Blue**. Estoy aquí para ayudarte con tus consultas y solicitudes. Ten en cuenta que mi guía es informativa y si hay algo que no pueda resolver, te guiaré para contactar a nuestro equipo especializado.\n\nCuéntame qué necesitas:"
workflow_confirmation_suffix: "Quieres continuar con el flujo encontrado?"
routing_clarification_template: "Hola, en este momento solo puedo ayudarte con cobros, certificados, extractos, reportes en centrales, embargos, límites o una transacción que no reconoces. Cuéntame con cuál de esos temas necesitas apoyo."
routing_clarification_messages:
  - "Aún no tengo la respuesta de este tema, pero puedo ayudarte con consultas relacionadas a tus fondos de inversión, cuentas o leasing financiero. ¿En qué necesitas ayuda?"
  - "Esa consulta se sale de lo que puedo resolver por aquí. Para ayudarte hoy mismo, puedo darte información sobre tus fondos, cuentas o leasing. ¿Te ayudo con alguno de ellos?"
  - "Ese tema no lo manejo, pero puedo ayudarte con otras consultas relacionadas a tus fondos de inversión, cuentas o leasing financiero. ¿En qué necesitas asistencia?"
# Reintento de aclaración: PRIMER mensaje que el enrutador no logró identificar.
# Mensaje FIJO y único (no lo redacta el LLM y no rota al azar), editable aquí sin
# tocar código. Tono clave: NO rechazar el tema ("ese tema no lo manejo") ni
# culpar al cliente. El cliente solo llega al formulario PQRS si el SEGUNDO
# intento tampoco se entiende.
routing_retry_messages:
  - "No logré entender tu solicitud. Por favor escríbela de nuevo con más detalle: cuéntame de qué producto se trata (cuenta, tarjeta, crédito) y qué necesitas resolver."
# Entrada sin ninguna palabra interpretable ("9+", "...", "??"). Mensaje FIJO.
# Tono: asumir un problema de digitación, nunca dar por hecho que el cliente
# escribió mal a propósito.
unintelligible_input_messages:
  - "No pude entender tu mensaje. Por favor escríbeme con palabras qué necesitas y te ayudo."
# Frase natural por workflow para la confirmación de candidato ambiguo (confidence=low):
# se muestra como "¿Te refieres a {hint}?". Si falta un workflow, se usa su label.
