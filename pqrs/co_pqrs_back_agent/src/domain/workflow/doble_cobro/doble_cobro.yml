# Flujo: duplicidad en el cobro / doble cobro (doble_cobro).
#
# Los pasos con `action:` son GATES: el hook de
# application/chat/workflows/doble_cobro_hook.py resuelve el resultado ANTES de
# renderizar y reescribe `current_step` al branch correspondiente (mismo patron
# que trx_no_reconocida). La opcion "continuar" de esos gates es un placeholder
# estructural: el usuario nunca la ve ni la elige.
#
# El hook se engancha por el NOMBRE DE LA ACCION, no por el id del paso, para
# que renumerar el arbol no rompa la logica.
#
# Los textos que el agente ARMA en ejecucion (selector de transacciones,
# avisos de validacion, mensajes con un numero dentro) NO estan aqui: viven
# en messages.yml, en esta misma carpeta. Los pasos afectados lo indican.
version: 1
start_step: "3.4.0"
steps:
  # ----- 3.4.0: familia de producto (estatico) -----
  # Tarjeta de credito no se valida por este canal: se resuelve por ruteo
  # estatico, sin necesidad de un gate.
  "3.4.0":
    question: "Vamos a revisar el cobro duplicado en tu cuenta o tarjeta. Selecciona el producto donde tienes la novedad:"
    input_type: "choice"
    save_as: "doble_cobro_familia"
    options:
      - key: "SAVING"
        label: "Cuenta de ahorro"
        next_step: "3.4.0.1"
      - key: "CHECKING"
        label: "Cuenta corriente"
        next_step: "3.4.0.1"
      - key: "CREDIT_CARD"
        label: "Tarjeta de crédito"
        next_step: "3.4.0.pqr_tarjeta_credito"

  "3.4.0.pqr_tarjeta_credito":
    question: "Por las características de lo ocurrido, tu caso requiere una revisión a fondo por parte de nuestro equipo especializado. Por favor completa el siguiente formulario."
    input_type: "choice"
    options:
      - key: "pqr"
        label: "Formulario PQR"
        next_step: "satisfaction_check"

  # ----- 3.4.0.1: productos activos del cliente (dinamico) -----
  # El hook precarga los productos de la familia elegida y, si no hay ninguno,
  # reescribe el paso a 3.4.0.1.pqr en vez de pintar opciones vacias.
  #
  # La lista mezcla CUENTAS y TARJETAS DEBITO: el cobro pudo hacerse con
  # cualquiera de las dos y el cliente elige donde lo vio. Elegir una tarjeta
  # es lo que activa la vigencia por franquicia en el gate 3.4.0.3.
  "3.4.0.1":
    # TEXTO REAL: messages.yml -> selector_productos.pregunta
    # Lo de abajo es un respaldo que el cliente no llega a ver.
    question: "Selecciona el producto."
    action: "mostrar_productos_activos_dc"
    input_type: "choice"
    save_as: "doble_cobro_producto"
    options:
      - key: "producto_1"
        label: "Producto 1"
        next_step: "3.4.0.2"
      - key: "producto_2"
        label: "Producto 2"
        next_step: "3.4.0.2"
      - key: "producto_3"
        label: "Producto 3"
        next_step: "3.4.0.2"
      - key: "producto_4"
        label: "Producto 4"
        next_step: "3.4.0.2"
      - key: "producto_5"
        label: "Producto 5"
        next_step: "3.4.0.2"
      - key: "producto_6"
        label: "Producto 6"
        next_step: "3.4.0.2"
      - key: "producto_7"
        label: "Producto 7"
        next_step: "3.4.0.2"
      - key: "producto_8"
        label: "Producto 8"
        next_step: "3.4.0.2"

  "3.4.0.1.pqr":
    question: "No pude consultar tus productos en este momento. Para que revisemos tu caso, por favor completa el siguiente formulario."
    input_type: "choice"
    options:
      - key: "pqr"
        label: "Formulario PQR"
        next_step: "satisfaction_check"

  # ----- 3.4.0.2: fecha del cobro -----
  "3.4.0.2":
    question: |
      Selecciona la fecha en la que identificas el cobro duplicado.

      Consulta la fecha en tu extracto o en los movimientos de tu App BBVA y verifica que sea una transacción sin el estado pendiente para poder validarla desde este canal.
    input_type: "date"
    save_as: "doble_cobro_fecha"
    next_step: "3.4.0.3"

  # ----- 3.4.0.3: gate de vigencia -----
  # Tres reglas en orden: (a) dias habiles de conciliacion con el comercio
  # (5 cuenta / 7 tarjeta), (b) plazo general de 6 meses y (c) vigencia por
  # franquicia (VISA 180 / MASTER 120). La primera que falla manda.
  "3.4.0.3":
    question: "Estoy validando los tiempos de conciliación con el comercio."
    action: "validar_vigencia_doble_cobro"
    input_type: "choice"
    options:
      - key: "continuar"
        label: "Continuar"
        next_step: "3.4.0.4"

  # El numero de dias lo inyecta el hook segun el producto (dynamic_prompt).
  "3.4.0.3.pendiente":
    # TEXTO REAL: messages.yml -> vigencia.en_conciliacion (lleva el numero de
    # dias habiles, que depende del producto). Lo de abajo es un respaldo que
    # el cliente no llega a ver.
    question: "La transaccion sigue dentro del tiempo de conciliacion."
    input_type: "terminal"
    terminal: true

  "3.4.0.3.pqr":
    question: "La fecha que ingresaste supera el plazo permitido por las franquicias de la tarjeta para reportar cobros duplicados, por eso tu caso requiere una revisión a fondo por parte de nuestro equipo especializado. Por favor completa el siguiente formulario."
    input_type: "choice"
    options:
      - key: "pqr"
        label: "Formulario PQR"
        next_step: "satisfaction_check"

  # ----- 3.4.0.4: monto del cobro -----
  "3.4.0.4":
    question: |
      Ingresa el monto exacto del cobro duplicado que deseas reportar.

      Escribe solo los números (por ejemplo: 50000), sin puntos, comas, ni el signo $.
    input_type: "number"
    save_as: "doble_cobro_monto"
    next_step: "3.4.0.5"

  # ----- 3.4.0.5: gate de recurrencia -----
  # Busca en OpenSearch un reporte previo del mismo cliente para ese producto,
  # fecha y monto. Solo distingue si existe o no: el bot no interpreta en que
  # punto de gestion esta el caso, eso es competencia de negocio.
  "3.4.0.5":
    question: "Estoy validando si ya existe un reporte registrado para esta transacción."
    action: "validar_recurrencia_doble_cobro"
    input_type: "choice"
    options:
      - key: "continuar"
        label: "Continuar"
        next_step: "3.4.0.6"

  # ----- 3.4.0.6: seleccion de cobros duplicados -----
  # El hook lista TODOS los movimientos del dia dentro del rango del monto
  # (+-2000). No se recorta nada: es el cliente quien marca cuales forman el
  # cobro duplicado, y el gate 3.4.0.7 valida esa eleccion antes de registrar.
  #
  # Es un paso que se repinta a si mismo: marcar una casilla o pulsar "Ver mas
  # movimientos" reingresa al MISMO paso y el motor lo marca como repintado,
  # asi que la respuesta REEMPLAZA la tarjeta anterior en vez de encolar otra.
  # Solo "Reportar N cobros" y "No encuentro..." sacan al cliente del paso.
  # Las etiquetas y las keys son dinamicas. El tamano de pagina lo fija
  # TRANSACTIONS_PER_PAGE (por defecto 6); estas 10 casillas son el tope
  # estructural: configurar mas no pintaria mas.
  "3.4.0.6":
    # TEXTO REAL: messages.yml -> selector_transacciones.*
    # Lo de abajo es un respaldo que el cliente no llega a ver.
    question: "Selecciona los cobros duplicados."
    action: "mostrar_grupos_doble_cobro"
    input_type: "multi_select"
    save_as: "doble_cobro_trx_seleccion"
    options:
      - key: "transaccion_1"
        label: "Transacción 1"
        next_step: "3.4.0.6"

      - key: "transaccion_2"
        label: "Transacción 2"
        next_step: "3.4.0.6"

      - key: "transaccion_3"
        label: "Transacción 3"
        next_step: "3.4.0.6"

      - key: "transaccion_4"
        label: "Transacción 4"
        next_step: "3.4.0.6"

      - key: "transaccion_5"
        label: "Transacción 5"
        next_step: "3.4.0.6"

      - key: "transaccion_6"
        label: "Transacción 6"
        next_step: "3.4.0.6"

      - key: "transaccion_7"
        label: "Transacción 7"
        next_step: "3.4.0.6"

      - key: "transaccion_8"
        label: "Transacción 8"
        next_step: "3.4.0.6"

      - key: "transaccion_9"
        label: "Transacción 9"
        next_step: "3.4.0.6"

      - key: "transaccion_10"
        label: "Transacción 10"
        next_step: "3.4.0.6"

      - key: "pagina_anterior"
        label: "Página anterior"
        next_step: "3.4.0.6"

      - key: "mas_movimientos"
        label: "Ver más movimientos"
        next_step: "3.4.0.6"

      - key: "reportar_seleccionados"
        label: "Reportar seleccionados"
        next_step: "3.4.0.7"

      - key: "no_encuentro"
        label: "No encuentro la transacción en este listado."
        next_step: "3.4.0.6.pqr"

  "3.4.0.6.pqr":
    question: "Con la información disponible no podemos identificar el cobro duplicado que indicas. Tu caso necesita una revisión por parte de nuestro equipo especializado. Por favor registra tu solicitud en el siguiente formulario."
    input_type: "choice"
    options:
      - key: "pqr"
        label: "Formulario PQR"
        next_step: "satisfaction_check"

  # ----- 3.4.0.7: gate de registro -----
  # Exige al menos un grupo seleccionado; si no, vuelve a 3.4.0.6 con aviso.
  "3.4.0.7":
    question: "Estoy registrando tu reporte."
    action: "registrar_caso_doble_cobro"
    input_type: "choice"
    options:
      - key: "continuar"
        label: "Continuar"
        next_step: "3.4.0.8"

  # ----- 3.4.0.8: confirmacion de registro -----
  # Relee el caso para comprobar que quedo guardado antes de prometer el abono.
  # Fail-closed: si no se puede releer, cae a "no_procede" y no se promete nada.
  "3.4.0.8":
    question: "Estoy consultando el estado de tu reporte."
    action: "consultar_estado_doble_cobro"
    input_type: "choice"
    options:
      - key: "continuar"
        label: "Continuar"
        next_step: "3.4.0.8.no_procede"

  "3.4.0.8.pendiente":
    # TEXTO REAL: messages.yml -> confirmacion.registrado
    # Lo de abajo es un respaldo que el cliente no llega a ver.
    question: "Reporte registrado."
    input_type: "terminal"
    terminal: true

  "3.4.0.8.no_procede":
    question: "Revisamos la transacción y no identificamos un cobro duplicado con el comercio. Si crees que hay un error, puedes radicar una revisión detallada."
    input_type: "terminal"
    terminal: true
