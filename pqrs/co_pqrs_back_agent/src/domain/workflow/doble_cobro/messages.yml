# Textos del flujo Doble Cobro que el AGENTE construye en tiempo de ejecución.
#
# Los `question:` de doble_cobro.yml siguen siendo la fuente de los pasos que se
# muestran tal cual. Aquí viven los que el código arma o parametriza: el selector
# de transacciones, los avisos de validación y los mensajes con un número dentro.
#
# Los marcadores van con nombre ({dias_habiles}, {total}...), no por posición, así
# que se puede reordenar la frase sin romper nada. Cambiar un texto NO exige
# tocar código, pero sí reiniciar el servicio: el catálogo se lee al arrancar.

# --- Selector de productos (paso 3.4.0.1) ---------------------------------
selector_productos:
  pregunta: >-
    Selecciona la cuenta o tarjeta débito en la que aparece la compra que
    presenta el doble cobro:

# --- Gate de vigencia (paso 3.4.0.3) --------------------------------------
vigencia:
  # {dias_habiles} lo define DC_SETTLEMENT_DAYS en el servicio de doble cobro.
  en_conciliacion: |-
    La transacción aún está dentro del tiempo de conciliación de {dias_habiles} días hábiles con el comercio.

    Te sugerimos revisar nuevamente tus movimientos al finalizar este plazo. Si el cobro persiste, comunícate nuevamente con nosotros.

# --- Selector de transacciones (paso 3.4.0.6) -----------------------------
selector_transacciones:
  pregunta: >-
    Estos son los movimientos de la fecha por un valor parecido al que
    indicaste. Marca los que se te cobraron dos veces: tienen que ser al menos
    dos cargos del mismo comercio y por el mismo valor.

  # Solo se añade cuando hay más de una página.
  paginacion: >-
    Te muestro los movimientos {desde} a {hasta} de {total} (página {pagina} de {paginas}).

  fecha: "Fecha: {fecha}"
  seleccionadas: "Llevas {cantidad} transacción(es) seleccionada(s)."
  tope_alcanzado: "Mostramos hasta {tope} transacciones en este canal."

  # Cada casilla del listado.
  etiqueta: "{marca} {comercio} — {monto} · {detalle}"
  etiqueta_sin_detalle: "{marca} {comercio} — {monto}"
  marca_seleccionada: "☑"
  marca_sin_seleccionar: "☐"
  sin_comercio: "Sin descripción"

  botones:
    pagina_anterior: "◀ Página anterior"
    pagina_siguiente: "Ver más movimientos ▶"
    reportar: "Reportar seleccionados"
    # {cantidad} y {unidad} -> "Reportar 2 cobros"
    reportar_contador: "Reportar {cantidad} {unidad}"
    unidad_singular: "cobro"
    unidad_plural: "cobros"
    no_encuentro: "No encuentro la transacción en este listado."

# --- Validación de la selección (paso 3.4.0.7) ----------------------------
validacion:
  sin_seleccion: >-
    Selecciona al menos dos cobros iguales para poder reportarlos.

  ninguna_pareja: >-
    Ninguno de los cobros que marcaste forma una pareja. Selecciona al menos dos
    cargos del mismo comercio, por el mismo valor y en la misma fecha.

  # {detalle} -> "PAN PA YA por $7.500, TIENDA UNO por $8.000"
  descartadas: >-
    No reportamos {detalle}: para ser un cobro duplicado tienen que existir al
    menos dos cargos del mismo comercio, por el mismo valor y en la misma fecha.

  descartada_item: "{comercio} por {monto}"

# --- Confirmación del reporte (paso 3.4.0.8) ------------------------------
confirmacion:
  # El plazo va dentro del texto a propósito: es una promesa de negocio, y aquí
  # se cambia junto con la frase que la comunica.
  registrado: >-
    Hemos registrado tu reporte de cobro duplicado. En un plazo máximo de
    3 días hábiles verás reflejado el dinero en tu cuenta.
