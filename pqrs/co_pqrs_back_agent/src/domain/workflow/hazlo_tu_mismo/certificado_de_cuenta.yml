steps:
  "1":
    question: |
      Descargar tus certificados de cuenta es muy fácil. Te explico cómo hacerlo desde tu App BBVA y BBVA Net:

      ## 1. Desde tu App BBVA (Móvil 📱)

      - Abre tu app, inicia sesión y selecciona la cuenta de la que necesitas el certificado.
      - En el detalle de la cuenta, entra a la opción **Más** y selecciona **Ver certificados**.
      - Escoge el tipo de certificado (**básico**, **saldo medio** o **saldo actual**), confirma, y recibirás el documento en tu correo registrado.

      ## 2. Desde BBVA Net (Banca Online 💻)

      - Ingresa a `bbva.com.co` y haz clic en **Acceso**. Inicia sesión con tu documento de identidad y contraseña de la Net.
      - En la parte derecha, ubica la sección **Descarga tus certificados** e ingresa a **Certificado de cuenta**.
      - Selecciona el tipo de certificado que necesitas y descárgalo en tu equipo.
