  "1":
    question: |
      Gestiona los documentos de tus inversiones de forma segura y rápida. Te explico cómo hacerlo desde tu App BBVA:

      ## Desde tu App BBVA (Móvil 📱)

      1. Abre tu app, inicia sesión y dirígete a la sección **Inversiones**.
      2. Selecciona el fondo de inversión específico del cual necesitas la información.
      3. Ingresa a **Ver detalles y extractos** y elige si deseas generar un certificado o consultar tu extracto.
      4. Recibirás el documento en tu correo registrado.

      💡 Recuerda: tus documentos están protegidos; usa tu **número de identificación** como contraseña para abrirlos.

      Si tienes alguna duda adicional, escíbenos a: `sugerencias.reclamos.fiduciaria@bbva.com`
