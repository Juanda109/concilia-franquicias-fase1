    question: |
      No es necesario que hagas ningún trámite adicional ni que nos solicites la actualización. En BBVA nos encargamos de reportar **automáticamente** el estado de tus pagos a las centrales de información **cada mes**.

      Una vez realices el pago, el sistema tomará la novedad y la enviará en el siguiente ciclo de reporte. Solo es cuestión de esperar un poquito a que la central procese la información para que el cambio se vea reflejado en tu historial. ¡Nosotros hacemos el trabajo pesado por ti!
    input_type: "choice"
