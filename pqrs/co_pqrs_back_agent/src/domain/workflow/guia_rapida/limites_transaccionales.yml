start_step: "1"
steps:
  "1":
    question: |
      En este momento puedo guiarte en el proceso para ajustar tus límites transaccionales desde la App BBVA. Sigue estos pasos:

      1. Abre tu app, inicia sesión y despliega el menú principal ubicado en la parte superior (icono de las tres líneas).
      2. Busca y selecciona la opción **Configuración**.
      3. Ingresa a **Límites operacionales** y elige el medio de pago que deseas ajustar (como transferencias o pagos).
      4. Utiliza el icono del lápiz para editar el monto máximo por operación o el límite total diario.
      5. Confirma y guarda tus cambios. El sistema te solicitará validación con tu **Token Digital**.

      💡 **Información clave para tu seguridad:**
      - Si no personalizas estos límites, el banco asigna montos automáticos según tu historial.
      - Si aumentas tus límites a montos muy elevados, el sistema podría solicitarte validación final en cajero o sucursal.
      - Si eres usuario corporativo, realiza esta gestión a través de **BBVA Net Cash**.
    input_type: "choice"
    options:
      - key: "continuar"
        label: "Continuar"
        next_step: "satisfaction_check"
