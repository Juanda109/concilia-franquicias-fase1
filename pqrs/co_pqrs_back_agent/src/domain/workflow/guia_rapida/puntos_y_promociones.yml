    question: |
      Te cuento que puedes conocer todas tus Experiencias BBVA de forma muy fácil desde nuestra web. Solo sigue estos pasos:

      ## Desde BBVA Net (Banca Online 💻)

      1. Ingresa a `bbva.com.co` y accede a tu banca online con tu documento de identidad y contraseña.
      2. En el menú principal, busca la sección **Experiencias BBVA** y haz clic en **Conoce más**.
      3. Allí podrás revisar los movimientos de tus puntos, usar el simulador para proyectar tus metas y leer mensajes exclusivos sobre tus productos.
      4. Aprovecha para conocer las promociones vigentes y ajustar tus beneficios según tus preferencias.

      💡 **¿Aún necesitas ayuda con tus puntos?** Si tu solicitud no ha sido resuelta, nuestro equipo te espera en la línea de atención: `601 4010000`.
