[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "co-pqrs-back-conversation-extractor"
version = "2.0.0"
description = "Extract conversation turns from OpenSearch pqrs-metrics-* and export to Excel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opensearch-py>=2.4.2",
    "python-dotenv>=1.0.1",
    "openpyxl>=3.1.0",
    "pandas>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[tool.setuptools]
packages = ["src"]
