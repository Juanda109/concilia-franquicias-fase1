[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "co-pqrs-back-maintenance"
version = "0.1.0"
description = "Maintenance job to close inactive conversations and export closed conversations from OpenSearch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "opensearch-py>=2.4.2",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.30.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "moto[s3]>=5.0.0",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["maintenance*", "commons*", "classes*", "settings*"]
