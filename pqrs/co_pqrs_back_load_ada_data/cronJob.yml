apiVersion: batch/v1
kind: CronJob
metadata:
	name: co-pqrs-back-load-ada-data
	labels:
		app.kubernetes.io/name: co-pqrs-back-load-ada-data
spec:
	schedule: "*/30 * * * *"
	concurrencyPolicy: Forbid
	successfulJobsHistoryLimit: 3
	failedJobsHistoryLimit: 3
	jobTemplate:
		spec:
			backoffLimit: 1
			template:
				metadata:
					labels:
						app.kubernetes.io/name: co-pqrs-back-load-ada-data
				spec:
					restartPolicy: Never
					containers:
						- name: loader
							image: co-pqrs-back-load-ada-data:latest
							imagePullPolicy: IfNotPresent
							env:
								- name: DB_HOST
									valueFrom:
										secretKeyRef:
											name: co-pqrs-back-load-ada-data-db
											key: DB_HOST
								- name: DB_PORT
									value: "5432"
								- name: DB_NAME
									valueFrom:
										secretKeyRef:
											name: co-pqrs-back-load-ada-data-db
											key: DB_NAME
								- name: DB_USER
									valueFrom:
										secretKeyRef:
											name: co-pqrs-back-load-ada-data-db
											key: DB_USER
								- name: DB_PASS
									valueFrom:
										secretKeyRef:
											name: co-pqrs-back-load-ada-data-db
											key: DB_PASS
								- name: RUTA_PROCESO
									value: /mnt/ada_data
								- name: ADA_FOLDER_PREFIX
									value: pqrs_ada_data_
								- name: TARGET_TABLE
									value: ada_info_detail
								- name: PARQUET_BATCH_SIZE
									value: "50000"
							volumeMounts:
								- name: ada-data
									mountPath: /mnt/ada_data
									readOnly: true
					volumes:
						- name: ada-data
							persistentVolumeClaim:
								claimName: ada-data-pvc
