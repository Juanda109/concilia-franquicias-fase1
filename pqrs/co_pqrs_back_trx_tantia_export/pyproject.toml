[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "co-pqrs-back-trx-tantia-export"
version = "1.0.0"
description = "Consolida casos de devolucion TXNR del indice durable y genera el Excel/RPA de Tantia (AS400)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opensearch-py>=2.4.2",
    "python-dotenv>=1.0.1",
    "pandas>=1.5.0",
    # Festivos colombianos.
    "holidays>=0.103,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools]
py-modules = ["main"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
