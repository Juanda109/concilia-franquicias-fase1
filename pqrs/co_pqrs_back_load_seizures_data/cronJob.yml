apiVersion: batch/v1
kind: CronJob
metadata:
  name: co-pqrs-back-load-seizures-data
  labels:
    app.kubernetes.io/name: co-pqrs-back-load-seizures-data
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: co-pqrs-back-load-seizures-data
        spec:
          restartPolicy: Never
          containers:
            - name: loader
              image: co-pqrs-back-load-seizures-data:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: DB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: co-pqrs-back-load-seizures-data-db
                      key: DB_HOST
                - name: DB_PORT
                  value: "5432"
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: co-pqrs-back-load-seizures-data-db
                      key: DB_NAME
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: co-pqrs-back-load-seizures-data-db
                      key: DB_USER
                - name: DB_PASS
                  valueFrom:
                    secretKeyRef:
                      name: co-pqrs-back-load-seizures-data-db
                      key: DB_PASS
                - name: RUTA_PROCESO
                  value: /mnt/embargos
                - name: CSV_DELIMITER
                  value: ";"
                - name: FILE_ENCODING
                  value: cp1252
                - name: FILE_ENCODING_FALLBACKS
                  value: latin-1,utf-8
                - name: CSV_QUOTE_CHAR
                  value: "\u0001"
                - name: CSV_ESCAPE_CHAR
                  value: "\u0001"
              volumeMounts:
                - name: embargos-data
                  mountPath: /mnt/embargos
                  readOnly: true
          volumes:
            - name: embargos-data
              persistentVolumeClaim:
                claimName: embargos-data-pvc
