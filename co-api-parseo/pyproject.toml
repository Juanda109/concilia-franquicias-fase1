[project]
name = "co-api-parseo"
version = "0.1.0"
description = "Concilia Franquicias Fase 1 - API de Parseo (data-plane)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "psycopg[binary]>=3.2,<4",
    "openpyxl>=3.1,<4",
    "xlrd>=2.0,<3",
    "pydantic>=2.9,<3",
    "minio>=7.2,<8",
    # >=6.21.4: corrige CVE-2026-102993..103000, -115572/80/85 y -119203.
    "pypdf>=6.21.4,<7",
]

# Las pruebas usan assert por diseno (pytest); B101 solo aplica al codigo de
# la aplicacion. Se lee con: bandit -c pyproject.toml -r .
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
