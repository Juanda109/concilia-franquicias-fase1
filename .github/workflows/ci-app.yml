name: App

run-name: >
  ${{ startsWith(github.ref, 'refs/tags/') && format('Publish release `{0}`', github.ref_name) ||
      format('Generate snapshot `{0}`', github.sha) }}

on:
  push:
    branches:
      - main
      - develop
      - release/*
      - hotfix/*
      - bugfix/*
      - feature/*
  pull_request:
    branches:
      - main
      - develop
      - 'release/*'
      - 'bugfix/*'
      - 'hotfix/*'
      - 'feature/*'

  workflow_dispatch:

permissions: write-all

jobs:
  ci:
    name: APP
    uses: platform/reusable-workflows/.github/workflows/code-ci-app.yml@main
    secrets: inherit
