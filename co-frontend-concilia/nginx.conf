log_format concilia_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    client_max_body_size 300m;
    access_log /dev/stdout concilia_safe;
    add_header Referrer-Policy "no-referrer" always;

    # El codigo/state de OIDC viajan en la query string del retorno de
    # Nauthilus; el log_format de arriba y este no-referrer evitan que
    # queden en access logs o en el header Referer hacia otros sitios.
    location = /config.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend:8080/health;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
