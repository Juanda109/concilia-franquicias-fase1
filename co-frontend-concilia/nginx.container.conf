server {
    listen 8080;
    client_max_body_size 300m;

    # config.js se genera al arrancar el pod por ambiente: sin cache, para
    # que un cambio de client_id no quede pegado en el navegador.
    location = /config.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass http://co-backend-concilia:8080/api/;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://co-backend-concilia:8080/health;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
