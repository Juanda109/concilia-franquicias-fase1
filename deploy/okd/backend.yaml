apiVersion: apps/v1
kind: Deployment
metadata:
  name: concilia-backend
  labels:
    app: concilia-backend
    app.kubernetes.io/part-of: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: concilia-backend
  template:
    metadata:
      labels:
        app: concilia-backend
    spec:
      containers:
        - name: backend
          image: ${IMAGE_CONCILIA_BACKEND}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: concilia-config
            - secretRef:
                name: concilia-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: concilia-backend
  labels:
    app: concilia-backend
    app.kubernetes.io/part-of: backend
spec:
  selector:
    app: concilia-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
