apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: concilia-backend
  labels:
    app.kubernetes.io/part-of: backend
spec:
  # Host lo asigna la plataforma al crear el proyecto OKD. Mientras no se
  # confirme, se deja parametrizado siguiendo el mismo dominio de apps que
  # usa el resto del ambiente (ajustar si el dominio real es distinto).
  host: ${OKD_ROUTE_HOST}
  to:
    kind: Service
    name: concilia-backend
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
