openapi: 3.0.3
info:
  title: Concilia Franquicias - Fase 1 API
  version: 3.1.0
  description: Especificación API de Fase 1 para jornada, inventario, detalle, controles, errores, trazabilidad y contenido.
servers:
  - url: /api/v1
paths:
  /jornadas/actual:
    get:
      operationId: obtenerJornadaActual
      responses:
        '200': {description: Jornada vigente}
        '204': {description: Sin jornada}
  /jornadas:
    get:
      operationId: obtenerJornadaPorFecha
      parameters:
        - {in: query, name: fechaContable, required: true, schema: {type: string, format: date}}
      responses:
        '200': {description: Jornada}
        '204': {description: Sin información}
  /archivos:
    get:
      operationId: obtenerArchivos
      parameters:
        - {in: query, name: fechaContable, required: true, schema: {type: string, format: date}}
      responses:
        '200': {description: Inventario de 12 archivos}
        '204': {description: Sin información}
  /archivos/{idArchivo}:
    get:
      operationId: obtenerDetalleArchivo
      parameters:
        - {in: path, name: idArchivo, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: Detalle con controles, errores y trazabilidad}
        '404': {description: Archivo no encontrado}
  /archivos/{idArchivo}/contenido:
    get:
      operationId: obtenerContenidoArchivo
      parameters:
        - {in: path, name: idArchivo, required: true, schema: {type: integer, format: int64}}
        - {in: query, name: page, schema: {type: integer, minimum: 0, default: 0}}
        - {in: query, name: size, schema: {type: integer, minimum: 1, maximum: 100, default: 30}}
      responses:
        '200': {description: Contenido paginado}
        '404': {description: Archivo no encontrado}
        '409': {description: Archivo aún no disponible}
