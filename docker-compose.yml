services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: concilia
      POSTGRES_PASSWORD: concilia
      POSTGRES_DB: concilia
    volumes:
      - ./database/00_concilia_fase1_ddl_21_tablas.sql:/docker-entrypoint-initdb.d/00_ddl.sql:ro
      - ./database/22_seed_insumos_esperados.sql:/docker-entrypoint-initdb.d/22_seed.sql:ro
      - concilia_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concilia -d concilia"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: concilia
      MINIO_ROOT_PASSWORD: concilia123
    volumes:
      - concilia_miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  parseo:
    build:
      context: ./co-api-parseo
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgresql://concilia:concilia@postgres:5432/concilia
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: concilia-fase1
      MINIO_ACCESS_KEY: concilia
      MINIO_SECRET_KEY: concilia123
      MINIO_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  backend:
    build:
      context: ./co-backend-concilia
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://concilia:concilia@postgres:5432/concilia
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: concilia-fase1
      MINIO_ACCESS_KEY: concilia
      MINIO_SECRET_KEY: concilia123
      MINIO_SECURE: "false"
      PARSEO_API_URL: http://parseo:8081
      PAGE_SIZE: "30"
      MAX_PAGE_SIZE: "100"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      parseo:
        condition: service_started

  frontend:
    image: nginx:alpine
    volumes:
      - ./co-frontend-concilia/public:/usr/share/nginx/html:ro
      - ./co-frontend-concilia/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  concilia_pgdata:
  concilia_miniodata:
