services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: concilia
      POSTGRES_PASSWORD: concilia
      POSTGRES_DB: concilia
    volumes:
      - ./database/00_concilia_fase1_ddl_21_tablas.sql:/docker-entrypoint-initdb.d/00_ddl.sql:ro
      - ./database/22_seed_insumos_esperados.sql:/docker-entrypoint-initdb.d/22_seed.sql:ro
      - concilia_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concilia -d concilia"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO se quitó de aquí: quay.io está devolviendo "unauthorized" al bajar
  # la imagen desde esta red (política de distribución de MinIO, no es un tag
  # puntual). backend/parseo usan STORAGE_BACKEND=local en vez de MinIO real
  # — guardan/leen los archivos directo en el volumen "concilia_storage".
  # Para volver a MinIO real cuando puedas: restaura el servicio "minio" con
  # la imagen quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z, y cambia
  # STORAGE_BACKEND a "minio" (o quítalo, es el default) en backend/parseo.

  parseo:
    build:
      context: ./co-api-parseo
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgresql://concilia:concilia@postgres:5432/concilia
      STORAGE_BACKEND: local
      STORAGE_PATH: /data/storage
    volumes:
      - concilia_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./co-backend-concilia
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://concilia:concilia@postgres:5432/concilia
      STORAGE_BACKEND: local
      STORAGE_PATH: /data/storage
      PARSEO_API_URL: http://parseo:8081
      PAGE_SIZE: "30"
      MAX_PAGE_SIZE: "100"
    volumes:
      - concilia_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      parseo:
        condition: service_started

  frontend:
    image: nginx:alpine
    volumes:
      - ./co-frontend-concilia/public:/usr/share/nginx/html:ro
      - ./co-frontend-concilia/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  concilia_pgdata:
  concilia_storage:
