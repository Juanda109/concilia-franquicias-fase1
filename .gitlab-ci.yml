stages: [validate, test, build]
python-compile:
  stage: validate
  image: python:3.12-slim
  script:
    - python -m compileall -q co-backend-concilia/app
unit-tests:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -r co-api-parseo/requirements.txt
    - PYTHONPATH=co-api-parseo python co-api-parseo/tests/test_real_samples.py
backend-image:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  script:
    # Dockerfile.okd (no Dockerfile): usa la imagen base del Artifactory corporativo,
    # no la pública que usa docker-compose para desarrollo local.
    # ARTIFACTORY_USER/ARTIFACTORY_PASSWORD deben quedar como variables CI/CD protegidas.
    - docker build -f co-backend-concilia/Dockerfile.okd
        --build-arg ARTIFACTORY_USER=$ARTIFACTORY_USER
        --build-arg ARTIFACTORY_PASSWORD=$ARTIFACTORY_PASSWORD
        -t concilia-backend:$CI_COMMIT_SHA co-backend-concilia
